<title>ViroForge Pipeline Overview</title>
<style>
@font-face {
  font-family: 'JBMono';
  src: url('data:font/woff2;base64,') format('woff2');
  font-weight: 400;
  font-style: normal;
}

:root, :root[data-theme="dark"], :root[data-theme="light"] {
  --ink: #1a1d23;
  --surface: #ffffff;
  --muted: #777a80;
  --accent: #2d7d9a;
  --accent-warm: #c4643a;
  --field: #f0eeea;
  --node-bg: #ffffff;
  --node-border: #d0cfc9;
  --node-active-bg: #eaf5f8;
  --node-active-border: #2d7d9a;
  --connector: #c5c4bf;
  --panel-bg: #ffffff;
  --panel-border: #e0dfda;
  --code-bg: #f5f4f0;
  --tag-bg: #eeedea;
  --tag-text: #444750;
  --canvas-bg: #ffffff;
  --particle-viral: #2d7d9a;
  --particle-bacteria: #c4643a;
  --particle-host: #9a7b2d;
  --particle-rrna: #7b2d9a;
  --particle-phix: #5a9a2d;
  --text-primary: #1a1d23;
  --text-secondary: #3a3d44;
  --text-tertiary: #666970;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  background: var(--surface);
  color: var(--text-primary);
  line-height: 1.5;
  min-height: 100vh;
}

.mono {
  font-family: "JetBrains Mono", "SF Mono", "Fira Code", "Cascadia Code", monospace;
}

header {
  padding: 24px 32px 20px;
  border-bottom: 1px solid var(--panel-border);
  background: var(--panel-bg);
}
header h1 {
  font-family: "JetBrains Mono", "SF Mono", "Fira Code", monospace;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--accent);
}
header p {
  font-size: 13px;
  color: var(--text-tertiary);
  margin-top: 4px;
}

.app {
  display: flex;
  height: calc(100vh - 73px);
  overflow: hidden;
}

/* Pipeline column */
.pipeline {
  width: 280px;
  min-width: 280px;
  border-right: 1px solid var(--panel-border);
  background: var(--panel-bg);
  overflow-y: auto;
  padding: 20px 16px;
}

.pipeline-label {
  font-family: "JetBrains Mono", "SF Mono", "Fira Code", monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-tertiary);
  margin-bottom: 16px;
  padding-left: 4px;
}

.step-node {
  position: relative;
  padding: 10px 12px;
  margin-bottom: 4px;
  border: 1.5px solid var(--node-border);
  border-radius: 6px;
  background: var(--node-bg);
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
}
.step-node:hover {
  border-color: var(--accent);
}
.step-node.active {
  background: var(--node-active-bg);
  border-color: var(--node-active-border);
}
.step-node .step-num {
  font-family: "JetBrains Mono", "SF Mono", "Fira Code", monospace;
  font-size: 10px;
  color: var(--text-tertiary);
  letter-spacing: 0.05em;
}
.step-node.active .step-num { color: var(--accent); }
.step-node .step-name {
  font-size: 13px;
  font-weight: 550;
  margin-top: 2px;
  color: var(--text-primary);
}
.step-node .step-desc {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 2px;
  line-height: 1.4;
}

.connector {
  width: 2px;
  height: 12px;
  background: var(--connector);
  margin: 0 auto;
  position: relative;
}
.connector::after {
  content: '';
  position: absolute;
  bottom: -3px;
  left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 5px solid var(--connector);
}

/* Detail panel */
.detail {
  flex: 1;
  overflow-y: auto;
  padding: 28px 36px;
}

.detail-header {
  margin-bottom: 24px;
}
.detail-header h2 {
  font-family: "JetBrains Mono", "SF Mono", "Fira Code", monospace;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  text-wrap: balance;
}
.detail-header .subtitle {
  font-size: 14px;
  color: var(--text-secondary);
  margin-top: 6px;
  max-width: 60ch;
  line-height: 1.6;
}

/* Option tabs */
.options-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.opt-btn {
  font-family: "JetBrains Mono", "SF Mono", "Fira Code", monospace;
  font-size: 11px;
  padding: 6px 14px;
  border: 1.5px solid var(--node-border);
  border-radius: 4px;
  background: var(--node-bg);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.opt-btn:hover { border-color: var(--accent); color: var(--accent); }
.opt-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* Canvas area */
.canvas-wrap {
  background: var(--canvas-bg);
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 20px;
}
.canvas-wrap canvas {
  display: block;
  width: 100%;
  height: 340px;
  transition: height 0.3s ease;
}
.canvas-wrap.canvas-tall canvas {
  height: 440px;
}

/* Info cards */

/* Legend */
.legend {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  padding: 10px 16px;
  background: var(--field);
  border-radius: 6px;
  margin-bottom: 16px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-secondary);
}
.legend-dot {
  width: 8px; height: 8px;
  border-radius: 50%;

<header>

<div class="app">

<script>
const STEPS = [
  {
    id: 'collection', num: '01', name: 'Collection Selection',
    desc: 'Choose a virome collection',
    subtitle: 'Select from 20 curated virome collections. Click any bar to see its composition breakdown at different contamination levels (clean 0.25×, realistic 1×, heavy 2.5×).',
    options: [],
    animation: 'collection'
  },
  {
    id: 'vlp', num: '02', name: 'VLP Enrichment',
    desc: 'Concentrate viral particles',
    subtitle: 'Simulate virus-like particle enrichment to remove bacteria and host cells while retaining viral particles. Each protocol has different size selectivity and recovery characteristics.',
    options: [
      { id: 'filtration', label: 'Filtration' },
      { id: 'ultracentrifugation', label: 'Ultracentrifuge' },
      { id: 'column', label: 'Column Kit' },
      { id: 'none', label: 'No VLP (Bulk)' }
    ],
    animation: 'vlp'
  },
  {
    id: 'amplification', num: '03', name: 'Amplification',
    desc: 'Model amplification bias',
    subtitle: 'Simulate how different amplification protocols distort the original abundance distribution through GC content bias, length bias, and stochastic effects.',
    options: [
      { id: 'linker', label: 'Linker (PCR)' },
      { id: 'mda', label: 'MDA (phi29)' },
      { id: 'rdab', label: 'RdAB (RT-PCR)' },
      { id: 'none_amp', label: 'None' }
    ],
    animation: 'amplification'
  },
  {
    id: 'sequencing', num: '04', name: 'Read Simulation',
    desc: 'Generate synthetic reads',
    subtitle: 'Simulate platform-specific sequencing. Each technology produces reads with distinct length distributions, error profiles, and output formats.',
    options: [
      { id: 'novaseq', label: 'NovaSeq' },
      { id: 'miseq', label: 'MiSeq' },
      { id: 'pacbio', label: 'PacBio HiFi' },
      { id: 'nanopore', label: 'Nanopore' }
    ],
    animation: 'sequencing'
  },
  {
    id: 'artifacts', num: '05', name: 'Artifact Injection',
    desc: 'Add sequencing artifacts',
    subtitle: 'Layer realistic sequencing artifacts onto the reads: adapter read-through from short inserts, PCR duplicates with GC/length bias, low-complexity sequences, and chimeric reads from MDA.',
    options: [
      { id: 'adapters', label: 'Adapters' },
      { id: 'duplicates', label: 'PCR Duplicates' },
      { id: 'lowcomplex', label: 'Low-Complexity' }
    ],
    animation: 'artifacts'
  },
  {
    id: 'output', num: '06', name: 'Output Files',
    desc: 'FASTQ + ground truth',
    subtitle: 'Every read is labeled with its source (viral, host_dna, rrna, phix, reagent, bacterial, erv_endogenous). The output includes FASTQ files, metadata JSON, and composition tables.',
    options: [
      { id: 'fastq', label: 'FASTQ Files' },
      { id: 'metadata', label: 'Metadata JSON' },
      { id: 'manifests', label: 'Manifests' }
    ],
    animation: 'output'
  },
  {
    id: 'report', num: '07', name: 'Diagnostic Report',
    desc: 'HTML visualization',
    subtitle: 'Auto-generated HTML report with 8 diagnostic plots: composition pie chart, VLP before/after bars, family distribution, rank-abundance curve, GC histogram, genome length scatter, contamination table, and artifact summary.',
    options: [],
    animation: 'report'
  },
  {
    id: 'benchmark', num: '08', name: 'Benchmarking',
    desc: 'Score your pipeline',
    subtitle: 'Score your analysis pipeline against known ground truth. Three modules available: QC (contamination removal), Assembly (genome recovery), and Taxonomy (read/contig classification accuracy).',
    options: [
      { id: 'qc', label: 'QC Module' },
      { id: 'assembly', label: 'Assembly' },
      { id: 'taxonomy', label: 'Taxonomy' }
    ],
    animation: 'benchmark'
  }
];

// Build pipeline nav
const pipelineEl = document.getElementById('pipeline');
const detailEl = document.getElementById('detail');
const labelEl = document.createElement('div');
labelEl.className = 'pipeline-label';
labelEl.textContent = 'Pipeline Steps';
pipelineEl.appendChild(labelEl);

STEPS.forEach((step, i) => {
  if (i > 0) {
    const conn = document.createElement('div');
    conn.className = 'connector';
    pipelineEl.appendChild(conn);
  }
  const node = document.createElement('div');
  node.className = 'step-node';
  node.dataset.step = step.id;
  node.innerHTML = `<div class="step-num mono">${step.num}</div><div class="step-name">${step.name}</div><div class="step-desc">${step.desc}</div>`;
  node.addEventListener('click', () => selectStep(step));
  node.setAttribute('tabindex', '0');
  node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectStep(step); } });
  pipelineEl.appendChild(node);
});

let currentStep = null;
let currentOption = null;
let animFrame = null;

function selectStep(step) {
  currentStep = step;
  document.querySelectorAll('.step-node').forEach(n => n.classList.remove('active'));
  document.querySelector(`.step-node[data-step="${step.id}"]`).classList.add('active');
  currentOption = step.options.length > 0 ? step.options[0].id : null;
  renderDetail();
}

function renderDetail() {
  const step = currentStep;
  if (!step) return;
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  const cvs = document.getElementById('anim-canvas');
  if (cvs && cvs._collClickHandler) { cvs.removeEventListener('click', cvs._collClickHandler); cvs._collClickHandler = null; }
  if (cvs && cvs._collMoveHandler) { cvs.removeEventListener('mousemove', cvs._collMoveHandler); cvs._collMoveHandler = null; cvs.style.cursor = 'default'; }

  let optionsHtml = '';
  if (step.options.length > 0) {
    optionsHtml = `<div class="options-bar">${step.options.map(o =>
      `<button class="opt-btn${o.id === currentOption ? ' active' : ''}" data-opt="${o.id}">${o.label}</button>`
    ).join('')}</div>`;
  }

  detailEl.innerHTML = `
    <div class="detail-header">
      <h2>${step.name}</h2>
      <div class="subtitle">${step.subtitle}</div>
    </div>
    ${optionsHtml}
    <div id="legend-area"></div>
    <div class="canvas-wrap"><canvas id="anim-canvas"></canvas></div>
  `;

  detailEl.querySelectorAll('.opt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentOption = btn.dataset.opt;
      renderDetail();
    });
  });

  const canvas = document.getElementById('anim-canvas');
  const wrap = canvas.closest('.canvas-wrap');
  const splitPanelSteps = ['vlp', 'amplification', 'sequencing', 'artifacts'];
  if (step.animation === 'collection' || splitPanelSteps.includes(step.animation)) wrap.classList.add('canvas-tall');
  else wrap.classList.remove('canvas-tall');

  requestAnimationFrame(() => {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const zoom = 1.35;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr * zoom, dpr * zoom);
    const W = rect.width / zoom, H = rect.height / zoom;
    ctx.clearRect(0, 0, W, H);

    startAnimation(step.animation, currentOption, ctx, W, H);
    renderInfo(step.id, currentOption);
  });
}

function getColor(varName) {
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}

function startAnimation(type, option, ctx, W, H) {
  const colors = {
    viral: getColor('--particle-viral'),
    bacteria: getColor('--particle-bacteria'),
    host: getColor('--particle-host'),
    rrna: getColor('--particle-rrna'),
    phix: getColor('--particle-phix'),
    accent: getColor('--accent'),
    warm: getColor('--accent-warm'),
    muted: getColor('--muted'),
    bg: getColor('--canvas-bg'),
    text: getColor('--text-primary'),
    textSec: getColor('--text-secondary'),
    textTer: getColor('--text-tertiary'),
    border: getColor('--panel-border'),
    field: getColor('--field'),
  };

  if (type === 'vlp') animateVLP(option, ctx, W, H, colors);
  else if (type === 'amplification') animateAmplification(option, ctx, W, H, colors);
  else if (type === 'sequencing') animateSequencing(option, ctx, W, H, colors);
  else if (type === 'artifacts') animateArtifacts(option, ctx, W, H, colors);
  else if (type === 'collection') animateCollection(option, ctx, W, H, colors);
  else if (type === 'output') animateOutput(option, ctx, W, H, colors);
  else if (type === 'report') animateReport(ctx, W, H, colors);
  else if (type === 'benchmark') animateBenchmark(option, ctx, W, H, colors);
}

/* Particle helpers */
function makeParticle(x, y, r, type, vx, vy) {
  return { x, y, r, type, vx: vx||0, vy: vy||0, opacity: 1, alive: true };
}

function drawParticle(ctx, p, colors) {
  if (!p.alive) return;
  const c = { viral: colors.viral, bacteria: colors.bacteria, host: colors.host, rrna: colors.rrna, phix: colors.phix, fungal: '#8d6e3f', archaeal: '#5a7a3a' }[p.type] || colors.muted;
  ctx.globalAlpha = p.opacity;
  ctx.beginPath();
  if (p.type === 'bacteria') {
    ctx.ellipse(p.x, p.y, p.r * 1.6, p.r, 0, 0, Math.PI * 2);
  } else if (p.type === 'host') {
    // irregular blob
    ctx.moveTo(p.x + p.r, p.y);
    for (let a = 0; a < Math.PI * 2; a += 0.4) {
      const rr = p.r * (0.8 + 0.4 * Math.sin(a * 3.7));
      ctx.lineTo(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr);
    }
    ctx.closePath();
  } else {
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
  }
  ctx.fillStyle = c;
  ctx.fill();
  ctx.globalAlpha = 1;
}

function showLegend(items) {
  const el = document.getElementById('legend-area');
  if (!el) return;
  el.innerHTML = `<div class="legend">${items.map(([color, label]) =>
    `<div class="legend-item"><div class="legend-dot" style="background:${color}"></div>${label}</div>`
  ).join('')}</div>`;
}

/* === SPLIT PANEL HELPER === */
function drawSplitPanel(ctx, W, H, colors) {
  const midX = Math.floor(W / 2);
  const headerH = 32;
  const pad = 6;

  // Divider line
  ctx.strokeStyle = colors.border;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(midX, 0);
  ctx.lineTo(midX, H);
  ctx.stroke();

  // Column headers
  ctx.font = '14px "JetBrains Mono", monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = colors.warm;
  ctx.fillText('IN THE LAB', midX * 0.5, 20);
  ctx.fillStyle = colors.accent;
  ctx.fillText('IN VIROFORGE', midX * 1.5, 20);

  // Header underlines
  ctx.strokeStyle = colors.border + '60';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(pad, headerH);
  ctx.lineTo(midX - pad, headerH);
  ctx.moveTo(midX + pad, headerH);
  ctx.lineTo(W - pad, headerH);
  ctx.stroke();

  return { midX, headerH, pad, contentY: headerH + 6 };
}

/* === VLP ENRICHMENT ANIMATION === */
function animateVLP(option, ctx, W, H, colors) {
  showLegend([
    [colors.viral, 'Viral (20-150 nm)'],
    [colors.bacteria, 'Bacteria (1-5 µm)'],
    [colors.host, 'Host DNA (free)'],
    [colors.rrna, 'rRNA'],
  ]);

  const rng = mulberry32(42);

  if (option === 'none') {
    // No VLP — no split needed
    const particles = [];
    for (let i = 0; i < 40; i++) {
      const types = ['viral','viral','viral','viral','bacteria','bacteria','host','host','rrna'];
      const tp = types[Math.floor(rng() * types.length)];
      const sz = tp === 'bacteria' ? 8 + rng()*6 : tp === 'viral' ? 3 + rng()*5 : 4 + rng()*4;
      particles.push(makeParticle(20 + rng() * (W - 40), 30 + rng() * (H - 60), sz, tp));
    }
    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'center';
      ctx.fillText('No VLP enrichment applied', W * 0.5, H * 0.3);
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.fillText('All particles retained — bulk metagenome simulation', W * 0.5, H * 0.3 + 24);
      ctx.fillText('Bacterial reads dominate: 60–80% of total', W * 0.5, H * 0.3 + 46);
      particles.forEach(p => {
        p.x += (rng() - 0.5) * 2;
        p.y += (rng() - 0.5) * 2;
        if (p.x < 20) p.x = 20; if (p.x > W - 20) p.x = W - 20;
        if (p.y < 60) p.y = 60; if (p.y > H - 20) p.y = H - 20;
        drawParticle(ctx, p, colors);
      });
      animFrame = requestAnimationFrame(() => draw(t + 16));
    }
    draw(0);
    return;
  }

  // --- Split-panel layout for filtration / ultracentrifugation / column ---
  const particles = [];
  for (let i = 0; i < 30; i++) {
    const types = ['viral','viral','viral','viral','bacteria','bacteria','host','host','rrna'];
    const tp = types[Math.floor(rng() * types.length)];
    const sz = tp === 'bacteria' ? 6 + rng()*4 : tp === 'viral' ? 3 + rng()*4 : 3 + rng()*3;
    particles.push(makeParticle(0, 0, sz, tp, 0.3 + rng() * 0.5, (rng() - 0.5) * 0.3));
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    const sp = drawSplitPanel(ctx, W, H, colors);
    const lW = sp.midX - sp.pad * 2, rX = sp.midX + sp.pad, rW = W - sp.midX - sp.pad * 2;
    const cY = sp.contentY;
    const areaH = H - cY - 10;

    // ===== LEFT: Real lab =====
    ctx.save();
    ctx.beginPath();
    ctx.rect(sp.pad, cY, lW, areaH);
    ctx.clip();

    if (option === 'filtration') {
      const memX = sp.pad + lW * 0.5;
      // Membrane
      ctx.fillStyle = colors.border;
      ctx.fillRect(memX - 2, cY, 4, areaH);
      ctx.fillStyle = colors.bg;
      for (let y = cY + 10; y < cY + areaH; y += 22) {
        ctx.fillRect(memX - 2, y, 4, 10);
      }
      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      ctx.fillText('0.2 µm', memX, cY + areaH - 2);
      ctx.fillText('Sample', sp.pad + lW * 0.25, cY + 12);
      ctx.fillText('Filtrate', sp.pad + lW * 0.75, cY + 12);

      particles.forEach((p, i) => {
        if (t < 20) { p.x = 16 + rng() * (lW * 0.4); p.y = cY + 20 + rng() * (areaH - 40); }
        p.x += p.vx;
        p.y += p.vy + Math.sin(t * 0.002 + i) * 0.2;
        if (p.y < cY + 10 || p.y > cY + areaH - 10) p.vy *= -1;
        if (p.x > memX - 4 && p.x < memX + 4) {
          const pass = p.type === 'bacteria' ? 0.02 : p.type === 'viral' ? 0.92 : 0.15;
          if (rng() < pass) { p.x = memX + 6; } else { p.vx *= -0.5; p.x = memX - 6; }
        }
        if (p.x > sp.pad + lW - 6) { p.vx *= -0.3; p.x = sp.pad + lW - 8; }
        if (p.x < 12) { p.vx = Math.abs(p.vx); }
        drawParticle(ctx, p, colors);
      });

    } else if (option === 'ultracentrifugation') {
      const tubeL = sp.pad + lW * 0.15, tubeR = sp.pad + lW * 0.85, tubeT = cY + 20, tubeB = cY + areaH - 20;
      const tubeW = tubeR - tubeL;
      const tubeH = tubeB - tubeT;
      const tubeCX = (tubeL + tubeR) / 2;

      // Timeline (~60fps):
      //   0-180   (~3s)   mixed, gentle Brownian drift
      //   180-360 (~3s)   spin ramps up, swirl becomes visible
      //   360-900 (~9s)   full spin — swirling + sedimentation separates layers
      //   900-1100(~3s)   spin winds down, particles settle to rest
      //   1100+           done, labels appear
      const rampStart = 180, fullSpinStart = 360, spinEnd = 900, settleEnd = 1100;

      let spinSpeed = 0;
      if (t >= rampStart && t < fullSpinStart) {
        spinSpeed = (t - rampStart) / (fullSpinStart - rampStart);
      } else if (t >= fullSpinStart && t < spinEnd) {
        spinSpeed = 1;
      } else if (t >= spinEnd && t < settleEnd) {
        spinSpeed = Math.max(0, 1 - (t - spinEnd) / (settleEnd - spinEnd));
      }

      let sep = 0;
      if (t >= fullSpinStart && t < settleEnd) {
        sep = Math.min(1, (t - fullSpinStart) / (settleEnd - fullSpinStart));
      } else if (t >= settleEnd) {
        sep = 1;
      }

      // Draw tube
      ctx.strokeStyle = colors.border;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(tubeL, tubeT);
      ctx.lineTo(tubeL, tubeB - 15);
      ctx.quadraticCurveTo(tubeL, tubeB, tubeL + 15, tubeB);
      ctx.lineTo(tubeR - 15, tubeB);
      ctx.quadraticCurveTo(tubeR, tubeB, tubeR, tubeB - 15);
      ctx.lineTo(tubeR, tubeT);
      ctx.stroke();

      // Density gradient appears as separation progresses
      if (sep > 0.1) {
        const gAlpha = Math.min(1, sep * 1.3);
        const grad = ctx.createLinearGradient(0, tubeT, 0, tubeB);
        grad.addColorStop(0, 'transparent');
        grad.addColorStop(0.55, `rgba(100,100,200,${0.04 * gAlpha})`);
        grad.addColorStop(0.82, colors.bacteria + (Math.floor(20 * gAlpha)).toString(16).padStart(2, '0'));
        grad.addColorStop(0.95, colors.viral + (Math.floor(35 * gAlpha)).toString(16).padStart(2, '0'));
        ctx.fillStyle = grad;
        ctx.fillRect(tubeL + 2, tubeT, tubeW - 4, tubeH);
      }

      // Status label
      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      if (spinSpeed > 0.05) {
        ctx.fillStyle = colors.accent;
        ctx.fillText('100,000×g  ↻ spinning', (tubeL + tubeR) / 2, tubeT - 4);
      } else if (sep >= 1) {
        ctx.fillStyle = colors.textTer;
        ctx.fillText('100,000×g  done', (tubeL + tubeR) / 2, tubeT - 4);
      } else {
        ctx.fillStyle = colors.textTer;
        ctx.fillText('mixed sample', (tubeL + tubeR) / 2, tubeT - 4);
      }

      // Result labels after settling
      if (sep > 0.85) {
        const la = Math.min(1, (sep - 0.85) / 0.15);
        ctx.globalAlpha = la;
        ctx.font = '11px -apple-system, sans-serif';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        ctx.fillText('supernatant (discard)', tubeR + 4, tubeT + tubeH * 0.2);
        ctx.fillText('free DNA/rRNA stay', tubeR + 4, tubeT + tubeH * 0.2 + 14);
        ctx.fillText('in solution', tubeR + 4, tubeT + tubeH * 0.2 + 28);
        ctx.fillStyle = colors.accent;
        ctx.fillText('pellet (keep)', tubeR + 4, tubeB - 20);
        ctx.fillStyle = colors.textTer;
        ctx.fillText('virus + bacteria', tubeR + 4, tubeB - 6);
        ctx.fillText('sediment here', tubeR + 4, tubeB + 8);
        ctx.globalAlpha = 1;
      }

      // Particle simulation — swirl in liquid + sedimentation
      particles.forEach((p, i) => {
        if (!p._ucInit) {
          p._ucInit = true;
          const pRng = mulberry32(i * 37 + 7);
          p.x = tubeL + 10 + pRng() * (tubeW - 20);
          p.y = tubeT + 10 + pRng() * (tubeH - 25);
          p._vx = 0;
          p._vy = 0;
          p._phase = pRng() * Math.PI * 2;
          p._swirlR = 8 + pRng() * 15;
        }

        // Swirl: each particle orbits its own small circle, like
        // being carried by a rotating liquid. The orbit speed and
        // radius scale with spinSpeed.
        const swirlAngle = p._phase + t * 0.012 * spinSpeed;
        const swirlAmt = spinSpeed * (1 - sep * 0.7);
        const swirlOX = Math.cos(swirlAngle) * p._swirlR * swirlAmt;
        const swirlOY = Math.sin(swirlAngle) * p._swirlR * swirlAmt * 0.4;

        // Sedimentation: heavy particles sink, free molecules float up
        let targetY;
        if (p.type === 'bacteria') {
          targetY = tubeB - 8 - (i % 3) * 4;
        } else if (p.type === 'viral') {
          targetY = tubeB - 18 - (i % 5) * 4;
        } else {
          targetY = tubeT + 12 + (i % 5) * 8;
        }

        // Smoothstep easing for separation
        const s = sep * sep * (3 - 2 * sep);

        // Base position: blend from start toward target
        const baseX = p.x;
        const baseY = p.y;

        // Before spin: gentle Brownian drift
        if (t < rampStart) {
          p.x += Math.sin(t * 0.01 + p._phase) * 0.12;
          p.y += Math.cos(t * 0.008 + p._phase * 1.3) * 0.12;
        } else {
          // During/after spin: move toward target + swirl offset
          const pull = spinSpeed * 0.004;
          p._vy += (targetY - p.y) * pull;
          // Horizontal: drift toward center column
          p._vx += (tubeCX - p.x) * pull * 0.3;

          p._vx *= 0.94;
          p._vy *= 0.94;

          p.x += p._vx + swirlOX * 0.15;
          p.y += p._vy + swirlOY * 0.15;
        }

        // Clamp to tube
        if (p.x < tubeL + 6) { p.x = tubeL + 6; p._vx = Math.abs(p._vx) * 0.3; }
        if (p.x > tubeR - 6) { p.x = tubeR - 6; p._vx = -Math.abs(p._vx) * 0.3; }
        if (p.y < tubeT + 5) { p.y = tubeT + 5; p._vy = Math.abs(p._vy) * 0.2; }
        if (p.y > tubeB - 8) { p.y = tubeB - 8; p._vy = -Math.abs(p._vy) * 0.15; }

        // Fade host/rRNA after settled to show supernatant discarded
        if (sep > 0.92 && (p.type === 'host' || p.type === 'rrna')) {
          ctx.globalAlpha = Math.max(0.2, 1 - (sep - 0.92) / 0.08);
        }
        drawParticle(ctx, p, colors);
        ctx.globalAlpha = 1;
      });

    } else if (option === 'column') {
      // Five-stage Norgen column extraction matching the code:
      //   1. Lyse: break open viral capsids to release DNA
      //   2. Nuclease: degrade free host DNA/rRNA (92% efficiency)
      //   3. Load: pour lysate onto column — viral DNA binds to silica resin
      //   4. Wash: buffer flushes bacteria and debris out
      //   5. Elute: elution buffer releases bound viral DNA → collect
      //
      // Frames per stage (~60fps):
      const S = 1200; // frames per stage (~20s each)
      const stage = Math.min(5, Math.floor(t / S));
      const stageT = Math.min(1, (t - stage * S) / S);

      // Layout: top label, then working area split into upper zone + collection
      const zoneT = cY + 14;
      const zoneB = cY + areaH - 2;
      const zoneH = zoneB - zoneT;
      const midY = zoneT + zoneH * 0.55;

      // Column dimensions (shown in stages 2-4)
      const colL = sp.pad + lW * 0.22, colR = sp.pad + lW * 0.78;
      const colT = zoneT + 14, colB = midY - 4;
      const colW = colR - colL, colH = colB - colT;

      // Collection area
      const ctL = colL + 2, ctR = colR - 2;
      const ctT = midY + 10, ctB = zoneB - 2;

      // Stage label
      ctx.font = '12px -apple-system, sans-serif';
      ctx.fillStyle = colors.accent;
      ctx.textAlign = 'center';
      const labels = [
        '1. Lyse viral capsids',
        '2. Nuclease treatment',
        '3. Load onto column',
        '4. Wash contaminants',
        '5. Elute viral DNA',
        'Done — viral DNA collected',
      ];
      ctx.fillText(labels[stage], sp.pad + lW / 2, cY + 10);

      // Draw column (stages 2-5)
      if (stage >= 2) {
        ctx.fillStyle = colors.field || '#f5f5f5';
        ctx.fillRect(colL, colT, colW, colH);
        ctx.strokeStyle = colors.border;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(colL, colT, colW, colH);

        // Resin beads
        const beadRows = 4, beadCols = 3;
        for (let row = 0; row < beadRows; row++) {
          for (let col = 0; col < beadCols; col++) {
            const bx = colL + 10 + col * (colW - 20) / (beadCols - 1) + (row % 2) * 6;
            const by = colT + 8 + row * (colH - 16) / (beadRows - 1);
            if (bx > colL + 3 && bx < colR - 3) {
              ctx.fillStyle = (stage === 4) ? colors.accent + '40' : colors.muted + '18';
              ctx.beginPath(); ctx.arc(bx, by, 5, 0, Math.PI * 2); ctx.fill();
            }
          }
        }
        ctx.font = '11px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'center';
        ctx.fillText('silica resin', (colL + colR) / 2, colT - 3);

        // Spout
        ctx.strokeStyle = colors.border;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(colL + colW / 2 - 5, colB);
        ctx.lineTo(colL + colW / 2 - 5, colB + 8);
        ctx.moveTo(colL + colW / 2 + 5, colB);
        ctx.lineTo(colL + colW / 2 + 5, colB + 8);
        ctx.stroke();

        // Collection tube
        ctx.strokeStyle = stage >= 4 ? colors.accent + '80' : colors.muted + '30';
        ctx.lineWidth = 1;
        ctx.strokeRect(ctL, ctT, ctR - ctL, ctB - ctT);
        if (stage === 3) {
          ctx.font = '11px -apple-system, sans-serif';
          ctx.fillStyle = colors.textTer;
          ctx.textAlign = 'center';
          ctx.fillText('waste', (ctL + ctR) / 2, ctB + 8);
        } else if (stage >= 4) {
          ctx.font = '11px -apple-system, sans-serif';
          ctx.fillStyle = colors.accent;
          ctx.textAlign = 'center';
          ctx.fillText('collected', (ctL + ctR) / 2, ctB + 8);
        }
      }

      // Particle simulation
      particles.forEach((p, i) => {
        if (!p._colInit) {
          p._colInit = true;
          const pRng = mulberry32(i * 53 + 13);
          // Random position in sample area
          p._homeX = sp.pad + 8 + pRng() * (lW - 16);
          p._homeY = zoneT + 16 + pRng() * (zoneH * 0.4);
          p.x = p._homeX;
          p.y = p._homeY;
          // For viral particles: the DNA fragment released after lysis
          p._dnaX = p._homeX + (pRng() - 0.5) * 8;
          p._dnaY = p._homeY + (pRng() - 0.5) * 8;
          // Column bind position
          p._bindX = colL + 8 + pRng() * (colW - 16);
          p._bindY = colT + 6 + pRng() * (colH * 0.8);
          // Size-dependent binding efficiency (larger = better)
          p._viralSize = 3 + pRng() * 4; // matches particle radius
          p._bindEff = 0.6 + 0.4 * Math.min(1, (p._viralSize * 15) / 80);
          // Collection position
          p._collectX = ctL + 4 + pRng() * (ctR - ctL - 8);
          p._collectY = ctT + 4 + pRng() * (ctB - ctT - 8);
          // State flags
          p._lysed = false;
          p._degraded = false;
          p._washed = false;
        }

        let drawIt = true;
        let showBind = false;
        let drawAsDNA = false;

        if (stage === 0) {
          // LYSE: viral capsids break open, releasing DNA strands
          // Non-viral particles just drift gently
          p.x = p._homeX + Math.sin(t * 0.005 + i * 0.7) * 2;
          p.y = p._homeY + Math.cos(t * 0.004 + i * 0.5) * 1.5;

          if (p.type === 'viral') {
            // Capsid shrinks/fades, DNA appears
            const lyseT = Math.max(0, (stageT - 0.2 - (i % 6) * 0.08) / 0.5);
            const lp = Math.min(1, lyseT);
            if (lp > 0) {
              // Fading capsid
              ctx.globalAlpha = Math.max(0, 1 - lp);
              drawParticle(ctx, p, colors);
              ctx.globalAlpha = 1;
              // Emerging DNA strand (small wavy line)
              if (lp > 0.3) {
                const dnaAlpha = Math.min(1, (lp - 0.3) / 0.4);
                ctx.globalAlpha = dnaAlpha;
                ctx.strokeStyle = colors.viral;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                const dLen = 10 + p._viralSize * 2;
                for (let s = 0; s < dLen; s++) {
                  const sx = p._dnaX - dLen / 2 + s;
                  const sy = p._dnaY + Math.sin(s * 0.5 + t * 0.02) * 2;
                  if (s === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
                }
                ctx.stroke();
                ctx.globalAlpha = 1;
              }
              drawIt = false; // already drew
            }
          }

        } else if (stage === 1) {
          // NUCLEASE: degrades free host DNA and rRNA (92%)
          // Viral DNA survives (it was just released from capsids)
          if (p.type === 'viral') {
            // Show as DNA strand, drifting
            const dLen = 10 + p._viralSize * 2;
            ctx.strokeStyle = colors.viral;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let s = 0; s < dLen; s++) {
              const sx = p._dnaX - dLen / 2 + s + Math.sin(t * 0.003 + i) * 2;
              const sy = p._dnaY + Math.sin(s * 0.5 + t * 0.015) * 2 + Math.cos(t * 0.004 + i * 0.7) * 1;
              if (s === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
            }
            ctx.stroke();
            drawIt = false;
          } else if (p.type === 'host' || p.type === 'rrna') {
            // Nuclease degrades: particle shrinks and fades
            const degradeT = Math.max(0, (stageT - 0.1 - (i % 5) * 0.1) / 0.6);
            const dp = Math.min(1, degradeT);
            if (dp > 0) {
              ctx.globalAlpha = Math.max(0, 1 - dp);
              const origR = p.r;
              p.r = origR * (1 - dp * 0.7);
              drawParticle(ctx, p, colors);
              p.r = origR;
              ctx.globalAlpha = 1;
              if (dp >= 1) p._degraded = true;
              drawIt = false;
            }
          } else {
            // Bacteria: intact, nuclease doesn't affect whole cells
            p.x = p._homeX + Math.sin(t * 0.004 + i) * 1.5;
            p.y = p._homeY + Math.cos(t * 0.003 + i * 0.5) * 1;
          }

        } else if (stage === 2) {
          // LOAD onto column: viral DNA flows in and binds to resin
          // Bacteria flow through, degraded host/rRNA are gone
          if (p._degraded) { drawIt = false; }
          else if (p.type === 'viral') {
            // DNA moves from sample area into column, binds to resin
            const ease = stageT * stageT * (3 - 2 * stageT);
            const dLen = 10 + p._viralSize * 2;
            const curX = p._dnaX + (p._bindX - p._dnaX) * ease;
            const curY = p._dnaY + (p._bindY - p._dnaY) * ease;
            ctx.strokeStyle = colors.viral;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            const wobble = (1 - ease) * 2;
            for (let s = 0; s < dLen; s++) {
              const sx = curX - dLen / 2 + s;
              const sy = curY + Math.sin(s * 0.5 + t * 0.015) * wobble;
              if (s === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
            }
            ctx.stroke();
            if (ease > 0.8) {
              // Glow ring shows binding
              ctx.strokeStyle = colors.accent + '40';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.arc(curX, curY, dLen / 2 + 3, 0, Math.PI * 2);
              ctx.stroke();
            }
            drawIt = false;
          } else if (p.type === 'bacteria') {
            // Bacteria flow through column to bottom
            const ease = stageT * stageT * (3 - 2 * stageT);
            p.x = p._homeX + (colL + colW / 2 - p._homeX) * Math.min(1, ease * 1.5);
            p.y = p._homeY + (colB + 2 - p._homeY) * ease;
            if (ease > 0.9) ctx.globalAlpha = Math.max(0.1, 1 - (ease - 0.9) / 0.1);
          }

        } else if (stage === 3) {
          // WASH: buffer flushes bacteria out, viral DNA stays bound
          if (p._degraded) { drawIt = false; }
          else if (p.type === 'viral') {
            // Bound DNA: gentle wobble on resin
            const dLen = 10 + p._viralSize * 2;
            ctx.strokeStyle = colors.viral;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let s = 0; s < dLen; s++) {
              const sx = p._bindX - dLen / 2 + s;
              const sy = p._bindY + Math.sin(s * 0.5 + t * 0.01) * 0.8;
              if (s === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
            }
            ctx.stroke();
            ctx.strokeStyle = colors.accent + '35';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(p._bindX, p._bindY, dLen / 2 + 3, 0, Math.PI * 2);
            ctx.stroke();
            drawIt = false;
          } else {
            // Bacteria/remaining: wash down and out
            if (!p._washed) {
              const wy = colB + 2 + stageT * (ctB - colB);
              p.y = wy;
              p.x = colL + colW / 2 + Math.sin(i) * 6;
              if (stageT > 0.7) {
                ctx.globalAlpha = Math.max(0, 1 - (stageT - 0.7) / 0.3);
                if (stageT > 0.95) p._washed = true;
              }
            }
            if (p._washed) drawIt = false;
          }

        } else if (stage === 4) {
          // ELUTE: elution buffer releases viral DNA from resin → collect
          if (p.type === 'viral') {
            const releaseDelay = (i % 10) * 0.05;
            const localT = Math.max(0, Math.min(1, (stageT - releaseDelay) / (0.7)));
            const ease = localT * localT * (3 - 2 * localT);
            const dLen = 10 + p._viralSize * 2;
            const curX = p._bindX + (p._collectX - p._bindX) * ease;
            const curY = p._bindY + (p._collectY - p._bindY) * ease;

            ctx.strokeStyle = colors.viral;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            const wobble = (1 - ease) * 1.5;
            for (let s = 0; s < dLen; s++) {
              const sx = curX - dLen / 2 + s;
              const sy = curY + Math.sin(s * 0.5 + t * 0.01) * wobble;
              if (s === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
            }
            ctx.stroke();

            if (ease < 0.2) {
              ctx.strokeStyle = colors.accent + '35';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.arc(p._bindX, p._bindY, dLen / 2 + 3, 0, Math.PI * 2);
              ctx.stroke();
            }
            drawIt = false;
          } else {
            drawIt = false;
          }

        } else {
          // DONE: viral DNA in collection tube
          if (p.type === 'viral') {
            const dLen = 10 + p._viralSize * 2;
            ctx.strokeStyle = colors.viral;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let s = 0; s < dLen; s++) {
              const sx = p._collectX - dLen / 2 + s;
              const sy = p._collectY + Math.sin(s * 0.5) * 0.5;
              if (s === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
            }
            ctx.stroke();
            drawIt = false;
          } else {
            drawIt = false;
          }
        }

        if (drawIt) {
          drawParticle(ctx, p, colors);
          ctx.globalAlpha = 1;
        }
      });
    }
    ctx.restore();

    // ===== RIGHT: ViroForge model =====
    ctx.save();
    ctx.beginPath();
    ctx.rect(rX, cY, rW, areaH);
    ctx.clip();

    if (option === 'filtration') {
      // Sigmoid retention curve
      ctx.font = '12px -apple-system, sans-serif';
      ctx.fillStyle = colors.accent;
      ctx.textAlign = 'center';
      ctx.fillText('Sigmoid retention model', rX + rW / 2, cY + 14);

      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.fillText('P(pass) = 1 / (1 + exp(s·(d − pore)))', rX + rW / 2, cY + 30);

      // Plot sigmoid on LOG scale (10 nm – 10,000 nm)
      const plotL = rX + 24, plotR = rX + rW - 10;
      const plotT = cY + 42, plotB = cY + areaH * 0.55;
      const plotW = plotR - plotL, plotH = plotB - plotT;
      const logMin = Math.log10(10), logMax = Math.log10(10000);
      const logRange = logMax - logMin; // 3 decades
      function nmToPx(nm) { return plotL + ((Math.log10(nm) - logMin) / logRange) * plotW; }

      // Axes
      ctx.strokeStyle = colors.border;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(plotL, plotB);
      ctx.lineTo(plotR, plotB);
      ctx.moveTo(plotL, plotT);
      ctx.lineTo(plotL, plotB);
      ctx.stroke();

      // Log-scale tick marks
      ctx.font = '9px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      [10, 100, 1000, 10000].forEach(nm => {
        const tx = nmToPx(nm);
        ctx.beginPath();
        ctx.moveTo(tx, plotB);
        ctx.lineTo(tx, plotB + 4);
        ctx.stroke();
        ctx.fillText(nm >= 1000 ? (nm/1000) + 'µm' : nm + 'nm', tx, plotB + 13);
      });

      // Sigmoid curve
      ctx.beginPath();
      ctx.strokeStyle = colors.accent;
      ctx.lineWidth = 2;
      const pore = 200;
      const s = 0.04;
      for (let px = 0; px < plotW; px++) {
        const logD = logMin + (px / plotW) * logRange;
        const d = Math.pow(10, logD);
        const p = 1 / (1 + Math.exp(s * (d - pore)));
        const y = plotB - p * plotH;
        if (px === 0) ctx.moveTo(plotL + px, y); else ctx.lineTo(plotL + px, y);
      }
      ctx.stroke();
      ctx.lineWidth = 1;

      // Pore size marker
      const porePx = nmToPx(pore);
      ctx.strokeStyle = colors.warm + '80';
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(porePx, plotT);
      ctx.lineTo(porePx, plotB);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.warm;
      ctx.textAlign = 'center';
      ctx.fillText('pore 200nm', porePx, plotB + 24);

      // Axis labels
      ctx.fillStyle = colors.textTer;
      ctx.font = '10px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Particle diameter (log scale)', plotL + plotW / 2, plotB + 35);
      ctx.textAlign = 'right';
      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillText('1.0', plotL - 4, plotT + 5);
      ctx.fillText('0', plotL - 4, plotB + 3);

      // Size-range shading
      const virusPx0 = nmToPx(20), virusPx1 = nmToPx(300);
      const overlapPx0 = nmToPx(200), overlapPx1 = nmToPx(500);
      const bactPx0 = nmToPx(500), bactPx1 = nmToPx(10000);

      ctx.globalAlpha = 0.45;
      ctx.fillStyle = colors.viral + '20';
      ctx.fillRect(virusPx0, plotT, overlapPx0 - virusPx0, plotH);
      ctx.fillStyle = colors.viral + '12';
      ctx.fillRect(overlapPx0, plotT, overlapPx1 - overlapPx0, plotH);
      ctx.fillStyle = colors.bacteria + '12';
      ctx.fillRect(overlapPx0, plotT, overlapPx1 - overlapPx0, plotH);
      ctx.fillStyle = colors.bacteria + '15';
      ctx.fillRect(bactPx0, plotT, bactPx1 - bactPx0, plotH);
      ctx.globalAlpha = 1;

      // Range labels along top
      ctx.font = '10px -apple-system, sans-serif';
      ctx.fillStyle = colors.viral;
      ctx.textAlign = 'center';
      ctx.fillText('most viruses', (virusPx0 + overlapPx0) / 2, plotT + 10);
      ctx.font = '9px "JetBrains Mono", monospace';
      ctx.fillText('20–300 nm', (virusPx0 + overlapPx0) / 2, plotT + 20);
      ctx.font = '10px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      ctx.fillText('overlap', (overlapPx0 + overlapPx1) / 2, plotT + 10);
      ctx.font = '9px "JetBrains Mono", monospace';
      ctx.fillText('200–500', (overlapPx0 + overlapPx1) / 2, plotT + 20);
      ctx.font = '10px -apple-system, sans-serif';
      ctx.fillStyle = colors.bacteria;
      ctx.textAlign = 'center';
      ctx.fillText('most bacteria', (bactPx0 + bactPx1) / 2, plotT + 10);
      ctx.font = '9px "JetBrains Mono", monospace';
      ctx.fillText('500–10,000 nm', (bactPx0 + bactPx1) / 2, plotT + 20);

      // Description and parameters below
      const descY = plotB + 42;
      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      const pX = rX + sp.pad;
      let dy = descY;
      const descLines = [
        'Model: each particle is assigned a',
        'pass probability based on its diameter',
        'relative to the filter pore size.',
        '',
        'Small viruses (20–150 nm) pass with',
        'high probability (~95–99%). Bacteria',
        '(>500 nm) are mostly blocked (<1%).',
        'Giant viruses and small bacteria in',
        'the 200–500 nm overlap zone have',
        'intermediate pass rates.',
        '',
        'After filtration, nuclease treatment',
        'degrades free DNA/RNA outside intact',
        'capsids, removing host and bacterial',
        'nucleic acids from the filtrate.',
      ];
      descLines.forEach(line => {
        if (line === '') { dy += 6; return; }
        ctx.fillText(line, pX, dy);
        dy += 14;
      });

      dy += 6;
      ctx.fillStyle = colors.accent;
      ctx.fillText('Default parameters:', pX, dy);
      dy += 16;
      ctx.fillStyle = colors.textTer;
      ctx.fillText('recovery      = 85%', pX, dy);
      ctx.fillText('nuclease_eff  = 98%', pX, dy + 14);
      ctx.fillText('pore_size     = 0.2 µm (default)', pX, dy + 28);
      ctx.fillText('pore_options  = 0.1, 0.2, 0.45 µm', pX, dy + 42);
      ctx.fillText('steepness (s) = 0.04', pX, dy + 56);

    } else if (option === 'ultracentrifugation') {
      ctx.font = '12px -apple-system, sans-serif';
      ctx.fillStyle = colors.accent;
      ctx.textAlign = 'center';
      ctx.fillText('Density-based separation', rX + rW / 2, cY + 14);

      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      const pX = rX + sp.pad;
      let py = cY + 36;
      const lines = [
        'Model: all particles sediment by',
        'density, not size.',
        '',
        'Viral recovery    = 90%',
        'Bacteria removal  = 75%',
        'Host DNA removal  = 85%',
        'rRNA removal      = 90%',
        '',
        'Key difference from filtration:',
        '• No size selectivity',
        '• Bacteria co-sediment with virus',
        '• Lower contamination reduction',
        '',
        'Post-step: nuclease degrades',
        'free DNA in the supernatant',
      ];
      lines.forEach(line => {
        if (line === '') { py += 8; return; }
        ctx.fillText(line, pX, py);
        py += 18;
      });

    } else if (option === 'column') {
      ctx.font = '12px -apple-system, sans-serif';
      ctx.fillStyle = colors.accent;
      ctx.textAlign = 'center';
      ctx.fillText('Size-dependent binding model', rX + rW / 2, cY + 14);

      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.fillText('eff = 0.6 + 0.4 × min(1, d / 80nm)', rX + rW / 2, cY + 30);

      // Plot binding efficiency vs diameter
      const plotL = rX + 20, plotR = rX + rW - 15;
      const plotT = cY + 42, plotB = cY + areaH * 0.5;
      const plotW = plotR - plotL, plotH = plotB - plotT;

      ctx.strokeStyle = colors.border;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(plotL, plotB);
      ctx.lineTo(plotR, plotB);
      ctx.moveTo(plotL, plotT);
      ctx.lineTo(plotL, plotB);
      ctx.stroke();

      ctx.beginPath();
      ctx.strokeStyle = colors.accent;
      ctx.lineWidth = 2;
      for (let px = 0; px < plotW; px++) {
        const d = (px / plotW) * 150;
        const eff = 0.6 + 0.4 * Math.min(1, d / 80);
        const y = plotB - eff * plotH;
        if (px === 0) ctx.moveTo(plotL + px, y); else ctx.lineTo(plotL + px, y);
      }
      ctx.stroke();
      ctx.lineWidth = 1;

      // Saturation marker at 80nm
      const sat80 = plotL + (80 / 150) * plotW;
      ctx.strokeStyle = colors.warm + '60';
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(sat80, plotT);
      ctx.lineTo(sat80, plotB);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      ctx.fillText('Diameter (nm)', plotL + plotW / 2, plotB + 14);
      ctx.fillText('80', sat80, plotB + 24);
      ctx.textAlign = 'right';
      ctx.fillText('1.0', plotL - 3, plotT + 6);
      ctx.fillText('0.6', plotL - 3, plotB - plotH * 0.6 + 3);

      const paramY = plotB + 30;
      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      const pX = rX + sp.pad;
      ctx.fillText('recovery       = 70%', pX, paramY);
      ctx.fillText('nuclease_eff   = 92%', pX, paramY + 14);
      ctx.fillText('bact_removal   = 88%', pX, paramY + 28);
      ctx.fillText('host_removal   = 92%', pX, paramY + 42);
      ctx.fillText('rrna_removal   = 85%', pX, paramY + 56);
      ctx.fillText('', pX, paramY + 70);
      ctx.fillText('Larger viruses bind', pX, paramY + 74);
      ctx.fillText('BETTER (opposite of', pX, paramY + 88);
      ctx.fillText('filtration)', pX, paramY + 102);
    }
    ctx.restore();

    animFrame = requestAnimationFrame(() => draw(t + 16));
  }
  draw(0);
}

/* === AMPLIFICATION ANIMATION === */
function animateAmplification(option, ctx, W, H, colors) {
  const rng = mulberry32(99);

  if (option === 'none_amp') {
    showLegend([]);
    let t = 0;
    function drawNone() {
      t++;
      ctx.clearRect(0, 0, W, H);
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'center';
      ctx.fillText('No Amplification', W / 2, H * 0.35);
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.fillText('Relative abundances pass through unchanged', W / 2, H * 0.35 + 24);
      ctx.fillText('Used when input DNA is sufficient for direct library prep', W / 2, H * 0.35 + 46);
      animFrame = requestAnimationFrame(drawNone);
    }
    drawNone();
    return;
  }

  showLegend([
    [colors.accent, 'GC content bias'],
    [colors.warm, option === 'rdab' ? 'Length bias (RdAB)' : 'Method-specific effect'],
  ]);

  const gcValues = [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70];

  function calcBias(gc, opt) {
    const optGC = 0.50;
    if (opt === 'mda') return Math.exp(-45 * Math.pow(gc - optGC, 2));
    if (opt === 'rdab') return Math.exp(-Math.pow((gc - optGC) / 0.15, 2) * 1.0);
    return Math.exp(-Math.pow((gc - optGC) / 0.20, 2) * 0.5); // linker
  }

  let t = 0;
  function draw() {
    t++;
    ctx.clearRect(0, 0, W, H);
    const sp = drawSplitPanel(ctx, W, H, colors);
    const lW = sp.midX - sp.pad * 2, rX = sp.midX + sp.pad, rW = W - sp.midX - sp.pad * 2;
    const cY = sp.contentY;
    const areaH = H - cY - 10;

    // ===== LEFT: In the Lab =====
    ctx.save();
    ctx.beginPath();
    ctx.rect(sp.pad, cY, lW, areaH);
    ctx.clip();

    const methodNames = { mda: 'MDA (phi29 polymerase)', rdab: 'RdAB (random priming RT-PCR)', linker: 'Linker Amplification (PCR)' };
    // method name removed — the button label is enough

    if (option === 'mda') {
      // phi29 rolling circle amplification illustration
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      // subtitle removed — button label is enough

      // MDA: phi29 binds at random sites on a circular/linear template,
      // copies while displacing the strand ahead, then new polymerases
      // bind the displaced strands → branching tree of copies, all at 30°C

      const mdaFrames = 1200; // total ~20s animation
      const mdaProg = Math.min(1, t / mdaFrames);

      const strandL = 16, strandR = sp.pad + lW - 8;
      const strandW = strandR - strandL;
      const tY = cY + 44; // template y

      // --- Stage timeline ---
      // 0.00-0.10  show double-stranded template
      // 0.10-0.20  denature (strands separate slightly — isothermal so mild)
      // 0.20-0.25  random primers land on template
      // 0.25-0.60  phi29 extends from primers, displacing the top strand upward
      // 0.60-0.80  new primers land on displaced strands (branching)
      // 0.80-1.00  secondary extensions → exponential branching

      // Draw template (bottom strand — always visible)
      ctx.fillStyle = colors.accent + '60';
      ctx.fillRect(strandL, tY + 4, strandW, 3);
      ctx.font = '9px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      ctx.fillText('template', strandL, tY + 16);

      // Top strand — gets displaced
      if (mdaProg < 0.25) {
        // Still intact or just separating
        const sepY = mdaProg < 0.10 ? 0 : ((mdaProg - 0.10) / 0.15) * 3;
        ctx.fillStyle = colors.accent + '40';
        ctx.fillRect(strandL, tY - sepY, strandW, 3);
      }

      // Temperature label
      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.warm;
      ctx.textAlign = 'right';
      ctx.fillText('30°C constant', strandR, cY + 14);

      // Step label
      ctx.font = '10px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      if (mdaProg < 0.10) ctx.fillText('Double-stranded template DNA', strandL, cY + 14);
      else if (mdaProg < 0.20) ctx.fillText('Strands loosen at 30°C', strandL, cY + 14);
      else if (mdaProg < 0.25) ctx.fillText('Random hexamer primers bind', strandL, cY + 14);
      else if (mdaProg < 0.60) ctx.fillText('phi29 extends, displacing strand ahead', strandL, cY + 14);
      else if (mdaProg < 0.80) ctx.fillText('New primers bind displaced strands', strandL, cY + 14);
      else ctx.fillText('Branching amplification (exponential)', strandL, cY + 14);

      // Primary extensions from template — both strands, both directions
      // Top-strand primers extend rightward → displace top strand upward
      // Bottom-strand primers extend leftward → displace bottom strand downward
      const fwdPrimers = [0.12, 0.45, 0.75]; // on bottom strand, extend right
      const revPrimers = [0.85, 0.55, 0.25]; // on top strand, extend left

      if (mdaProg >= 0.20) {
        const primerAlpha = Math.min(1, (mdaProg - 0.20) / 0.05);
        const extStart = 0.25, extEnd = 0.60;
        const extProg = mdaProg < extStart ? 0 : Math.min(1, (mdaProg - extStart) / (extEnd - extStart));

        // --- Forward primers (extend rightward along bottom strand) ---
        fwdPrimers.forEach((ps, pi) => {
          const px = strandL + ps * strandW;

          if (mdaProg < 0.25) {
            ctx.globalAlpha = primerAlpha;
            ctx.fillStyle = colors.warm;
            ctx.fillRect(px - 3, tY + 1, 6, 2);
            ctx.globalAlpha = 1;
          } else {
            const remainLen = (1 - ps) * strandW;
            const curLen = extProg * remainLen;
            const dispH = 10 + pi * 4;

            // Displaced top strand peels upward
            if (curLen > 0) {
              ctx.strokeStyle = colors.accent + '30';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(px, tY);
              ctx.quadraticCurveTo(px + curLen * 0.3, tY - dispH, px + curLen, tY - dispH - 2);
              ctx.stroke();
              ctx.lineWidth = 1;
            }

            // New strand synthesized rightward
            ctx.fillStyle = colors.accent;
            ctx.fillRect(px, tY + 1, curLen, 2);

            // Primer
            ctx.fillStyle = colors.warm;
            ctx.fillRect(px - 3, tY + 1, 6, 2);

            // Polymerase dot
            if (curLen > 2) {
              ctx.fillStyle = colors.warm;
              ctx.beginPath();
              ctx.arc(px + curLen, tY + 2, 3, 0, Math.PI * 2);
              ctx.fill();
              if (pi === 0 && mdaProg < 0.40) {
                ctx.font = '9px "JetBrains Mono", monospace';
                ctx.fillStyle = colors.warm;
                ctx.textAlign = 'left';
                ctx.fillText('phi29', px + curLen + 5, tY + 5);
              }
            }

            // Secondary branching on displaced strand
            if (mdaProg >= 0.60 && curLen > 20) {
              const secProg = Math.min(1, (mdaProg - 0.60) / 0.40);
              const secPx = px + curLen * 0.3;
              const secY = tY - dispH + 1;
              const secLen = secProg * curLen * 0.5;
              ctx.fillStyle = colors.warm + '80';
              ctx.fillRect(secPx - 2, secY, 4, 2);
              if (secLen > 2) {
                ctx.fillStyle = colors.accent + '70';
                ctx.fillRect(secPx, secY - 3, secLen, 2);
                ctx.strokeStyle = colors.accent + '20';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(secPx, secY);
                ctx.quadraticCurveTo(secPx + secLen * 0.4, secY - 8, secPx + secLen, secY - 10);
                ctx.stroke();
                ctx.lineWidth = 1;
                ctx.fillStyle = colors.warm + '80';
                ctx.beginPath();
                ctx.arc(secPx + secLen, secY - 2, 2, 0, Math.PI * 2);
                ctx.fill();
              }
            }
          }
        });

        // --- Reverse primers (extend leftward along top strand) ---
        revPrimers.forEach((ps, pi) => {
          const px = strandL + ps * strandW;

          if (mdaProg < 0.25) {
            ctx.globalAlpha = primerAlpha;
            ctx.fillStyle = colors.warm;
            ctx.fillRect(px - 3, tY + 5, 6, 2);
            ctx.globalAlpha = 1;
          } else {
            const remainLen = ps * strandW; // distance to left end
            const curLen = extProg * remainLen;
            const dispH = 10 + pi * 4;

            // Displaced bottom strand peels downward
            if (curLen > 0) {
              ctx.strokeStyle = colors.accent + '30';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(px, tY + 7);
              ctx.quadraticCurveTo(px - curLen * 0.3, tY + 7 + dispH, px - curLen, tY + 7 + dispH + 2);
              ctx.stroke();
              ctx.lineWidth = 1;
            }

            // New strand synthesized leftward
            ctx.fillStyle = colors.accent + 'B0';
            ctx.fillRect(px - curLen, tY + 5, curLen, 2);

            // Primer
            ctx.fillStyle = colors.warm;
            ctx.fillRect(px - 3, tY + 5, 6, 2);

            // Polymerase dot
            if (curLen > 2) {
              ctx.fillStyle = colors.warm;
              ctx.beginPath();
              ctx.arc(px - curLen, tY + 6, 3, 0, Math.PI * 2);
              ctx.fill();
              if (pi === 0 && mdaProg < 0.40) {
                ctx.font = '9px "JetBrains Mono", monospace';
                ctx.fillStyle = colors.warm;
                ctx.textAlign = 'right';
                ctx.fillText('phi29', px - curLen - 5, tY + 9);
              }
            }

            // Secondary branching on displaced strand
            if (mdaProg >= 0.60 && curLen > 20) {
              const secProg = Math.min(1, (mdaProg - 0.60) / 0.40);
              const secPx = px - curLen * 0.3;
              const secY = tY + 7 + dispH - 1;
              const secLen = secProg * curLen * 0.4;
              ctx.fillStyle = colors.warm + '80';
              ctx.fillRect(secPx - 2, secY, 4, 2);
              if (secLen > 2) {
                ctx.fillStyle = colors.accent + '70';
                ctx.fillRect(secPx - secLen, secY + 3, secLen, 2);
                ctx.strokeStyle = colors.accent + '20';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(secPx, secY + 2);
                ctx.quadraticCurveTo(secPx - secLen * 0.4, secY + 10, secPx - secLen, secY + 12);
                ctx.stroke();
                ctx.lineWidth = 1;
                ctx.fillStyle = colors.warm + '80';
                ctx.beginPath();
                ctx.arc(secPx - secLen, secY + 4, 2, 0, Math.PI * 2);
                ctx.fill();
              }
            }
          }
        });
      }

      // Key properties below — pushed down to avoid overlapping the animation
      const propY = tY + 55;
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      const props = [
        'Isothermal (30°C, no heat cycling)',
        'Primers on both strands → full coverage',
        'phi29 displaces strand as it copies',
        'Displaced strands → new templates → exponential',
        'Strong GC bias toward 50%',
      ];
      props.forEach((p, i) => {
        if (propY + i * 16 < cY + areaH - 2)
          ctx.fillText('• ' + p, sp.pad, propY + i * 16);
      });

    } else if (option === 'rdab') {
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      // subtitle removed — button label is enough

      // RdAB: 3-step process
      // 1. Random primers bind RNA → reverse transcriptase makes cDNA
      // 2. Sequenase makes second strand → double-stranded DNA
      // 3. PCR amplifies (40 cycles) with length + GC bias

      const rdabFrames = 1200; // ~20s total
      const rdabProg = Math.min(1, t / rdabFrames);

      const strandL = 16, strandR = sp.pad + lW - 8;
      const strandW = strandR - strandL;

      // --- Timeline ---
      // 0.00-0.30  Step 1: random primers + RT → cDNA
      // 0.30-0.50  Step 2: second-strand synthesis → dsDNA
      // 0.50-1.00  Step 3: PCR cycles (shows 3 cycles with doubling)

      // Step label
      ctx.font = '10px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      if (rdabProg < 0.30) ctx.fillText('Step 1: Random primers + Reverse Transcription', strandL, cY + 14);
      else if (rdabProg < 0.50) ctx.fillText('Step 2: Second-strand synthesis (Sequenase)', strandL, cY + 14);
      else ctx.fillText('Step 3: PCR amplification (40 cycles)', strandL, cY + 14);

      // Use areaH to lay out proportionally — no overlaps
      // Region breakdown:
      //   0%-5%   step label (already drawn above at cY+14)
      //   8%-40%  animation area (RNA/cDNA/dsDNA or PCR copies)
      //   42%-55% secondary labels (cDNA label, Sequenase, or length bias)
      //   60%-100% bullet points

      const animTop = cY + areaH * 0.10;  // where animation starts
      const animMid = cY + areaH * 0.30;  // midpoint for secondary elements
      const labelY  = cY + areaH * 0.48;  // where secondary labels go
      const propTop = cY + areaH * 0.58;  // where bullet points start

      // === STEP 1: RNA → cDNA ===
      // RNA template (wavy line — always shown in steps 1-2)
      if (rdabProg < 0.50) {
        ctx.strokeStyle = '#c06040';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        for (let px = 0; px <= strandW; px += 1) {
          const y = animTop + Math.sin(px * 0.08) * 2.5;
          if (px === 0) ctx.moveTo(strandL + px, y); else ctx.lineTo(strandL + px, y);
        }
        ctx.stroke();
        ctx.lineWidth = 1;
        ctx.font = '9px "JetBrains Mono", monospace';
        ctx.fillStyle = '#c06040';
        ctx.textAlign = 'left';
        ctx.fillText('RNA', strandL, animTop - 7);
      }

      if (rdabProg < 0.30) {
        const rtProg = rdabProg / 0.30;
        const primerPositions = [0.05, 0.25, 0.50, 0.72];

        primerPositions.forEach((pp, pi) => {
          const px = strandL + pp * strandW;
          const primerAppear = Math.min(1, rtProg * 4 - pi * 0.5);
          if (primerAppear <= 0) return;

          ctx.globalAlpha = Math.min(1, primerAppear);
          ctx.fillStyle = colors.warm;
          ctx.fillRect(px, animTop + 8, 6, 2);

          const extProg = Math.max(0, Math.min(1, (rtProg - 0.3 - pi * 0.1) / 0.5));
          if (extProg > 0) {
            const fragLen = extProg * (0.22 * strandW);
            ctx.fillStyle = colors.accent;
            ctx.fillRect(px, animTop + 14, fragLen, 2);

            ctx.fillStyle = colors.warm;
            ctx.beginPath();
            ctx.arc(px + fragLen, animTop + 15, 2.5, 0, Math.PI * 2);
            ctx.fill();

            if (pi === 0 && extProg > 0.2) {
              ctx.font = '8px "JetBrains Mono", monospace';
              ctx.fillStyle = colors.warm;
              ctx.textAlign = 'left';
              ctx.fillText('RT', px + fragLen + 4, animTop + 18);
            }
          }
          ctx.globalAlpha = 1;
        });

        ctx.font = '9px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.accent;
        ctx.textAlign = 'left';
        if (rtProg > 0.4) ctx.fillText('cDNA fragments', strandL, labelY);

      } else if (rdabProg < 0.50) {
        // === STEP 2: Second-strand synthesis ===
        const ssProg = (rdabProg - 0.30) / 0.20;
        const fragPositions = [0.05, 0.25, 0.50, 0.72];
        const fragLen = 0.22 * strandW;

        fragPositions.forEach((pp) => {
          const px = strandL + pp * strandW;
          ctx.fillStyle = colors.accent;
          ctx.fillRect(px, animTop + 14, fragLen, 2);

          const secLen = ssProg * fragLen;
          ctx.fillStyle = colors.accent + '60';
          ctx.fillRect(px, animTop + 20, secLen, 2);

          if (secLen > 4) {
            ctx.fillStyle = '#6a9';
            ctx.beginPath();
            ctx.arc(px + secLen, animTop + 21, 2, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        ctx.font = '9px "JetBrains Mono", monospace';
        ctx.fillStyle = '#6a9';
        ctx.textAlign = 'right';
        if (ssProg > 0.2) ctx.fillText('Sequenase', strandR, labelY);
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        ctx.fillText('→ double-stranded DNA', strandL, labelY);

      } else {
        // === STEP 3: PCR amplification ===
        const pcrProg = (rdabProg - 0.50) / 0.50;
        const pcrCycleFrames = 0.33;
        const pcrCycleNum = Math.min(3, Math.floor(pcrProg / pcrCycleFrames));
        const pcrCycleT = Math.min(1, (pcrProg - pcrCycleNum * pcrCycleFrames) / pcrCycleFrames);

        const fragments = [
          { x: 0.05, w: 0.12, label: 'short' },
          { x: 0.25, w: 0.20, label: 'medium' },
          { x: 0.55, w: 0.35, label: 'long' },
        ];

        // Fragment labels
        fragments.forEach((frag) => {
          const fx = strandL + frag.x * strandW;
          const fw = frag.w * strandW;
          ctx.font = '8px "JetBrains Mono", monospace';
          ctx.fillStyle = colors.textTer;
          ctx.textAlign = 'center';
          ctx.fillText(frag.label, fx + fw / 2, animTop - 2);
        });

        // Copies stacking — use space from animTop to labelY
        const copyAreaH = labelY - animTop - 10;
        const copyRowH = Math.max(5, copyAreaH / 8);

        fragments.forEach((frag, fi) => {
          const fx = strandL + frag.x * strandW;
          const fw = frag.w * strandW;
          const lengthFactor = fi === 0 ? 1.5 : fi === 1 ? 1.0 : 0.6;
          const totalCopies = Math.floor(Math.pow(2, pcrCycleNum) * lengthFactor);
          const maxDraw = Math.min(totalCopies, Math.floor(copyAreaH / copyRowH));

          for (let c = 0; c < maxDraw; c++) {
            const cy = animTop + 4 + c * copyRowH;
            const alpha = Math.max(25, 80 - c * 8);
            const prevCopies = Math.floor(Math.pow(2, Math.max(0, pcrCycleNum - 1)) * lengthFactor);
            const isNew = c >= Math.min(prevCopies, maxDraw);
            let drawAlpha = alpha;
            if (isNew && pcrCycleNum > 0) {
              drawAlpha = Math.floor(alpha * Math.min(1, pcrCycleT * 2));
            }
            ctx.fillStyle = colors.accent + drawAlpha.toString(16).padStart(2, '0');
            ctx.fillRect(fx, cy, fw, 2);
            ctx.fillStyle = colors.accent + Math.floor(drawAlpha * 0.6).toString(16).padStart(2, '0');
            ctx.fillRect(fx, cy + 2.5, fw, 2);
          }

          ctx.font = '8px "JetBrains Mono", monospace';
          ctx.fillStyle = colors.textTer;
          ctx.textAlign = 'center';
          ctx.fillText(totalCopies + '×', fx + fw / 2, labelY - 2);
        });

        // Length bias label
        ctx.font = '9px -apple-system, sans-serif';
        ctx.fillStyle = colors.warm;
        ctx.textAlign = 'center';
        ctx.fillText('← shorter = more copies (length bias) →', strandL + strandW / 2, labelY + 10);
      }

      // Key properties — anchored to bottom
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      const props = [
        'Random primers → RT → Sequenase → PCR',
        'Length bias: shorter fragments amplified more',
        'GC bias similar to MDA',
      ];
      props.forEach((p, i) => {
        ctx.fillText('• ' + p, sp.pad, propTop + i * 16);
      });

    } else { // linker
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      // subtitle removed — button label is enough

      // PCR cycle animation: shows 4 cycles, each with
      // denature (strands separate) → anneal (primers bind) → extend (new strand grows)
      // then the count doubles
      const cycleFrames = 480; // ~8s per cycle
      const totalCycles = 4;
      const cycleNum = Math.min(totalCycles, Math.floor(t / cycleFrames));
      const cycleT = Math.min(1, (t - cycleNum * cycleFrames) / cycleFrames);

      // How many completed molecules exist
      const completedCount = Math.pow(2, cycleNum);

      // Layout
      const strandL = 16, strandR = sp.pad + lW - 8;
      const strandW = strandR - strandL;
      const adpW = strandW * 0.06; // adapter/linker region

      // Current cycle substep:
      //   0.00-0.15  denature (95°C — strands separate)
      //   0.15-0.35  anneal (55°C — primers bind to ends)
      //   0.35-0.85  extend (72°C — polymerase copies each strand)
      //   0.85-1.00  pause — show the doubled result

      // Stage label
      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      if (cycleNum < totalCycles) {
        let stepLabel = '';
        if (cycleT < 0.15) stepLabel = '95°C  Denature (separate strands)';
        else if (cycleT < 0.35) stepLabel = '55°C  Anneal (primers bind)';
        else if (cycleT < 0.85) stepLabel = '72°C  Extend (copy strands)';
        else stepLabel = 'Cycle ' + (cycleNum + 1) + ' complete → ' + (completedCount * 2) + ' copies';
        ctx.fillText(stepLabel, sp.pad, cY + 44);
      } else {
        ctx.fillText('After ' + totalCycles + ' cycles: ' + completedCount + ' copies', sp.pad, cY + 44);
      }

      // Draw current cycle's DNA
      const dnaY = cY + 58;
      const gap = 4; // gap between strands when denatured

      if (cycleNum < totalCycles) {
        // Top strand (template, forward)
        // Bottom strand (template, reverse)
        let topY = dnaY;
        let botY = dnaY + 6;

        if (cycleT < 0.15) {
          // DENATURE: strands separate vertically
          const sep = (cycleT / 0.15);
          topY = dnaY - sep * gap;
          botY = dnaY + 6 + sep * gap;
        } else {
          topY = dnaY - gap;
          botY = dnaY + 6 + gap;
        }

        // Draw top strand
        ctx.fillStyle = colors.accent;
        ctx.fillRect(strandL, topY, strandW, 3);
        // Draw bottom strand
        ctx.fillStyle = colors.accent + '80';
        ctx.fillRect(strandL, botY, strandW, 3);

        // Adapters/linkers at ends
        ctx.fillStyle = colors.warm + '60';
        ctx.fillRect(strandL, topY - 1, adpW, 5);
        ctx.fillRect(strandR - adpW, topY - 1, adpW, 5);
        ctx.fillRect(strandL, botY - 1, adpW, 5);
        ctx.fillRect(strandR - adpW, botY - 1, adpW, 5);

        if (cycleT >= 0.15 && cycleT < 0.35) {
          // ANNEAL: primers bind ON the adapter regions
          const primerAlpha = Math.min(1, (cycleT - 0.15) / 0.1);
          ctx.globalAlpha = primerAlpha;
          ctx.fillStyle = colors.warm;
          // Primer on bottom strand's left adapter (will extend rightward)
          ctx.fillRect(strandL, botY + 5, adpW, 2);
          // Primer on top strand's right adapter (will extend leftward)
          ctx.fillRect(strandR - adpW, topY - 4, adpW, 2);
          // Labels
          ctx.font = '11px "JetBrains Mono", monospace';
          ctx.fillStyle = colors.warm;
          ctx.textAlign = 'left';
          ctx.fillText('primer', strandL + adpW + 4, botY + 8);
          ctx.textAlign = 'right';
          ctx.fillText('primer', strandR - adpW - 4, topY - 1);
          ctx.globalAlpha = 1;
        }

        if (cycleT >= 0.35 && cycleT < 0.85) {
          // EXTEND: new complementary strand grows from primer (which sits on adapter)
          const extProg = (cycleT - 0.35) / 0.5;
          const extLen = extProg * (strandW - adpW);

          // Primer on bottom strand's left adapter
          ctx.fillStyle = colors.warm;
          ctx.fillRect(strandL, botY + 5, adpW, 2);
          // New strand growing rightward from that primer
          ctx.fillStyle = colors.accent + '50';
          ctx.fillRect(strandL + adpW, botY + 5, extLen, 2);
          // Polymerase dot at extending end
          ctx.fillStyle = colors.warm;
          ctx.beginPath();
          ctx.arc(strandL + adpW + extLen, botY + 6, 3, 0, Math.PI * 2);
          ctx.fill();

          // Primer on top strand's right adapter
          ctx.fillStyle = colors.warm;
          ctx.fillRect(strandR - adpW, topY - 4, adpW, 2);
          // New strand growing leftward from that primer
          ctx.fillStyle = colors.accent + '50';
          const revStart = strandR - adpW - extLen;
          ctx.fillRect(revStart, topY - 4, extLen, 2);
          // Polymerase dot
          ctx.fillStyle = colors.warm;
          ctx.beginPath();
          ctx.arc(revStart, topY - 3, 3, 0, Math.PI * 2);
          ctx.fill();
        }

        if (cycleT >= 0.85) {
          // COMPLETE: show both new strands fully formed
          // Completed new strands span from adapter to far end
          ctx.fillStyle = colors.warm;
          ctx.fillRect(strandL, botY + 5, adpW, 2);
          ctx.fillRect(strandR - adpW, topY - 4, adpW, 2);
          ctx.fillStyle = colors.accent + '50';
          ctx.fillRect(strandL + adpW, botY + 5, strandW - adpW, 2);
          ctx.fillRect(strandL, topY - 4, strandW - adpW, 2);
        }
      }

      // Show accumulated copies below the active cycle
      const countY = dnaY + 32;
      const maxShow = Math.min(completedCount, 8);
      const rowH = 7;
      for (let c = 0; c < maxShow; c++) {
        const ry = countY + c * rowH;
        if (ry > cY + areaH - 30) break;
        const alpha = Math.max(20, 70 - c * 8);
        ctx.fillStyle = colors.accent + alpha.toString(16).padStart(2, '0');
        ctx.fillRect(strandL, ry, strandW, 3);
        // Linker adapters
        ctx.fillStyle = colors.warm + (Math.floor(alpha * 0.5)).toString(16).padStart(2, '0');
        ctx.fillRect(strandL, ry, adpW, 3);
        ctx.fillRect(strandR - adpW, ry, adpW, 3);
      }
      if (completedCount > 0) {
        ctx.font = '11px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        ctx.fillText(completedCount + ' copies so far', strandL, countY + Math.min(maxShow, 6) * rowH + 12);
      }

      // Key properties below
      const propY = countY + Math.min(maxShow, 6) * rowH + 26;
      if (propY < cY + areaH - 10) {
        ctx.font = '11px -apple-system, sans-serif';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        const props = [
          'Mildest GC bias of the three',
          'No length bias (all have adapters)',
        ];
        props.forEach((p, i) => {
          if (propY + i * 18 < cY + areaH - 2)
            ctx.fillText('• ' + p, sp.pad, propY + i * 18);
        });
      }
    }
    ctx.restore();

    // ===== RIGHT: ViroForge model =====
    ctx.save();
    ctx.beginPath();
    ctx.rect(rX, cY, rW, areaH);
    ctx.clip();

    // Right panel layout — proportional zones to prevent overlaps
    // Zone 1: 0-12%   title + formula
    // Zone 2: 14-50%  GC bias plot (shorter for rdab to fit length plot)
    // Zone 3: 52-100% params (mda/linker) or length bias plot (rdab)
    const rZone1 = cY + areaH * 0.00;
    const rZone2T = cY + areaH * 0.14;
    const rZone2B = cY + areaH * (option === 'rdab' ? 0.46 : 0.55);
    const rZone3T = cY + areaH * (option === 'rdab' ? 0.50 : 0.58);
    const rZone3B = cY + areaH * 0.97;

    // Title + formula
    ctx.font = '12px -apple-system, sans-serif';
    ctx.fillStyle = colors.accent;
    ctx.textAlign = 'center';
    ctx.fillText('GC Efficiency Model', rX + rW / 2, rZone1 + 14);

    const formulas = {
      mda: 'exp(−45 × (GC − 0.50)²)',
      rdab: 'exp(−(GC−0.50)² / 0.15² )',
      linker: 'exp(−(GC−0.50)² / (2×0.20²))',
    };
    ctx.font = '11px "JetBrains Mono", monospace';
    ctx.fillStyle = colors.textTer;
    ctx.fillText(formulas[option] || '', rX + rW / 2, rZone1 + 28);

    // GC bias plot
    const plotL = rX + 18, plotR = rX + rW - 10;
    const plotT = rZone2T + 6, plotB = rZone2B - 22;
    const plotW = plotR - plotL, plotH = plotB - plotT;

    // Axes
    ctx.strokeStyle = colors.border;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(plotL, plotB);
    ctx.lineTo(plotR, plotB);
    ctx.moveTo(plotL, plotT);
    ctx.lineTo(plotL, plotB);
    ctx.stroke();

    // GC bias curve
    ctx.beginPath();
    ctx.strokeStyle = colors.accent;
    ctx.lineWidth = 2;
    for (let px = 0; px < plotW; px++) {
      const gc = 0.25 + (px / plotW) * 0.50;
      const bias = calcBias(gc, option);
      const y = plotB - bias * (plotH - 6);
      if (px === 0) ctx.moveTo(plotL + px, y); else ctx.lineTo(plotL + px, y);
    }
    ctx.stroke();
    ctx.lineWidth = 1;

    // Bar chart on top of curve
    const barW = Math.min(12, plotW / gcValues.length - 3);
    const barProg = Math.min(1, t / 80);
    gcValues.forEach((gc, i) => {
      const bias = calcBias(gc, option);
      const bx = plotL + ((gc - 0.25) / 0.50) * plotW;
      const bh = bias * (plotH - 6) * barProg;
      ctx.fillStyle = colors.accent + '50';
      ctx.fillRect(bx - barW / 2, plotB - bh, barW, bh);
    });

    // Axis labels
    ctx.font = '10px "JetBrains Mono", monospace';
    ctx.fillStyle = colors.textTer;
    ctx.textAlign = 'center';
    [30, 40, 50, 60, 70].forEach(gc => {
      const px = plotL + ((gc / 100 - 0.25) / 0.50) * plotW;
      ctx.fillText(gc + '%', px, plotB + 10);
    });
    ctx.fillText('GC Content', plotL + plotW / 2, plotB + 20);
    ctx.textAlign = 'right';
    ctx.fillText('1.0', plotL - 3, plotT + 5);
    ctx.fillText('0', plotL - 3, plotB + 3);

    // Optimum marker
    const opt50 = plotL + (0.50 - 0.25) / 0.50 * plotW;
    ctx.strokeStyle = colors.warm + '60';
    ctx.setLineDash([2, 2]);
    ctx.beginPath();
    ctx.moveTo(opt50, plotT);
    ctx.lineTo(opt50, plotB);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '10px "JetBrains Mono", monospace';
    ctx.fillStyle = colors.warm;
    ctx.textAlign = 'center';
    ctx.fillText('optimum', opt50, plotT - 4);

    if (option === 'rdab') {
      // Length bias plot in zone 3
      const lPlotT = rZone3T + 14;
      const lPlotB = rZone3B - 12;
      const lPlotH = lPlotB - lPlotT;

      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.warm;
      ctx.textAlign = 'center';
      ctx.fillText('Length Bias (RdAB only)', rX + rW / 2, rZone3T + 2);
      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.fillText('exp(−0.015 × length_kb)', rX + rW / 2, rZone3T + 14);

      // Axes
      ctx.strokeStyle = colors.border;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(plotL, lPlotB);
      ctx.lineTo(plotR, lPlotB);
      ctx.moveTo(plotL, lPlotT + 6);
      ctx.lineTo(plotL, lPlotB);
      ctx.stroke();
