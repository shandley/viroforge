      // Decay curve
      ctx.beginPath();
      ctx.strokeStyle = colors.warm;
      ctx.lineWidth = 2;
      for (let px = 0; px < plotW; px++) {
        const kb = (px / plotW) * 160;
        const eff = Math.exp(-0.015 * kb);
        const y = lPlotB - eff * (lPlotH - 10);
        if (px === 0) ctx.moveTo(plotL + px, y); else ctx.lineTo(plotL + px, y);
      }
      ctx.stroke();
      ctx.lineWidth = 1;

      // Key length markers
      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      [5, 20, 50, 100, 150].forEach(kb => {
        const px = plotL + (kb / 160) * plotW;
        ctx.fillText(kb + 'kb', px, lPlotB + 10);
        const eff = Math.exp(-0.015 * kb);
        ctx.fillStyle = colors.warm;
        ctx.fillText((eff * 100).toFixed(0) + '%', px, lPlotB - eff * (lPlotH - 10) - 4);
        ctx.fillStyle = colors.textTer;
      });
    } else {
      // Parameters section in zone 3
      const paramY = rZone3T + 4;
      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      const pX = rX + sp.pad;

      if (option === 'mda') {
        ctx.fillText('Method:   MDA (phi29)', pX, paramY);
        ctx.fillText('Duration: 4 hours', pX, paramY + 14);
        ctx.fillText('Noise CV: 0.30', pX, paramY + 28);
        ctx.fillText('Chimera:  15%', pX, paramY + 42);
        ctx.fillText('GC opt:   50%', pX, paramY + 56);

        ctx.font = '11px -apple-system, sans-serif';
        ctx.fillStyle = colors.warm;
        ctx.fillText('Strongest GC bias', pX, paramY + 76);
        ctx.fillText('of the three methods', pX, paramY + 90);
      } else {
        ctx.fillText('Method:    Linker (PCR)', pX, paramY);
        ctx.fillText('Cycles:    20', pX, paramY + 14);
        ctx.fillText('GC opt:    50%', pX, paramY + 28);
        ctx.fillText('No length bias', pX, paramY + 42);

        ctx.font = '11px -apple-system, sans-serif';
        ctx.fillStyle = colors.accent;
        ctx.fillText('Mildest GC bias', pX, paramY + 62);
        ctx.fillText('Standard Illumina workflow', pX, paramY + 76);
      }
    }
    ctx.restore();

    animFrame = requestAnimationFrame(draw);
  }
  draw();
}

/* === SEQUENCING ANIMATION === */
function animateSequencing(option, ctx, W, H, colors) {
  const rng = mulberry32(77);
  let t = 0;
  showLegend([]);

  function draw() {
    t++;
    ctx.clearRect(0, 0, W, H);
    const sp = drawSplitPanel(ctx, W, H, colors);
    const lW = sp.midX - sp.pad * 2, rX = sp.midX + sp.pad, rW = W - sp.midX - sp.pad * 2;
    const cY = sp.contentY;
    const areaH = H - cY - 10;
    const progress = Math.min(1, t / (option === 'pacbio' || option === 'nanopore' ? 300 : 150));

    // ===== LEFT: In the Lab =====
    ctx.save();
    ctx.beginPath();
    ctx.rect(sp.pad, cY, lW, areaH);
    ctx.clip();

    // Line spacing helper — fits lines into available height
    const lineH = Math.min(15, areaH / 20);
    const gapH = Math.min(6, lineH * 0.4);

    if (option === 'novaseq' || option === 'miseq') {
      const cfg = option === 'novaseq'
        ? { label: 'NovaSeq 6000', readLen: 150, insert: 350 }
        : { label: 'MiSeq', readLen: 250, insert: 450 };

      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'center';
      ctx.fillText(cfg.label + ' — Sequencing by Synthesis', sp.pad + lW / 2, cY + 12);

      // DNA fragment with adapters
      const fragY = cY + areaH * 0.10;
      const fragL = sp.pad, fragR = sp.pad + lW - 8;
      const fragW = fragR - fragL;
      const adpW = fragW * 0.06;

      ctx.fillStyle = colors.warm + '60';
      ctx.fillRect(fragL, fragY, adpW, 10);
      ctx.fillStyle = colors.muted + '30';
      ctx.fillRect(fragL + adpW, fragY, fragW - adpW * 2, 10);
      ctx.fillStyle = colors.warm + '60';
      ctx.fillRect(fragR - adpW, fragY, adpW, 10);

      // Insert size bracket
      ctx.strokeStyle = colors.textTer;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(fragL + adpW, fragY - 3);
      ctx.lineTo(fragL + adpW, fragY - 8);
      ctx.lineTo(fragR - adpW, fragY - 8);
      ctx.lineTo(fragR - adpW, fragY - 3);
      ctx.stroke();
      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      ctx.fillText('~' + cfg.insert + ' bp insert', (fragL + fragR) / 2, fragY - 10);

      // R1 and R2 reads
      const readFrac = cfg.readLen / cfg.insert;
      const r1W = (fragW - adpW * 2) * readFrac;
      const rProg = Math.min(1, progress * 2.5);

      const r1Y = fragY + 16;
      ctx.fillStyle = colors.accent;
      ctx.fillRect(fragL + adpW, r1Y, r1W * rProg, 6);
      ctx.fillStyle = colors.accent + 'A0';
      ctx.fillRect(fragR - adpW - r1W * rProg, r1Y + 12, r1W * rProg, 6);

      if (rProg > 0.3) {
        ctx.font = '10px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.accent;
        ctx.textAlign = 'left';
        ctx.fillText('R1 → ' + cfg.readLen + 'bp', fragL + adpW, r1Y - 2);
        ctx.textAlign = 'right';
        ctx.fillText(cfg.readLen + 'bp ← R2', fragR - adpW, r1Y + 12 + 14);
      }

      // Cycle steps
      const fluY = cY + areaH * 0.45;
      ctx.font = '10px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      ctx.fillText('Each cycle:', sp.pad + lW / 2, fluY);

      ctx.textAlign = 'left';
      const steps = [
        '1. Add fluorescent nucleotides',
        '2. One base incorporates',
        '3. Camera images the color',
        '4. Cleave terminator + dye',
      ];
      steps.forEach((s, i) => { ctx.fillText(s, sp.pad, fluY + 12 + i * lineH); });

      // Quality note
      if (progress > 0.5) {
        const qY = cY + areaH * 0.80;
        ctx.fillStyle = colors.textTer;
        ctx.fillText('Signal weakens over cycles', sp.pad, qY);
        ctx.fillText('→ quality drops at read ends', sp.pad, qY + lineH);
        if (option === 'novaseq') {
          ctx.fillStyle = colors.warm;
          ctx.fillText('NovaSeq bins quality scores', sp.pad, qY + lineH * 2);
        }
      }

    } else if (option === 'pacbio') {
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'center';
      ctx.fillText('PacBio HiFi — Circular Consensus', sp.pad + lW / 2, cY + 12);

      // SMRTbell diagram
      const bellY = cY + areaH * 0.12;
      const bellL = 16, bellR = sp.pad + lW - 8;
      const hpR = 8;

      ctx.strokeStyle = colors.accent;
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(bellL + hpR, bellY - 3);
      ctx.lineTo(bellR - hpR, bellY - 3);
      ctx.stroke();
      ctx.strokeStyle = colors.warm;
      ctx.beginPath();
      ctx.moveTo(bellL + hpR, bellY + 3);
      ctx.lineTo(bellR - hpR, bellY + 3);
      ctx.stroke();
      ctx.strokeStyle = colors.muted;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(bellL + hpR, bellY, hpR, Math.PI * 0.5, Math.PI * 1.5);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(bellR - hpR, bellY, hpR, -Math.PI * 0.5, Math.PI * 0.5);
      ctx.stroke();

      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      ctx.fillText('SMRTbell (~15 kb)', (bellL + bellR) / 2, bellY + 14);

      // Circular polymerase animation
      const circCX = sp.pad + lW * 0.35, circCY = cY + areaH * 0.38, circR = Math.min(24, areaH * 0.09);
      ctx.strokeStyle = colors.muted + '25';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(circCX, circCY, circR, 0, Math.PI * 2);
      ctx.stroke();

      const nPasses = 10;
      const totalAng = progress * nPasses * Math.PI * 2;
      const curAng = totalAng - Math.PI / 2;
      const curPass = Math.min(10, Math.floor(progress * nPasses));

      ctx.strokeStyle = colors.accent + '50';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(circCX, circCY, circR, curAng - Math.min(Math.PI * 2, totalAng), curAng);
      ctx.stroke();

      ctx.fillStyle = colors.accent;
      ctx.beginPath();
      ctx.arc(circCX + Math.cos(curAng) * circR, circCY + Math.sin(curAng) * circR, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.text;
      ctx.textAlign = 'center';
      ctx.fillText('Pass ' + curPass + '/10', circCX, circCY + circR + 12);

      // Subread rows
      const subX = sp.pad + lW * 0.6, subEndX = sp.pad + lW - 6;
      const subStartY = cY + areaH * 0.22;
      const subSp = Math.min(8, (areaH * 0.40) / 12);
      const subLen = subEndX - subX;
      const passRng = mulberry32(42);
      const errPos = [];
      for (let p = 0; p < 10; p++) { const e = []; for (let i = 0; i < 5; i++) e.push(passRng()); errPos.push(e); }

      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      ctx.fillText('Subreads', (subX + subEndX) / 2, subStartY);

      for (let p = 0; p < 10; p++) {
        const sy = subStartY + 5 + p * subSp;
        const vis = p < curPass;
        ctx.strokeStyle = vis ? colors.accent + '40' : colors.muted + '10';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(subX, sy);
        ctx.lineTo(subEndX, sy);
        ctx.stroke();
        if (vis) errPos[p].forEach(pos => {
          ctx.fillStyle = '#e05555';
          ctx.fillRect(subX + pos * subLen - 1, sy - 1.5, 2, 3);
        });
      }

      // Consensus
      if (curPass >= 3) {
        const consY = subStartY + 5 + 10 * subSp + 5;
        ctx.strokeStyle = colors.accent;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(subX, consY);
        ctx.lineTo(subEndX, consY);
        ctx.stroke();
        const qv = curPass >= 10 ? '>Q40' : curPass >= 7 ? 'Q30+' : 'Q20+';
        ctx.font = '10px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.accent;
        ctx.textAlign = 'center';
        ctx.fillText('HiFi ' + qv, (subX + subEndX) / 2, consY + 10);
      }

    } else if (option === 'nanopore') {
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'center';
      ctx.fillText('Nanopore — Ionic Current Sensing', sp.pad + lW / 2, cY + 12);

      // Membrane + pore
      const memY = cY + areaH * 0.25;
      const memTh = 16;
      const porW = 18;
      const porCX = sp.pad + lW * 0.4;

      ctx.fillStyle = colors.muted + '15';
      ctx.fillRect(8, memY - memTh / 2, porCX - porW / 2 - 8, memTh);
      ctx.fillRect(porCX + porW / 2, memY - memTh / 2, sp.pad + lW - porCX - porW / 2, memTh);

      ctx.fillStyle = colors.warm + '60';
      ctx.beginPath();
      ctx.moveTo(porCX - porW / 2 - 3, memY - memTh / 2);
      ctx.lineTo(porCX - 4, memY);
      ctx.lineTo(porCX - porW / 2 - 3, memY + memTh / 2);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(porCX + porW / 2 + 3, memY - memTh / 2);
      ctx.lineTo(porCX + 4, memY);
      ctx.lineTo(porCX + porW / 2 + 3, memY + memTh / 2);
      ctx.closePath();
      ctx.fill();

      // Motor protein
      ctx.fillStyle = colors.accent + '70';
      ctx.beginPath();
      ctx.arc(porCX, memY - memTh / 2 - 5, 4, 0, Math.PI * 2);
      ctx.fill();

      // DNA threading
      const threadP = Math.min(1, progress * 1.5);
      const dnaLen = 28 * (1 - threadP * 0.5);
      if (dnaLen > 3) {
        ctx.strokeStyle = colors.accent;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(porCX, memY - memTh / 2 - 9);
        ctx.lineTo(porCX - 2, memY - memTh / 2 - 9 - dnaLen);
        ctx.stroke();
      }
      ctx.strokeStyle = colors.warm;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(porCX, memY - 4);
      ctx.lineTo(porCX, memY + 4);
      ctx.stroke();
      if (threadP > 0.1) {
        ctx.strokeStyle = colors.warm + '70';
        ctx.beginPath();
        ctx.moveTo(porCX, memY + memTh / 2 + 2);
        ctx.lineTo(porCX + 2, memY + memTh / 2 + 2 + threadP * 20);
        ctx.stroke();
      }

      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      ctx.fillText('pore', porCX, memY + memTh / 2 + 10);

      // Mini squiggle
      const sqL = sp.pad, sqR = sp.pad + lW - 6;
      const sqMidY = cY + areaH * 0.58;
      const sqH = Math.min(20, areaH * 0.08);
      ctx.fillStyle = colors.muted + '06';
      ctx.fillRect(sqL, sqMidY - sqH, sqR - sqL, sqH * 2);

      function kmerHash(idx) {
        let h = idx * 2654435761;
        h = ((h >>> 16) ^ h) * 0x45d9f3b;
        h = ((h >>> 16) ^ h);
        return ((h >>> 0) / 4294967296) - 0.5;
      }

      const sqLen = sqR - sqL;
      const scrollOff = t * 0.6;
      ctx.beginPath();
      ctx.strokeStyle = colors.warm;
      ctx.lineWidth = 1;
      const flat0 = sqLen * 0.4, flat1 = sqLen * 0.55;
      for (let px = 0; px < sqLen; px++) {
        const wx = px + scrollOff;
        let lev;
        if (px >= flat0 && px <= flat1) lev = 0.3 + Math.sin(wx * 0.3) * 0.03;
        else { const ki = Math.floor(wx / 10); lev = kmerHash(ki) * 0.6 + Math.sin(wx * 0.7) * 0.08; }
        const y = sqMidY - lev * sqH;
        if (px === 0) ctx.moveTo(sqL + px, y); else ctx.lineTo(sqL + px, y);
      }
      ctx.stroke();

      ctx.fillStyle = '#e0555518';
      ctx.fillRect(sqL + flat0, sqMidY - sqH, flat1 - flat0, sqH * 2);
      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillStyle = '#e05555';
      ctx.textAlign = 'center';
      ctx.fillText('AAAA?', sqL + (flat0 + flat1) / 2, sqMidY + sqH + 10);

      // Basecalling
      const bcY = cY + areaH * 0.78;
      ctx.font = '10px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      ctx.fillText('truth: ATGCCAAAAAGGTC', sp.pad, bcY);
      ctx.fillText('call:  ATGCCAAA', sp.pad, bcY + 12);
      ctx.fillStyle = '#e05555';
      ctx.fillText('__', 14 + ctx.measureText('call:  ATGCCAAA').width, bcY + 12);
      ctx.fillStyle = colors.textTer;
      ctx.fillText('GGTC', 14 + ctx.measureText('call:  ATGCCAAA__').width, bcY + 12);

      ctx.font = '10px -apple-system, sans-serif';
      ctx.fillStyle = '#e05555';
      ctx.fillText('homopolymer deletion error', sp.pad, bcY + 24);

    }
    ctx.restore();

    // ===== RIGHT: ViroForge model =====
    ctx.save();
    ctx.beginPath();
    ctx.rect(rX, cY, rW, areaH);
    ctx.clip();

    // Right panel line spacing — tighter to fit
    const rLineH = Math.min(14, areaH / 22);
    const rGapH = Math.min(5, rLineH * 0.35);

    if (option === 'novaseq' || option === 'miseq') {
      const cfg = option === 'novaseq'
        ? { label: 'NovaSeq', readLen: 150, insert: 350, throughput: '6 Tb/run' }
        : { label: 'MiSeq', readLen: 250, insert: 450, throughput: '15 Gb/run' };

      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.accent;
      ctx.textAlign = 'center';
      ctx.fillText('InSilicoSeq (ISS) simulation', rX + rW / 2, cY + 12);

      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      const pX = rX + sp.pad;
      let py = cY + 28;
      const lines = [
        'Simulator: InSilicoSeq',
        'Mode:      basic (kde-free)',
        '',
        'read_length  = ' + cfg.readLen,
        'insert_size  = N(' + cfg.insert + ', 50²)',
        'error_model  = ' + cfg.label.toLowerCase(),
        '',
        'Output:',
        '  R1.fastq.gz  (forward)',
        '  R2.fastq.gz  (reverse)',
        '',
        'Error profile:',
        '  Position-dependent Q scores',
        option === 'novaseq' ? '  Binned quality (4 bins)' : '  Full quality spectrum',
      ];
      lines.forEach(line => {
        if (py > cY + areaH - 60) return;
        if (line === '') { py += rGapH; return; }
        ctx.fillText(line, pX, py);
        py += rLineH;
      });

      // Mini quality curve — anchored to bottom
      const qH = Math.min(30, areaH * 0.12);
      const qY = cY + areaH - qH - 18;
      const qW = rW - 24;
      const qL = rX + 12, qB = qY + qH;

      ctx.strokeStyle = colors.border;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(qL, qB);
      ctx.lineTo(qL + qW, qB);
      ctx.moveTo(qL, qY);
      ctx.lineTo(qL, qB);
      ctx.stroke();

      ctx.beginPath();
      ctx.strokeStyle = colors.accent;
      ctx.lineWidth = 1.5;
      for (let px = 0; px < qW; px++) {
        const pos = px / qW;
        let q = 35 - pos * 10 + Math.sin(px * 0.15) * 1.5;
        if (option === 'novaseq') q = Math.round(q / 8) * 8;
        const y = qB - (q / 40) * qH;
        if (px === 0) ctx.moveTo(qL + px, y); else ctx.lineTo(qL + px, y);
      }
      ctx.stroke();

      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'right';
      ctx.fillText('Q35', qL - 2, qY + 5);
      ctx.fillText('Q20', qL - 2, qB - 2);
      ctx.textAlign = 'center';
      ctx.fillText('Read position', qL + qW / 2, qB + 10);

    } else if (option === 'pacbio') {
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.accent;
      ctx.textAlign = 'center';
      ctx.fillText('PBSIM3 + CCS simulation', rX + rW / 2, cY + 12);

      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      const pX = rX + sp.pad;
      let py = cY + 28;
      const lines = [
        'Simulator: PBSIM3 → pbccs',
        '',
        'mean_length  = 15,000 bp',
        'n_passes     = 10',
        'clr_error    = 15%',
        'hifi_accuracy= >99.9%',
        '',
        'Pipeline:',
        '  1. PBSIM3 generates CLR',
        '  2. samtools → BAM',
        '  3. pbccs consensus call',
        '',
        'Error cancellation:',
        '  random errors differ',
        '  across passes → >Q40',
        '',
        'ViroForge adds:',
        '  • GC/length bias from amp',
        '  • Contamination injection',
        '  • Source labeling in header',
      ];
      lines.forEach(line => {
        if (py > cY + areaH - 4) return;
        if (line === '') { py += rGapH; return; }
        ctx.fillText(line, pX, py);
        py += rLineH;
      });

    } else if (option === 'nanopore') {
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.accent;
      ctx.textAlign = 'center';
      ctx.fillText('PBSIM3 Nanopore model', rX + rW / 2, cY + 12);

      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      const pX = rX + sp.pad;
      let py = cY + 28;
      const lines = [
        'Simulator: PBSIM3 (ONT mode)',
        '',
        'chemistry    = R10.4',
        'mean_length  = 20,000 bp',
        'error_rate   = 5%',
        'hp_del_bias  = 6',
        '',
        'Error model:',
        '  Homopolymer deletions 6×',
        '  more likely than random',
        '',
        'Length distribution:',
        '  Log-normal, mean 20 kb',
        '  Range: 1 kb to 100+ kb',
        '',
        'ViroForge adds:',
        '  • Contamination injection',
        '  • source= header labels',
        '  • Ground truth mapping',
      ];
      lines.forEach(line => {
        if (py > cY + areaH - 4) return;
        if (line === '') { py += rGapH; return; }
        ctx.fillText(line, pX, py);
        py += rLineH;
      });
    }
    ctx.restore();

    animFrame = requestAnimationFrame(draw);
  }
  draw();
}

/* === ARTIFACTS ANIMATION === */
function animateArtifacts(option, ctx, W, H, colors) {
  let t = 0;
  showLegend([]);

  function draw() {
    t++;
    ctx.clearRect(0, 0, W, H);
    const sp = drawSplitPanel(ctx, W, H, colors);
    const lW = sp.midX - sp.pad * 2, rX = sp.midX + sp.pad, rW = W - sp.midX - sp.pad * 2;
    const cY = sp.contentY;
    const areaH = H - cY - 10;
    const progress = Math.min(1, t / 200);

    if (option === 'adapters') {
      // ===== LEFT: Lab — how adapter read-through happens =====
      ctx.save();
      ctx.beginPath();
      ctx.rect(sp.pad, cY, lW, areaH);
      ctx.clip();

      ctx.font = '12px -apple-system, sans-serif';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'center';
      ctx.fillText('Adapter Read-Through', sp.pad + lW / 2, cY + 14);

      // Normal insert
      const fY = cY + 32;
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      ctx.fillText('Normal insert (350 bp):', 14, fY);

      const normY = fY + 10;
      const normL = 14, normR = sp.pad + lW - 6;
      const normW = normR - normL;
      const adpW = normW * 0.06;

      ctx.fillStyle = colors.warm + '50';
      ctx.fillRect(normL, normY, adpW, 10);
      ctx.fillStyle = colors.muted + '20';
      ctx.fillRect(normL + adpW, normY, normW - adpW * 2, 10);
      ctx.fillStyle = colors.warm + '50';
      ctx.fillRect(normR - adpW, normY, adpW, 10);

      // R1 and R2
      const rFrac = 150 / 350;
      const r1W = (normW - adpW * 2) * rFrac;
      const rProg = Math.min(1, progress * 2.5);
      ctx.fillStyle = colors.accent;
      ctx.fillRect(normL + adpW, normY + 14, r1W * rProg, 7);
      ctx.fillStyle = colors.accent + 'A0';
      ctx.fillRect(normR - adpW - r1W * rProg, normY + 14, r1W * rProg, 7);
      if (rProg > 0.3) {
        ctx.font = '12px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.accent;
        ctx.textAlign = 'left';
        ctx.fillText('R1→', normL + adpW, normY + 12);
        ctx.textAlign = 'right';
        ctx.fillText('←R2', normR - adpW, normY + 12);
        ctx.textAlign = 'right';
        ctx.fillStyle = colors.textTer;
        ctx.fillText('OK', normR + 1, normY + 22);
      }

      // Short insert — read-through
      const sY = normY + 34;
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      ctx.fillText('Short insert (100 bp) — read-through:', 14, sY);

      const sInsert = normW * (100 / 350);
      const sL = 14 + normW * 0.2;
      ctx.fillStyle = colors.warm + '40';
      ctx.fillRect(sL - adpW, sY + 10, adpW, 10);
      ctx.fillStyle = colors.muted + '15';
      ctx.fillRect(sL, sY + 10, sInsert, 10);
      ctx.fillStyle = colors.warm + '40';
      ctx.fillRect(sL + sInsert, sY + 10, adpW, 10);

      // Read extending into adapter
      const sProg = Math.min(1, Math.max(0, progress * 2.5 - 0.3));
      if (sProg > 0) {
        const readPx = (normW - adpW * 2) * rFrac * sProg;
        const dnaPart = Math.min(readPx, sInsert);
        const adpPart = Math.max(0, readPx - sInsert);
        ctx.fillStyle = colors.accent;
        ctx.fillRect(sL, sY + 24, dnaPart, 7);
        if (adpPart > 0) {
          ctx.fillStyle = colors.warm;
          ctx.fillRect(sL + sInsert, sY + 24, adpPart, 7);
        }
        if (adpPart > 5) {
          ctx.font = '12px "JetBrains Mono", monospace';
          ctx.fillStyle = colors.warm;
          ctx.textAlign = 'left';
          ctx.fillText('adapter in read!', sL + sInsert + adpPart + 4, sY + 30);
        }
      }

      // Why it matters
      const whyY = sY + 50;
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      const whys = [
        'Insert sizes follow a normal',
        'distribution. The left tail',
        '(insert < read length) creates',
        'reads that extend into adapters.',
        '',
        'QC tools (fastp, Trimmomatic)',
        'detect and trim these sequences.',
      ];
      whys.forEach((w, i) => {
        if (w === '') return;
        ctx.fillText(w, sp.pad, whyY + i * 18);
      });

      ctx.restore();

      // ===== RIGHT: ViroForge model =====
      ctx.save();
      ctx.beginPath();
      ctx.rect(rX, cY, rW, areaH);
      ctx.clip();

      const aRLineH = Math.min(13, areaH / 24);
      const aRGapH = Math.min(4, aRLineH * 0.3);

      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.accent;
      ctx.textAlign = 'center';
      ctx.fillText('Insert size distribution model', rX + rW / 2, cY + 12);

      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      ctx.fillText('insert ~ N(350, 50²)', rX + rW / 2, cY + 24);

      // Distribution curve
      const curveL = rX + 16, curveR = rX + rW - 8;
      const curveW = curveR - curveL;
      const curveT = cY + areaH * 0.12, curveB = cY + areaH * 0.40;
      const curveH = curveB - curveT;
      const minI = 50, maxI = 600, mu = 350, sig = 50;

      ctx.strokeStyle = colors.border;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(curveL, curveB);
      ctx.lineTo(curveR, curveB);
      ctx.stroke();

      ctx.beginPath();
      ctx.strokeStyle = colors.accent;
      ctx.lineWidth = 1.5;
      for (let px = 0; px < curveW; px++) {
        const ins = minI + (px / curveW) * (maxI - minI);
        const p = Math.exp(-Math.pow(ins - mu, 2) / (2 * sig * sig));
        const y = curveB - p * (curveH - 6);
        if (px === 0) ctx.moveTo(curveL + px, y); else ctx.lineTo(curveL + px, y);
      }
      ctx.stroke();

      // Read-through zone
      const rtPx = curveL + ((150 - minI) / (maxI - minI)) * curveW;
      ctx.fillStyle = colors.warm + '15';
      ctx.fillRect(curveL, curveT, rtPx - curveL, curveH);
      ctx.strokeStyle = colors.warm + '70';
      ctx.setLineDash([2, 2]);
      ctx.beginPath();
      ctx.moveTo(rtPx, curveT);
      ctx.lineTo(rtPx, curveB);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.font = '9px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.warm;
      ctx.textAlign = 'center';
      ctx.fillText('read-through', (curveL + rtPx) / 2, curveT + curveH * 0.5);

      const muPx = curveL + ((mu - minI) / (maxI - minI)) * curveW;
      ctx.fillStyle = colors.textTer;
      ctx.fillText('μ=350', muPx, curveT - 3);

      ctx.font = '9px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      [100, 300, 500].forEach(v => {
        const px = curveL + ((v - minI) / (maxI - minI)) * curveW;
        ctx.fillText(v + '', px, curveB + 9);
      });

      // Parameters
      const paramY = cY + areaH * 0.48;
      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      const pX = rX + sp.pad;
      const params = [
        '--adapter-rate  0.05',
        '--adapter-type  truseq',
        '',
        'Rate is emergent from',
        'insert size left tail.',
        '',
        'Adapter sequences:',
        '  TruSeq (11 sequences)',
        '  Nextera (chimeric)',
        '',
        'Output: manifest TSV',
      ];
      let py = paramY;
      params.forEach(line => {
        if (py > cY + areaH - 4) return;
        if (line === '') { py += aRGapH; return; }
        ctx.fillText(line, pX, py);
        py += aRLineH;
      });

      ctx.restore();

    } else if (option === 'duplicates') {
      // ===== LEFT: Lab — PCR creates duplicates =====
      ctx.save();
      ctx.beginPath();
      ctx.rect(sp.pad, cY, lW, areaH);
      ctx.clip();

      ctx.font = '12px -apple-system, sans-serif';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'center';
      ctx.fillText('PCR Duplicate Formation', sp.pad + lW / 2, cY + 14);

      // Template + copies
      const tY = cY + 34;
      ctx.fillStyle = colors.accent;
      ctx.fillRect(14, tY, lW - 20, 7);
      ctx.font = '12px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.accent;
      ctx.textAlign = 'left';
      ctx.fillText('Original template', sp.pad, tY - 3);

      const copyProg = Math.min(1, progress * 3);
      const nCyc = Math.min(3, Math.floor(copyProg * 3.5));
      const dupRng = mulberry32(55);
      let total = 0;
      const copyY = tY + 14;

      for (let c = 0; c < nCyc; c++) {
        const nNew = Math.min(Math.pow(2, c), 4);
        for (let j = 0; j < nNew; j++) {
          total++;
          const cy = copyY + (total - 1) * 11;
          if (cy > tY + 70) continue;
          const alpha = Math.max(30, 80 - c * 15);
          ctx.fillStyle = colors.warm + alpha.toString(16).padStart(2, '0');
          ctx.fillRect(14 + c * 4, cy, lW - 20 - c * 4, 5);

          const errRng = mulberry32(c * 100 + j);
          for (let e = 0; e < c; e++) {
            const ex = 14 + c * 4 + errRng() * (lW - 30 - c * 4);
            ctx.fillStyle = '#e05555';
            ctx.fillRect(ex, cy, 2, 5);
          }
        }
      }

      if (nCyc > 0) {
        ctx.font = '12px -apple-system, sans-serif';
        ctx.fillStyle = '#e05555';
        ctx.textAlign = 'left';
        ctx.fillText('Red = PCR errors (~0.1%/base/cycle)', 14, copyY + Math.min(total, 6) * 11 + 6);
      }

      // Why biased
      const biasY = tY + 100;
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      const biasLines = [
        'Not all templates duplicate equally:',
        '',
        '• 50% GC templates amplify best',
        '• Shorter fragments amplify more',
        '• Bridge amplification favors',
        '  certain binding efficiencies',
        '',
        'This creates systematic bias in',
        'coverage depth, not just noise.',
      ];
      biasLines.forEach((l, i) => {
        if (l === '') return;
        ctx.fillText(l, sp.pad, biasY + i * 18);
      });

      ctx.restore();

      // ===== RIGHT: ViroForge model =====
      ctx.save();
      ctx.beginPath();
      ctx.rect(rX, cY, rW, areaH);
      ctx.clip();

      const dRLineH = Math.min(13, areaH / 24);
      const dRGapH = Math.min(4, dRLineH * 0.3);

      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.accent;
      ctx.textAlign = 'center';
      ctx.fillText('Geometric copy distribution', rX + rW / 2, cY + 12);

      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.fillText('P(k copies) = 0.5^k', rX + rW / 2, cY + 24);

      // Bar chart — zone 1: 10-30%
      const geoL = rX + 20, geoR = rX + rW - 10;
      const geoT = cY + areaH * 0.12, geoB = cY + areaH * 0.30;
      const geoH = geoB - geoT;
      const copies = [1, 2, 3, 4, 5];
      const probs = copies.map(k => Math.pow(0.5, k));
      const barW = Math.min(14, (geoR - geoL) / copies.length - 4);
      const barProg = Math.min(1, Math.max(0, progress * 2.5 - 0.3));

      ctx.strokeStyle = colors.border;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(geoL, geoB);
      ctx.lineTo(geoR, geoB);
      ctx.stroke();

      copies.forEach((k, i) => {
        const bx = geoL + 6 + i * ((geoR - geoL) / copies.length);
        const bh = (probs[i] / probs[0]) * geoH * barProg;
        ctx.fillStyle = colors.accent + '70';
        ctx.fillRect(bx, geoB - bh, barW, bh);
        ctx.font = '9px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'center';
        ctx.fillText(k + '', bx + barW / 2, geoB + 9);
        if (barProg > 0.5) {
          ctx.fillStyle = colors.accent;
          ctx.fillText((probs[i] * 100).toFixed(0) + '%', bx + barW / 2, geoB - bh - 3);
        }
      });
      ctx.font = '9px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      ctx.fillText('# copies', (geoL + geoR) / 2, geoB + 18);

      // GC bias curve — zone 2: 36-60%
      const gcY2 = cY + areaH * 0.36;
      ctx.font = '10px -apple-system, sans-serif';
      ctx.fillStyle = colors.warm;
      ctx.textAlign = 'left';
      ctx.fillText('Template selection bias:', rX + 10, gcY2);

      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.fillText('GC: Gaussian(0.50, 0.15²)', rX + 10, gcY2 + 12);

      // Mini GC curve
      const gcMiniL = rX + 10, gcMiniR = rX + rW - 10;
      const gcMiniW = gcMiniR - gcMiniL;
      const gcMiniT = gcY2 + 18, gcMiniH = Math.min(22, areaH * 0.08);

      if (barProg > 0.3) {
        ctx.beginPath();
        ctx.strokeStyle = colors.warm + '70';
        ctx.lineWidth = 1.5;
        for (let px = 0; px < gcMiniW; px++) {
          const gc = 0.25 + (px / gcMiniW) * 0.50;
          const w = Math.exp(-Math.pow(gc - 0.50, 2) / (2 * 0.15 * 0.15));
          const y = gcMiniT + gcMiniH - w * gcMiniH;
          if (px === 0) ctx.moveTo(gcMiniL + px, y); else ctx.lineTo(gcMiniL + px, y);
        }
        ctx.stroke();

        ctx.font = '9px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'center';
        ctx.fillText('30%', gcMiniL + gcMiniW * 0.1, gcMiniT + gcMiniH + 8);
        ctx.fillText('50%', gcMiniL + gcMiniW * 0.5, gcMiniT + gcMiniH + 8);
        ctx.fillText('70%', gcMiniL + gcMiniW * 0.9, gcMiniT + gcMiniH + 8);
      }

      // Length bias + params — zone 3: 65-100%
      const lenY2 = cY + areaH * 0.65;
      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      ctx.fillText('Length: max(0.3,', rX + 10, lenY2);
      ctx.fillText('  1.0-(len-100)/500)', rX + 10, lenY2 + dRLineH);

      const pX = rX + sp.pad;
      const params = [
        '--duplicate-rate  0.05',
        'pcr_error_rate = 0.001',
        '',
        'Output: manifest TSV',
      ];
      let py = lenY2 + dRLineH * 2 + dRGapH;
      params.forEach(line => {
        if (py > cY + areaH - 4) return;
        if (line === '') { py += dRGapH; return; }
        ctx.fillText(line, pX, py);
        py += dRLineH;
      });

      ctx.restore();

    } else {
      // Low complexity — split panel
      // ===== LEFT: Lab — what low-complexity reads are =====
      ctx.save();
      ctx.beginPath();
      ctx.rect(sp.pad, cY, lW, areaH);
      ctx.clip();

      ctx.font = '12px -apple-system, sans-serif';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'center';
      ctx.fillText('Low-Complexity Reads', sp.pad + lW / 2, cY + 14);

      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      ctx.fillText('Real sequencing runs produce', sp.pad, cY + 30);
      ctx.fillText('reads with repetitive sequence:', sp.pad, cY + 42);

      const types = [
        { name: 'Homopolymer', seq: 'AAAAAAAAAAAA', entropy: '0.0' },
        { name: 'Dinucleotide', seq: 'ATATATATATATAT', entropy: '0.5' },
        { name: 'Simple repeat', seq: 'ATGATGATGATG', entropy: '0.8' },
        { name: 'Low entropy', seq: 'AATGAATGAATC', entropy: '1.2' },
      ];
      const baseColors = { A: '#4CAF50', T: '#F44336', G: '#FFC107', C: '#2196F3' };

      types.forEach((tp, i) => {
        const y = cY + 60 + i * 42;
        ctx.font = '11px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        ctx.fillText(tp.name, sp.pad, y);

        const seqProg = Math.min(1, (t - i * 15) / 60);
        if (seqProg > 0) {
          const chars = tp.seq.substring(0, Math.floor(seqProg * tp.seq.length));
          ctx.font = '11px "JetBrains Mono", monospace';
          let cx = 14;
          for (const ch of chars) {
            ctx.fillStyle = baseColors[ch] || colors.text;
            ctx.fillText(ch, cx, y + 14);
            cx += 8;
          }
          ctx.font = '11px "JetBrains Mono", monospace';
          ctx.fillStyle = colors.textTer;
          ctx.fillText('H=' + tp.entropy, cx + 4, y + 14);
        }
      });

      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      ctx.fillText('Sources: polymerase slippage,', sp.pad, cY + areaH - 30);
      ctx.fillText('tandem repeats, signal noise', sp.pad, cY + areaH - 18);

      ctx.restore();

      // ===== RIGHT: ViroForge model =====
      ctx.save();
      ctx.beginPath();
      ctx.rect(rX, cY, rW, areaH);
      ctx.clip();

      const lcRLineH = Math.min(13, areaH / 24);
      const lcRGapH = Math.min(4, lcRLineH * 0.3);

      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.accent;
      ctx.textAlign = 'center';
      ctx.fillText('Entropy-controlled injection', rX + rW / 2, cY + 12);

      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      const pX = rX + sp.pad;
      let py = cY + 28;
      const lines = [
        '--low-complexity-rate 0.02',
        '--entropy-range 0.3-0.7',
        '',
        'Shannon entropy H measures',
        'sequence randomness:',
        '  H = 0.0  pure repeat',
        '  H = 2.0  random sequence',
        '',
        'Gray-zone reads (H=0.3-0.7)',
        'test complexity filter',
        'threshold sensitivity.',
        '',
        'Generation modes:',
        '  • Homopolymer runs',
        '  • Dinucleotide repeats',
        '  • Simple sequence repeats',
        '  • Controlled-entropy mix',
        '',
        'Output: manifest TSV',
      ];
      lines.forEach(line => {
        if (py > cY + areaH - 4) return;
        if (line === '') { py += lcRGapH; return; }
        ctx.fillText(line, pX, py);
        py += lcRLineH;
      });

      ctx.restore();
    }

    animFrame = requestAnimationFrame(draw);
  }
  draw();
}

/* === COLLECTION ANIMATION === */
function animateCollection(option, ctx, W, H, colors) {
  showLegend([]);
  let t = 0;

  const COLLECTIONS = [
    { id: 1, name: 'Gut (Western Diet)', genomes: 134, cat: 'body', host: 5, rrna: 3, reagent: 0.5, phix: 0.1, bact: 70, fungal: 2, arch: 2 },

    { id: 5, name: 'Marine (Coastal)', genomes: 445, cat: 'env', host: 0.05, rrna: 5, reagent: 0.5, phix: 0.1, bact: 75, fungal: 0.5, arch: 2 },

    { id: 7, name: 'Freshwater (Lake)', genomes: 200, cat: 'env', host: 0.05, rrna: 5, reagent: 0.5, phix: 0.1, bact: 70, fungal: 0.5, arch: 0.5 },
    { id: 8, name: 'Mouse Gut (C57BL/6)', genomes: 22, cat: 'body', host: 3, rrna: 3, reagent: 0.5, phix: 0.1, bact: 70, fungal: 2, arch: 2 },
    { id: 9, name: 'Wastewater (Urban)', genomes: 352, cat: 'env', host: 1, rrna: 8, reagent: 0.5, phix: 0.1, bact: 75, fungal: 2, arch: 3 },
    { id: 10, name: 'IBD Gut Virome', genomes: 90, cat: 'disease', host: 5, rrna: 3, reagent: 0.5, phix: 0.1, bact: 70, fungal: 2, arch: 1 },
    { id: 11, name: 'HIV+ Gut Virome', genomes: 55, cat: 'disease', host: 5, rrna: 3, reagent: 0.5, phix: 0.1, bact: 70, fungal: 3, arch: 2 },
    { id: 12, name: 'CF Respiratory', genomes: 79, cat: 'disease', host: 25, rrna: 5, reagent: 0.5, phix: 0.1, bact: 55, fungal: 2, arch: 0 },
    { id: 13, name: 'Respiratory RNA', genomes: 53, cat: 'rna', host: 15, rrna: 10, reagent: 0.5, phix: 0.1, bact: 0, fungal: 0, arch: 0 },
    { id: 14, name: 'Arbovirus (Mosquito)', genomes: 39, cat: 'rna', host: 0.05, rrna: 8, reagent: 0.5, phix: 0.1, bact: 0, fungal: 0, arch: 0 },
    { id: 15, name: 'Fecal RNA', genomes: 46, cat: 'rna', host: 5, rrna: 12, reagent: 0.5, phix: 0.1, bact: 0, fungal: 0, arch: 0 },
    { id: 16, name: 'Vaginal (Healthy)', genomes: 26, cat: 'body', host: 20, rrna: 3, reagent: 0.5, phix: 0.1, bact: 60, fungal: 3, arch: 0 },
    { id: 17, name: 'Blood/Plasma', genomes: 21, cat: 'body', host: 40, rrna: 0.5, reagent: 1, phix: 0.1, bact: 1, fungal: 0.1, arch: 0 },
    { id: 18, name: 'Ocular Surface', genomes: 17, cat: 'body', host: 15, rrna: 2, reagent: 2, phix: 0.1, bact: 10, fungal: 0.5, arch: 0 },
    { id: 19, name: 'Lung (Lower Resp.)', genomes: 31, cat: 'body', host: 25, rrna: 4, reagent: 1, phix: 0.1, bact: 20, fungal: 1, arch: 0 },
    { id: 20, name: 'Urinary', genomes: 20, cat: 'body', host: 10, rrna: 3, reagent: 1, phix: 0.1, bact: 30, fungal: 0.5, arch: 0 },
  ];
  COLLECTIONS.forEach(c => {
    const totalVirome = 100 - c.host - c.rrna - c.reagent - c.phix - c.bact - c.fungal - c.arch;
    c.darkmatter = totalVirome * 0.30;
    c.viral = totalVirome - c.darkmatter;
  });
  const maxGenomes = Math.max(...COLLECTIONS.map(c => c.genomes));
  const catColors = { body: colors.accent, env: colors.phix, disease: colors.warm, rna: colors.rrna };

  let selectedIdx = -1;
  let detailAnim = 0;
  let contamLevel = 'realistic';
  const contamLevels = [
    { id: 'clean', label: 'Clean', mult: 0.25 },
    { id: 'realistic', label: 'Realistic', mult: 1 },
    { id: 'heavy', label: 'Heavy', mult: 2.5 },
  ];
  const scaledKeys = ['host', 'rrna', 'reagent', 'phix'];

  function getScaled(c) {
    const mult = contamLevels.find(l => l.id === contamLevel).mult;
    const sc = {};
    compKeys.forEach(key => {
      if (key === 'viral' || key === 'darkmatter') return;
      sc[key] = scaledKeys.includes(key) ? Math.min(c[key] * mult, 100) : c[key];
    });
    const totalContam = Object.values(sc).reduce((a, b) => a + b, 0);
    const totalVirome = Math.max(0, 100 - totalContam);
    sc.darkmatter = totalVirome * 0.30;
    sc.viral = totalVirome - sc.darkmatter;
    return sc;
  }

  // Click handler
  const canvas = ctx.canvas;
  const hitStartY = 38;
  const hitRowH = (H - hitStartY - 30) / 20;
  const btnH = 20;
  const btnRowY = 24 + 22;

  function onCanvasClick(e) {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    const detailOpen = selectedIdx >= 0;
    const panelX = W * 0.50;
    const listW = detailOpen ? W * 0.48 : W;

    // If clicking inside the detail panel, only respond to contamination buttons
    if (detailOpen && mx >= panelX - 6) {
      ctx.font = '11px "JetBrains Mono", monospace';
      const prefW = ctx.measureText('Contamination: ').width + 4;
      ctx.font = '12px "JetBrains Mono", monospace';
      let bx = panelX + prefW;
      for (const lev of contamLevels) {
        const bw = ctx.measureText(lev.label + ' (' + lev.mult + '×)').width + 18;
        if (mx >= bx && mx <= bx + bw && my >= btnRowY && my <= btnRowY + btnH) {
          contamLevel = lev.id;
          detailAnim = Math.max(detailAnim, 0.5);
          return;
        }
        bx += bw + 6;
      }
      return;
    }

    // Collection rows — only in left panel area
    for (let i = 0; i < 20; i++) {
      const y = hitStartY + i * hitRowH;
      if (my >= y && my <= y + hitRowH && mx >= 0 && mx <= listW) {
        selectedIdx = (selectedIdx === i) ? -1 : i;
        detailAnim = 0;
        contamLevel = 'realistic';
        break;
      }
    }
  }
  canvas.addEventListener('click', onCanvasClick);
  function onCanvasMove(e) {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    let hit = false;
    for (let i = 0; i < 20; i++) {
      const y = hitStartY + i * hitRowH;
      if (my >= y && my <= y + hitRowH) { hit = true; break; }
    }
    if (!hit && selectedIdx >= 0 && my >= btnRowY && my <= btnRowY + btnH && mx >= W * 0.50) hit = true;
    canvas.style.cursor = hit ? 'pointer' : 'default';
  }
  canvas.addEventListener('mousemove', onCanvasMove);
  canvas._collClickHandler = onCanvasClick;
  canvas._collMoveHandler = onCanvasMove;

  const compColors = {
    viral: colors.viral,
    darkmatter: '#1a5566',
    bact: colors.bacteria,
    host: colors.host,
    rrna: colors.rrna,
    fungal: '#8d6e3f',
    arch: '#5a7a3a',
    reagent: colors.muted,
    phix: colors.phix,
  };
  const compLabels = {
    viral: 'Viral (classified)', darkmatter: 'Viral (dark matter)', bact: 'Bacterial', host: 'Host DNA', rrna: 'rRNA',
    fungal: 'Fungal', arch: 'Archaeal', reagent: 'Reagent', phix: 'PhiX',
  };
  const compKeys = ['viral', 'darkmatter', 'bact', 'host', 'rrna', 'fungal', 'arch', 'reagent', 'phix'];

  function draw() {
    t++;
    ctx.clearRect(0, 0, W, H);
    const progress = Math.min(1, t / 100);

      // Split layout: left = collection list, right = detail panel
      const detailOpen = selectedIdx >= 0;
      const listW = detailOpen ? W * 0.48 : W;

      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'center';
      ctx.fillText(detailOpen ? 'Click a collection' : '20 Curated Virome Collections — click any bar', listW / 2, 22);

      const barMaxW = (detailOpen ? listW * 0.38 : W * 0.36);
      const labelX = detailOpen ? listW * 0.52 : W * 0.42;
      const barX = labelX + 10;
      const startY = 38;
      const rowH = (H - startY - 30) / 20;
      const barH = Math.max(10, rowH - 6);

      COLLECTIONS.forEach((c, i) => {
        const y = startY + i * rowH;
        const barW = barMaxW * (c.genomes / maxGenomes) * progress;
        const cc = catColors[c.cat] || colors.accent;
        const isSelected = i === selectedIdx;

        if (isSelected) {
          ctx.fillStyle = colors.accent + '18';
          ctx.fillRect(0, y - 2, listW, rowH);
        }

        ctx.font = '11px "JetBrains Mono", monospace';
        ctx.fillStyle = isSelected ? colors.accent : colors.textTer;
        ctx.textAlign = 'right';
        ctx.fillText(String(c.id).padStart(2, ' '), 22, y + barH * 0.75);

        ctx.font = '11px -apple-system, sans-serif';
        ctx.fillStyle = isSelected ? colors.accent : colors.text;
        ctx.textAlign = 'right';
        ctx.fillText(c.name, labelX, y + barH * 0.75);

        ctx.fillStyle = cc;
        ctx.globalAlpha = isSelected ? 1 : 0.7;
        ctx.fillRect(barX, y, barW, barH);
        ctx.globalAlpha = 1;

        if (barW > 5) {
          ctx.font = '11px "JetBrains Mono", monospace';
          ctx.fillStyle = colors.textTer;
          ctx.textAlign = 'left';
          ctx.fillText(c.genomes, barX + barW + 6, y + barH * 0.75);
        }
      });

      // Category legend at bottom left
      const legY = H - 10;
      const cats = [['Body-site', 'body'], ['Environmental', 'env'], ['Disease', 'disease'], ['RNA', 'rna']];
      let legX = 10;
      ctx.font = '11px -apple-system, sans-serif';
      cats.forEach(([label, key]) => {
        ctx.fillStyle = catColors[key];
        ctx.fillRect(legX, legY - 8, 10, 10);
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        ctx.fillText(label, legX + 14, legY);
        legX += ctx.measureText(label).width + 28;
      });

      // Detail panel on the right
      if (detailOpen) {
        detailAnim = Math.min(1, detailAnim + 0.05);
        const c = COLLECTIONS[selectedIdx];
        const panelX = W * 0.50;
        const panelW = W * 0.48;

        // Divider
        ctx.strokeStyle = colors.border || colors.textTer + '30';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(panelX - 6, 32);
        ctx.lineTo(panelX - 6, H - 20);
        ctx.stroke();

        // Layout positions for detail panel
        const titleY = 24;
        const btnRowY = titleY + 22;
        const subtitleY = btnRowY + btnH + 12;
        const stackY = subtitleY + 16;
        const stackH = 28;

        // Title
        ctx.font = '11px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.accent;
        ctx.textAlign = 'left';
        ctx.fillText(c.name, panelX, titleY);

        // Contamination level toggle buttons
        const curMult = contamLevels.find(l => l.id === contamLevel);
        ctx.font = '11px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        ctx.fillText('Contamination:', panelX, btnRowY + btnH * 0.65);
        let bx = panelX + ctx.measureText('Contamination: ').width + 4;
        contamLevels.forEach(lev => {
          ctx.font = '12px "JetBrains Mono", monospace';
          const bLabel = lev.label + ' (' + lev.mult + '×)';
          const bw = ctx.measureText(bLabel).width + 18;
          const isActive = lev.id === contamLevel;
          if (isActive) {
            ctx.fillStyle = colors.accent;
            ctx.globalAlpha = 0.15;
            ctx.fillRect(bx, btnRowY, bw, btnH);
            ctx.globalAlpha = 1;
          }
          ctx.strokeStyle = isActive ? colors.accent : (colors.border || colors.textTer + '40');
          ctx.lineWidth = 1;
          ctx.strokeRect(bx, btnRowY, bw, btnH);
          ctx.fillStyle = isActive ? colors.accent : colors.textSec;
          ctx.textAlign = 'center';
          ctx.fillText(bLabel, bx + bw / 2, btnRowY + btnH * 0.65);
          bx += bw + 6;
        });

        // Compute scaled composition
        const sc = getScaled(c);

        // Subtitle
        ctx.font = '11px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        ctx.fillText(c.genomes + ' genomes | Prep-quality contaminants scale by ' + curMult.mult + '×', panelX, subtitleY);
        const stackW = panelW - 20;
        let sx = panelX;

        compKeys.forEach(key => {
          const pct = sc[key];
          if (pct <= 0) return;
          const segW = stackW * (pct / 100) * detailAnim;
          ctx.fillStyle = compColors[key];
          ctx.globalAlpha = 0.85;
          ctx.fillRect(sx, stackY, segW, stackH);
          ctx.globalAlpha = 1;
          sx += segW;
        });

        // Border around stack
        ctx.strokeStyle = colors.border || colors.textTer + '40';
        ctx.lineWidth = 1;
        ctx.strokeRect(panelX, stackY, stackW * detailAnim, stackH);

        // Percentage labels inside bar
        sx = panelX;
        ctx.font = '12px "JetBrains Mono", monospace';
        ctx.textAlign = 'center';
        compKeys.forEach(key => {
          const pct = sc[key];
          if (pct <= 0) return;
          const segW = stackW * (pct / 100) * detailAnim;
          if (segW > 32) {
            ctx.fillStyle = '#fff';
            ctx.globalAlpha = detailAnim;
            ctx.fillText(pct.toFixed(pct >= 1 ? 0 : 1) + '%', sx + segW / 2, stackY + stackH / 2 + 4);
            ctx.globalAlpha = 1;
          }
          sx += segW;
        });

        // Legend rows below the bar
        const legStartY = stackY + stackH + 18;
        const legColW = panelW * 0.5;
        compKeys.forEach((key, i) => {
          const pct = sc[key];
          if (pct <= 0.01) return;
          const col = i < 5 ? 0 : 1;
          const row = i < 5 ? i : i - 5;
          const lx = panelX + col * legColW;
          const ly = legStartY + row * 18;
          const ap = Math.min(1, detailAnim * 3 - i * 0.15);
          if (ap <= 0) return;
          ctx.globalAlpha = ap;

          ctx.fillStyle = compColors[key];
          ctx.fillRect(lx, ly - 7, 10, 10);

          ctx.font = '11px -apple-system, sans-serif';
          ctx.fillStyle = colors.text;
          ctx.textAlign = 'left';
          ctx.fillText(compLabels[key], lx + 16, ly + 2);

          ctx.font = '11px "JetBrains Mono", monospace';
          ctx.fillStyle = colors.textTer;
          const isScaledKey = scaledKeys.includes(key);
          const labelOffsetX = (key === 'darkmatter' || key === 'viral') ? 130 : 85;
          ctx.fillText(pct.toFixed(pct >= 1 ? 1 : 2) + '%' + (isScaledKey && contamLevel !== 'realistic' ? ' (' + curMult.mult + '×)' : ''), lx + labelOffsetX, ly + 2);
          ctx.globalAlpha = 1;
        });

        // Note
        const noteY = legStartY + 5 * 18 + 10;
        if (detailAnim > 0.8) {
          ctx.globalAlpha = (detailAnim - 0.8) * 5;
          ctx.font = '11px -apple-system, sans-serif';
          ctx.fillStyle = colors.textTer;
          ctx.textAlign = 'left';
          ctx.fillText('Dark matter = unclassified viral sequences (--dark-matter-fraction 0.30)', panelX, noteY);
          ctx.fillText('Host/rRNA/reagent/PhiX scale by level; bacterial/fungal/archaeal do not', panelX, noteY + 16);
          ctx.globalAlpha = 1;
        }
      }

    animFrame = requestAnimationFrame(draw);
  }
  draw();
}

/* === OUTPUT ANIMATION === */
function animateOutput(option, ctx, W, H, colors) {
  showLegend([]);
  let t = 0;

  function draw() {
    t++;
    ctx.clearRect(0, 0, W, H);

    if (option === 'fastq') {
      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'center';
      ctx.fillText('FASTQ Output with Per-Read Labels', W / 2, 24);

      const lines = [
        { text: '@NC_001422.1_42_1/1 source=phix', hl: 'source=phix', hlColor: colors.phix },
        { text: 'ATGAAAGCAATTATTGCTGAAACTGCTGCTCTG', hl: null },
        { text: '+', hl: null },
        { text: 'FFFFFFFFFFFFFFFFFFFFFFFFFFFF:FFFF', hl: null },
        { text: '@GCF_000819615_108_2/1 source=viral', hl: 'source=viral', hlColor: colors.viral },
        { text: 'GCTAACGATCGTAAGCTTGATCGTAAGCTTGAT', hl: null },
        { text: '@T2T_chr1_55_1/1 source=host_dna', hl: 'source=host_dna', hlColor: colors.host },
        { text: 'CAGGTGCAGCTGGTGCAGTCTGGGGCTGAGGTG', hl: null },
      ];

      const startY = 50;
      lines.forEach((line, i) => {
        const progress = Math.min(1, (t - i * 8) / 40);
        if (progress <= 0) return;
        const y = startY + i * 22;
        ctx.font = '11px "JetBrains Mono", monospace';
        ctx.globalAlpha = progress;
        ctx.fillStyle = colors.text;
        const visText = line.text.substring(0, Math.floor(progress * line.text.length));
        ctx.textAlign = 'left';
        ctx.fillText(visText, 30, y);

        if (line.hl && progress > 0.8) {
          const hlIdx = line.text.indexOf(line.hl);
          const beforeW = ctx.measureText(line.text.substring(0, hlIdx)).width;
          const hlW = ctx.measureText(line.hl).width;
          ctx.fillStyle = line.hlColor + '30';
          ctx.fillRect(30 + beforeW - 2, y - 12, hlW + 4, 16);
          ctx.fillStyle = line.hlColor;
          ctx.fillText(line.hl, 30 + beforeW, y);
        }
        ctx.globalAlpha = 1;
      });
    } else if (option === 'metadata') {
      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'center';
      ctx.fillText('Metadata JSON (ground truth)', W / 2, 24);

      const jsonLines = [
        '{',
        '  "collection": "IBD Gut Virome",',
        '  "n_reads": 1000000,',
        '  "platform": "novaseq",',
        '  "enrichment_stats": {',
        '    "viral_enrichment": 14.2,',
        '    "host_reduction": 0.98',
        '  },',
        '  "benchmarking": {',
        '    "expected_coverage": [...],',
        '    "taxonomy": [...]',
        '  }',
        '}',
      ];

      jsonLines.forEach((line, i) => {
        const progress = Math.min(1, (t - i * 6) / 30);
        if (progress <= 0) return;
        ctx.globalAlpha = progress;
        ctx.font = '11px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.text;
        ctx.textAlign = 'left';
        ctx.fillText(line, 40, 50 + i * 18);
        ctx.globalAlpha = 1;
      });
    } else {
      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'center';
      ctx.fillText('Manifest Files', W / 2, 24);

      const files = [
        { name: 'adapter_manifest.tsv', desc: 'Read ID, adapter type, position' },
        { name: 'duplicate_manifest.tsv', desc: 'Original read, copy count, errors' },
        { name: 'lowcomplex_manifest.tsv', desc: 'Read ID, entropy, repeat type' },
        { name: 'contamination_manifest.tsv', desc: 'Source, count, percentage' },
        { name: 'composition.tsv', desc: 'Genome ID, abundance, reads, family' },
      ];

      files.forEach((f, i) => {
        const y = 55 + i * 48;
        const progress = Math.min(1, (t - i * 15) / 40);
        if (progress <= 0) return;
        ctx.globalAlpha = progress;

        ctx.fillStyle = colors.field || colors.border + '20';
        ctx.fillRect(40, y - 6, W - 80, 38);
        ctx.font = '11px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.accent;
        ctx.textAlign = 'left';
        ctx.fillText(f.name, 52, y + 10);
        ctx.font = '12px -apple-system, sans-serif';
        ctx.fillStyle = colors.textTer;
        ctx.fillText(f.desc, 52, y + 26);

        ctx.globalAlpha = 1;
      });
    }
    animFrame = requestAnimationFrame(draw);
  }
  draw();
}

/* === REPORT ANIMATION === */
function animateReport(ctx, W, H, colors) {
  showLegend([]);
  let t = 0;

  function draw() {
    t++;
    ctx.clearRect(0, 0, W, H);

    ctx.font = '11px "JetBrains Mono", monospace';
    ctx.fillStyle = colors.textSec;
    ctx.textAlign = 'center';
    ctx.fillText('Auto-Generated HTML Diagnostic Report', W / 2, 24);

    const plots = [
      { name: 'Composition Pie', x: 0, y: 0 },
      { name: 'VLP Before/After', x: 1, y: 0 },
      { name: 'Family Distribution', x: 2, y: 0 },
      { name: 'Rank-Abundance', x: 3, y: 0 },
      { name: 'GC Histogram', x: 0, y: 1 },
      { name: 'Length vs Abundance', x: 1, y: 1 },
      { name: 'Contamination Table', x: 2, y: 1 },
      { name: 'Artifact Summary', x: 3, y: 1 },
    ];

    const gridW = (W - 60) / 4, gridH = (H - 80) / 2;
    const rng = mulberry32(33);

    plots.forEach((p, i) => {
      const progress = Math.min(1, (t - i * 18) / 50);
      if (progress <= 0) return;
      const px = 20 + p.x * gridW, py = 45 + p.y * gridH;

      ctx.globalAlpha = progress;
      ctx.fillStyle = colors.field || colors.border + '15';
      ctx.fillRect(px + 4, py + 4, gridW - 8, gridH - 8);
      ctx.strokeStyle = colors.border;
      ctx.lineWidth = 1;
      ctx.strokeRect(px + 4, py + 4, gridW - 8, gridH - 8);

      // Mini chart placeholder
      ctx.fillStyle = colors.accent + '60';
      if (i < 4) {
        for (let b = 0; b < 5; b++) {
          const bh = rng() * (gridH * 0.5) * progress;
          ctx.fillRect(px + 14 + b * 18, py + gridH - 18 - bh, 12, bh);
        }
      } else {
        ctx.beginPath();
        ctx.strokeStyle = colors.accent;
        ctx.lineWidth = 1.5;
        for (let x = 0; x < 6; x++) {
          const lx = px + 14 + x * 18;
          const ly = py + 20 + rng() * gridH * 0.4;
          if (x === 0) ctx.moveTo(lx, ly); else ctx.lineTo(lx, ly);
        }
        ctx.stroke();
      }

      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      ctx.fillText(p.name, px + gridW / 2, py + gridH - 4);
      ctx.globalAlpha = 1;
    });

    animFrame = requestAnimationFrame(draw);
  }
  draw();
}

/* === BENCHMARK ANIMATION === */
function animateBenchmark(option, ctx, W, H, colors) {
  showLegend([]);
  let t = 0;
  const rng = mulberry32(88);

  function draw() {
    t++;
    ctx.clearRect(0, 0, W, H);

    const titles = {
      qc: 'QC Benchmark: Contamination Removal Accuracy',
      assembly: 'Assembly Benchmark: Genome Recovery',
      taxonomy: 'Taxonomy Benchmark: Classification Accuracy'
    };
    ctx.font = '11px "JetBrains Mono", monospace';
    ctx.fillStyle = colors.textSec;
    ctx.textAlign = 'center';
    ctx.fillText(titles[option] || '', W / 2, 24);

    if (option === 'qc') {
      const metrics = [
        { name: 'Viral Retention', value: 0.97, target: 0.97 },
        { name: 'Host Removal', value: 0.98, target: 0.98 },
        { name: 'rRNA Removal', value: 0.95, target: 0.95 },
        { name: 'PhiX Removal', value: 0.99, target: 0.99 },
        { name: 'Duplicate Removal', value: 0.92, target: 0.92 },
      ];

      metrics.forEach((m, i) => {
        const progress = Math.min(1, (t - i * 15) / 60);
        if (progress <= 0) return;
        const y = 55 + i * 46;
        const barW = W * 0.5;

        ctx.font = '12px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.textSec;
        ctx.textAlign = 'right';
        ctx.fillText(m.name, W * 0.28, y + 10);

        // Background bar
        ctx.fillStyle = colors.field || colors.border + '20';
        ctx.fillRect(W * 0.3, y, barW, 16);

        // Value bar
        const filledW = barW * m.value * progress;
        ctx.fillStyle = m.value > 0.9 ? colors.accent : colors.warm;
        ctx.fillRect(W * 0.3, y, filledW, 16);

        // Percentage
        ctx.fillStyle = colors.text;
        ctx.textAlign = 'left';
        ctx.fillText((m.value * 100 * progress).toFixed(1) + '%', W * 0.3 + barW + 8, y + 12);
      });

    } else if (option === 'assembly') {
      const genomes = [];
      for (let i = 0; i < 12; i++) {
        genomes.push({ completeness: 0.3 + rng() * 0.7, identity: 0.95 + rng() * 0.05 });
      }

      const plotL = W * 0.15, plotR = W * 0.85, plotT = 50, plotB = H - 50;
      // Axes
      ctx.strokeStyle = colors.border;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(plotL, plotT); ctx.lineTo(plotL, plotB); ctx.lineTo(plotR, plotB);
      ctx.stroke();

      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      ctx.fillText('Completeness (%)', (plotL + plotR) / 2, plotB + 30);
      ctx.save();
      ctx.translate(plotL - 30, (plotT + plotB) / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText('Identity (%)', 0, 0);
      ctx.restore();

      genomes.forEach((g, i) => {
        const progress = Math.min(1, (t - i * 8) / 40);
        if (progress <= 0) return;
        const x = plotL + g.completeness * (plotR - plotL) * progress;
        const y = plotB - (g.identity - 0.9) / 0.1 * (plotB - plotT) * progress;
        ctx.globalAlpha = progress;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fillStyle = g.completeness > 0.8 ? colors.accent : colors.warm;
        ctx.fill();
        ctx.globalAlpha = 1;
      });

    } else {
      // Taxonomy
      const ranks = ['Exact TaxID', 'Genus', 'Family'];
      const values = [0.72, 0.85, 0.93];

      ranks.forEach((r, i) => {
        const progress = Math.min(1, (t - i * 18) / 60);
        if (progress <= 0) return;
        const y = 70 + i * 70;

        ctx.font = '11px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.textSec;
        ctx.textAlign = 'right';
        ctx.fillText(r, W * 0.25, y + 12);

        const barW = W * 0.5;
        ctx.fillStyle = colors.field || colors.border + '20';
        ctx.fillRect(W * 0.28, y, barW, 20);

        ctx.fillStyle = colors.accent;
        ctx.fillRect(W * 0.28, y, barW * values[i] * progress, 20);

        ctx.fillStyle = colors.text;
        ctx.textAlign = 'left';
        ctx.fillText((values[i] * 100 * progress).toFixed(1) + '%', W * 0.28 + barW + 8, y + 14);
      });

      ctx.font = '12px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      ctx.fillText('Auto-detects: Kraken2, Centrifuge, DIAMOND, MMseqs2, Kaiju, generic', W / 2, H - 20);
    }

    animFrame = requestAnimationFrame(draw);
  }
  draw();
}

/* Info cards */
function renderInfo(stepId, option) {}

/* Seeded PRNG */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}
