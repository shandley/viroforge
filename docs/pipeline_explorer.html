          ctx.fillText('Selected fragment (~15 kb) ready for SMRTbell ligation', sp.pad, strandY - 14);

          const selW = fragW * 0.65;
          const selL = fragL + (fragW - selW) / 2;
          ctx.strokeStyle = colors.accent;
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(selL, strandY);
          ctx.lineTo(selL + selW, strandY);
          ctx.stroke();
          ctx.strokeStyle = colors.warm;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(selL, strandY + 5);
          ctx.lineTo(selL + selW, strandY + 5);
          ctx.stroke();

          // Show open ends
          if (dProg > 0.3) {
            ctx.font = '8px "JetBrains Mono", monospace';
            ctx.fillStyle = colors.textTer;
            ctx.textAlign = 'center';
            ctx.fillText('open end', selL, strandY + 18);
            ctx.fillText('open end', selL + selW, strandY + 18);
            ctx.fillText('→ ligate hairpin adapters next →', fragL + fragW / 2, strandY + 34);
          }
        }

      } else if (pbBellPhase) {
        // === SMRTBELL CONSTRUCTION ===
        // Hairpin adapters slide onto the ends of the fragment
        const bellY = cY + areaH * 0.28;
        const bellL = sp.pad + 16, bellR = sp.pad + lW - 20;
        const hpR = 10;
        const strandLen = bellR - bellL - hpR * 2;

        ctx.font = '10px -apple-system, sans-serif';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        ctx.fillText('Ligate hairpin adapters to both ends:', sp.pad, bellY - 18);

        // Top strand
        ctx.strokeStyle = colors.accent;
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(bellL + hpR, bellY - 3);
        ctx.lineTo(bellR - hpR, bellY - 3);
        ctx.stroke();
        // Bottom strand
        ctx.strokeStyle = colors.warm;
        ctx.beginPath();
        ctx.moveTo(bellL + hpR, bellY + 3);
        ctx.lineTo(bellR - hpR, bellY + 3);
        ctx.stroke();

        // Hairpins slide in
        const hpSlide = Math.min(1, pbBellProg * 2);
        const hpOffL = (1 - hpSlide) * 30;
        const hpOffR = (1 - hpSlide) * 30;

        ctx.strokeStyle = colors.muted;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(bellL + hpR - hpOffL, bellY, hpR, Math.PI * 0.5, Math.PI * 1.5);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(bellR - hpR + hpOffR, bellY, hpR, -Math.PI * 0.5, Math.PI * 0.5);
        ctx.stroke();

        if (hpSlide > 0.5) {
          ctx.font = '8px "JetBrains Mono", monospace';
          ctx.fillStyle = colors.muted;
          ctx.textAlign = 'center';
          ctx.fillText('hairpin', bellL + hpR - hpOffL, bellY + hpR + 10);
          ctx.fillText('hairpin', bellR - hpR + hpOffR, bellY + hpR + 10);
        }

        // Explanation below
        if (pbBellProg > 0.5) {
          const expY = bellY + hpR + 26;
          ctx.font = '9px -apple-system, sans-serif';
          ctx.fillStyle = colors.textTer;
          ctx.textAlign = 'left';
          const bellNotes = [
            'Hairpin connects top strand to bottom strand',
            'at each end → one continuous circular molecule.',
            '',
            'The polymerase can now read around the circle',
            'indefinitely without falling off.',
          ];
          bellNotes.forEach((line, i) => {
            if (line === '') return;
            ctx.fillText(line, sp.pad, expY + i * 14);
          });
        }

        // Show circular topology hint
        if (pbBellProg > 0.8) {
          const circHintY = cY + areaH * 0.70;
          ctx.font = '9px "JetBrains Mono", monospace';
          ctx.fillStyle = colors.accent;
          ctx.textAlign = 'center';
          ctx.fillText('→ top strand → hairpin → bottom strand → hairpin → ...', sp.pad + lW / 2, circHintY);
          ctx.fillStyle = colors.textTer;
          ctx.font = '9px -apple-system, sans-serif';
          ctx.fillText('One continuous loop — ready for sequencing', sp.pad + lW / 2, circHintY + 14);
        }

      } else {
        // === CCS: POLYMERASE CIRCLING + CONSENSUS ===

        // --- SMRTbell construct (static, compact at top) ---
        const bellY = cY + areaH * 0.08;
        const bellL = sp.pad + 8, bellR = sp.pad + lW - 12;
        const hpR = 6;

        ctx.strokeStyle = colors.accent;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(bellL + hpR, bellY - 2);
        ctx.lineTo(bellR - hpR, bellY - 2);
        ctx.stroke();
        ctx.strokeStyle = colors.warm;
        ctx.beginPath();
        ctx.moveTo(bellL + hpR, bellY + 2);
        ctx.lineTo(bellR - hpR, bellY + 2);
        ctx.stroke();
        ctx.strokeStyle = colors.muted;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(bellL + hpR, bellY, hpR, Math.PI * 0.5, Math.PI * 1.5);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(bellR - hpR, bellY, hpR, -Math.PI * 0.5, Math.PI * 0.5);
        ctx.stroke();
        ctx.font = '7px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.textSec;
        ctx.textAlign = 'center';
        ctx.fillText('SMRTbell (~15 kb insert)', (bellL + bellR) / 2, bellY - 9);

        // --- Polymerase circling animation ---
        const circCX = sp.pad + lW * 0.28, circCY = cY + areaH * 0.32;
        const circR = Math.min(22, areaH * 0.08);

        // ZMW well outline
        ctx.strokeStyle = colors.muted + '30';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.arc(circCX, circCY, circR + 6, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.font = '7px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.muted;
        ctx.textAlign = 'center';
        ctx.fillText('ZMW well', circCX, circCY + circR + 16);

        // Template circle
        ctx.strokeStyle = colors.muted + '20';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(circCX, circCY, circR, 0, Math.PI * 2);
        ctx.stroke();

        const nPasses = 10;
        const totalAng = pbCcsProg * nPasses * Math.PI * 2;
        const curAng = totalAng - Math.PI / 2;
        const curPass = Math.min(10, Math.floor(pbCcsProg * nPasses));

        // Trail arc
        ctx.strokeStyle = colors.accent + '50';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(circCX, circCY, circR, curAng - Math.min(Math.PI * 2, totalAng), curAng);
        ctx.stroke();

        // Polymerase dot
        ctx.fillStyle = colors.accent;
        ctx.beginPath();
        ctx.arc(circCX + Math.cos(curAng) * circR, circCY + Math.sin(curAng) * circR, 3.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = '10px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.text;
        ctx.textAlign = 'center';
        ctx.fillText('Pass ' + curPass + '/10', circCX, circCY + 4);

        // --- Subread stack (right side of left panel) ---
        const subX = sp.pad + lW * 0.55, subEndX = sp.pad + lW - 8;
        const subStartY = cY + areaH * 0.21;
        const subSp = Math.min(7, (areaH * 0.28) / 12);
        const subLen = subEndX - subX;
        const passRng = mulberry32(42);
        const errPos = [];
        for (let p = 0; p < 10; p++) { const e = []; for (let i = 0; i < 5; i++) e.push(passRng()); errPos.push(e); }

        ctx.font = '9px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.textSec;
        ctx.textAlign = 'center';
        ctx.fillText('Subreads (one per pass)', (subX + subEndX) / 2, subStartY - 2);

        for (let p = 0; p < 10; p++) {
          const sy = subStartY + 6 + p * subSp;
          const vis = p < curPass;
          ctx.strokeStyle = vis ? colors.accent + '40' : colors.muted + '10';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(subX, sy); ctx.lineTo(subEndX, sy);
          ctx.stroke();
          if (vis) errPos[p].forEach(pos => {
            ctx.fillStyle = '#e05555';
            ctx.fillRect(subX + pos * subLen - 1, sy - 1.5, 2, 3);
          });
        }

        // Consensus read
        if (curPass >= 3) {
          const consY = subStartY + 6 + 10 * subSp + 6;
          ctx.strokeStyle = colors.textTer;
          ctx.lineWidth = 0.5;
          ctx.setLineDash([2, 2]);
          ctx.beginPath();
          ctx.moveTo((subX + subEndX) / 2, consY - 5);
          ctx.lineTo((subX + subEndX) / 2, consY - 1);
          ctx.stroke();
          ctx.setLineDash([]);

          ctx.strokeStyle = colors.accent;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(subX, consY); ctx.lineTo(subEndX, consY);
          ctx.stroke();
          const qv = curPass >= 10 ? '>Q40' : curPass >= 7 ? 'Q30+' : 'Q20+';
          ctx.font = '9px "JetBrains Mono", monospace';
          ctx.fillStyle = colors.accent;
          ctx.textAlign = 'center';
          ctx.fillText('→ HiFi consensus ' + qv, (subX + subEndX) / 2, consY + 10);
        }

        // --- Annotations ---
        const annY = cY + areaH * 0.55;
        ctx.font = '9px -apple-system, sans-serif';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        const pbAnns = [
          'Polymerase reads the same molecule ~10× around',
          'Each pass has ~15% random errors (red marks)',
          'Errors are random → consensus cancels them',
          'Result: single-molecule reads at >Q40 (>99.99%)',
          'Read length = insert size (10–25 kb typical)',
        ];
        pbAnns.forEach((line, i) => {
          ctx.fillStyle = colors.text;
          ctx.beginPath();
          ctx.arc(sp.pad + 7, annY + i * 12 - 3, 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = colors.textTer;
          ctx.font = '9px -apple-system, sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(line, sp.pad + 14, annY + i * 12);
        });
      }

    } else if (option === 'nanopore') {
      // Title
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'center';
      ctx.fillText('Oxford Nanopore — Ionic Current Sensing', sp.pad + lW / 2, cY + 12);

      // --- Membrane + pore ---
      const memY = cY + areaH * 0.22;
      const memTh = 18;
      const porW = 20;
      const porCX = sp.pad + lW * 0.38;

      // Membrane
      ctx.fillStyle = colors.muted + '12';
      ctx.fillRect(sp.pad + 4, memY - memTh / 2, porCX - porW / 2 - sp.pad - 4, memTh);
      ctx.fillRect(porCX + porW / 2, memY - memTh / 2, sp.pad + lW - 8 - porCX - porW / 2, memTh);

      ctx.font = '8px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.muted;
      ctx.textAlign = 'right';
      ctx.fillText('lipid bilayer', sp.pad + lW - 10, memY - memTh / 2 - 3);

      // Pore funnel
      ctx.fillStyle = colors.warm + '50';
      ctx.beginPath();
      ctx.moveTo(porCX - porW / 2 - 3, memY - memTh / 2);
      ctx.lineTo(porCX - 5, memY);
      ctx.lineTo(porCX - porW / 2 - 3, memY + memTh / 2);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(porCX + porW / 2 + 3, memY - memTh / 2);
      ctx.lineTo(porCX + 5, memY);
      ctx.lineTo(porCX + porW / 2 + 3, memY + memTh / 2);
      ctx.closePath();
      ctx.fill();

      // Motor protein
      ctx.fillStyle = colors.accent + '80';
      ctx.beginPath();
      ctx.arc(porCX, memY - memTh / 2 - 6, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = '7px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.accent;
      ctx.textAlign = 'left';
      ctx.fillText('motor protein', porCX + 8, memY - memTh / 2 - 4);

      // DNA strand threading through
      const threadP = Math.min(1, progress * 1.5);
      const dnaAbove = 30 * (1 - threadP * 0.4);
      if (dnaAbove > 3) {
        ctx.strokeStyle = colors.accent;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(porCX, memY - memTh / 2 - 11);
        ctx.lineTo(porCX - 1, memY - memTh / 2 - 11 - dnaAbove);
        ctx.stroke();
      }
      // Inside pore
      ctx.strokeStyle = colors.warm;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(porCX, memY - 5); ctx.lineTo(porCX, memY + 5);
      ctx.stroke();
      // Below pore
      if (threadP > 0.1) {
        ctx.strokeStyle = colors.warm + '70';
        ctx.beginPath();
        ctx.moveTo(porCX, memY + memTh / 2 + 2);
        ctx.lineTo(porCX + 1, memY + memTh / 2 + 2 + threadP * 22);
        ctx.stroke();
      }

      ctx.font = '9px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      ctx.fillText('nanopore', porCX, memY + memTh / 2 + 30);

      // Voltage arrow
      ctx.strokeStyle = colors.textTer + '50';
      ctx.lineWidth = 0.5;
      const vX = porCX + porW / 2 + 16;
      ctx.beginPath();
      ctx.moveTo(vX, memY - memTh / 2 - 8);
      ctx.lineTo(vX, memY + memTh / 2 + 8);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(vX - 3, memY + memTh / 2 + 4);
      ctx.lineTo(vX, memY + memTh / 2 + 8);
      ctx.lineTo(vX + 3, memY + memTh / 2 + 4);
      ctx.fill();
      ctx.font = '7px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      ctx.fillText('V', vX + 3, memY + 3);

      // --- Current signal (squiggle) ---
      const sqLabelY = cY + areaH * 0.48;
      ctx.font = '9px -apple-system, sans-serif';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'left';
      ctx.fillText('Raw ionic current signal → basecalling:', sp.pad + 4, sqLabelY);

      const sqL = sp.pad + 4, sqR = sp.pad + lW - 8;
      const sqMidY = sqLabelY + 22;
      const sqH = Math.min(16, areaH * 0.06);
      ctx.fillStyle = colors.muted + '06';
      ctx.fillRect(sqL, sqMidY - sqH, sqR - sqL, sqH * 2);

      function kmerHash(idx) {
        let h = idx * 2654435761;
        h = ((h >>> 16) ^ h) * 0x45d9f3b;
        h = ((h >>> 16) ^ h);
        return ((h >>> 0) / 4294967296) - 0.5;
      }

      const sqLen = sqR - sqL;
      const scrollOff = t * 0.6;
      ctx.beginPath();
      ctx.strokeStyle = colors.warm;
      ctx.lineWidth = 1;
      const flat0 = sqLen * 0.40, flat1 = sqLen * 0.55;
      for (let px = 0; px < sqLen; px++) {
        const wx = px + scrollOff;
        let lev;
        if (px >= flat0 && px <= flat1) lev = 0.3 + Math.sin(wx * 0.3) * 0.03;
        else { const ki = Math.floor(wx / 10); lev = kmerHash(ki) * 0.6 + Math.sin(wx * 0.7) * 0.08; }
        const y = sqMidY - lev * sqH;
        if (px === 0) ctx.moveTo(sqL + px, y); else ctx.lineTo(sqL + px, y);
      }
      ctx.stroke();

      // Highlight homopolymer region
      ctx.fillStyle = '#e0555515';
      ctx.fillRect(sqL + flat0, sqMidY - sqH, flat1 - flat0, sqH * 2);
      ctx.font = '8px "JetBrains Mono", monospace';
      ctx.fillStyle = '#e05555';
      ctx.textAlign = 'center';
      ctx.fillText('homopolymer (flat signal)', sqL + (flat0 + flat1) / 2, sqMidY + sqH + 8);

      // Basecalling example
      const bcY = sqMidY + sqH + 18;
      ctx.font = '9px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      ctx.fillText('truth: ATGCC AAAAA GGTC', sp.pad + 4, bcY);
      ctx.fillText('call:  ATGCC AAA', sp.pad + 4, bcY + 11);
      ctx.fillStyle = '#e05555';
      const callW = ctx.measureText('call:  ATGCC AAA').width;
      ctx.fillText('__', sp.pad + 4 + callW, bcY + 11);
      ctx.fillStyle = colors.textTer;
      const gapW = ctx.measureText('__').width;
      ctx.fillText(' GGTC', sp.pad + 4 + callW + gapW, bcY + 11);

      // Annotations
      const annY = bcY + 20;
      ctx.font = '9px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.fillText('• Each base modulates current differently → basecall', sp.pad + 4, annY);
      ctx.fillText('• Homopolymers produce flat signal → length ambiguity', sp.pad + 4, annY + 12);
      ctx.fillStyle = '#e05555';
      ctx.fillText('• Systematic deletion errors in poly-A/T/G/C runs', sp.pad + 4, annY + 24);
      ctx.fillStyle = colors.textTer;
      ctx.fillText('• No fixed read length — reads span entire molecules', sp.pad + 4, annY + 36);
      ctx.fillText('• Ultra-long reads possible (>100 kb)', sp.pad + 4, annY + 48);
    }
    ctx.restore();

    // ===== RIGHT: In ViroForge (HTML overlay) =====

    // --- Description overlay ---
    const descOverlay = document.getElementById('desc-overlay');
    const initKey = '_' + option + 'Init';

    if (option === 'novaseq' || option === 'miseq') {
      if (descOverlay && !descOverlay._novaInit && option === 'novaseq') {
        descOverlay._novaInit = true; descOverlay._miseqInit = false; descOverlay._pacbioInit = false; descOverlay._nanoporeInit = false;
        descOverlay.style.display = 'block';
        descOverlay.innerHTML = `
          <p style="margin:0 0 6px"><b>Simulator:</b> ViroForge calls <b>InSilicoSeq (ISS)</b> in <code>basic</code> mode with the NovaSeq error model. ISS is a third-party tool that generates realistic Illumina reads — ViroForge wraps it and feeds it the post-amplification abundance table.</p>
          <p style="margin:0 0 6px"><b>Step 1 — Calculate read counts:</b> for each genome, ViroForge computes the number of reads from the Lander-Waterman formula: <code>reads = (coverage × genome_length) / read_length</code>. Read counts are proportional to each genome's post-amplification relative abundance × its length.</p>
          <p style="margin:0 0 6px"><b>Step 2 — Sample read positions:</b> ISS picks random positions along each reference genome (uniform distribution). At each position it draws an insert size from N(350, 50²) and extracts R1 (150 bp forward from the left end) and R2 (150 bp reverse-complement from the right end).</p>
          <p style="margin:0 0 6px"><b>Step 3 — Inject errors + quality scores:</b> ISS applies position-dependent base substitution errors using a NovaSeq error model trained on real data. Quality scores are assigned using the NovaSeq 4-bin scheme (Q37/Q32/Q24/Q12) — the same binning the real instrument uses to compress FASTQ files.</p>
          <p style="margin:0 0 6px"><b>Step 4 — Write FASTQ:</b> each read is written with a header containing the source genome ID, position, and a ground-truth <code>source=viral</code> label. Output is paired-end: <code>R1.fastq.gz</code> + <code>R2.fastq.gz</code>.</p>
          <div class="desc-label">Default parameters</div>
          <code style="display:block;line-height:1.6">platform &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= novaseq<br>read_length &nbsp;&nbsp;= 150 bp<br>insert_size &nbsp;&nbsp;= N(350, 50²)<br>error_model &nbsp;&nbsp;= novaseq (4-bin Q)<br>output &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= R1.fastq.gz + R2.fastq.gz</code>
        `;
      } else if (descOverlay && !descOverlay._miseqInit && option === 'miseq') {
        descOverlay._miseqInit = true; descOverlay._novaInit = false; descOverlay._pacbioInit = false; descOverlay._nanoporeInit = false;
        descOverlay.style.display = 'block';
        descOverlay.innerHTML = `
          <p style="margin:0 0 6px"><b>Simulator:</b> ViroForge calls <b>InSilicoSeq (ISS)</b> in <code>basic</code> mode with the MiSeq error model. Same wrapper as NovaSeq, different error profile and read parameters.</p>
          <p style="margin:0 0 6px"><b>Step 1 — Calculate read counts:</b> identical to NovaSeq — Lander-Waterman formula distributes reads across genomes proportional to abundance × length.</p>
          <p style="margin:0 0 6px"><b>Step 2 — Sample read positions:</b> ISS picks random positions and draws insert sizes from N(450, 50²). At each position it extracts R1 and R2, each 250 bp — longer reads than NovaSeq (150 bp).</p>
          <p style="margin:0 0 6px"><b>Step 3 — Inject errors + quality scores:</b> ISS applies the MiSeq error model, which uses the full Phred quality spectrum (continuous Q scores, not 4-bin like NovaSeq). Quality decays more smoothly across the read.</p>
          <p style="margin:0 0 6px"><b>Key difference from NovaSeq:</b> MiSeq generates fewer but longer reads (2×250 vs 2×150). The larger default insert (450 vs 350 bp) relative to read length means fewer short inserts, so fewer adapter read-through events in the next step.</p>
          <div class="desc-label">Default parameters</div>
          <code style="display:block;line-height:1.6">platform &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= miseq<br>read_length &nbsp;&nbsp;= 250 bp<br>insert_size &nbsp;&nbsp;= N(450, 50²)<br>error_model &nbsp;&nbsp;= miseq (full Q spectrum)<br>output &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= R1.fastq.gz + R2.fastq.gz</code>
        `;
      }
    } else if (option === 'pacbio') {
      if (descOverlay && !descOverlay._pacbioInit) {
        descOverlay._pacbioInit = true; descOverlay._novaInit = false; descOverlay._miseqInit = false; descOverlay._nanoporeInit = false;
        descOverlay.style.display = 'block';
        descOverlay.innerHTML = `
          <p style="margin:0 0 6px"><b>Simulator:</b> ViroForge uses a three-tool pipeline: <b>PBSIM3 → samtools → pbccs</b>. Unlike Illumina (one tool), PacBio simulation requires multiple steps because the real instrument produces raw subreads that are post-processed into HiFi reads.</p>
          <p style="margin:0 0 6px"><b>Step 1 — PBSIM3 generates noisy subreads:</b> for each genome, PBSIM3 picks random positions and extracts ~15 kb fragments. It then simulates the polymerase reading each fragment multiple times (10 passes), injecting ~15% random errors per pass — mimicking the noisy raw signal of a real PacBio run. Output: one SAM file of CLR (continuous long reads).</p>
          <p style="margin:0 0 6px"><b>Step 2 — samtools converts format:</b> <code>samtools view</code> converts the SAM output to BAM format, which is the input format that PacBio's consensus tool expects.</p>
          <p style="margin:0 0 6px"><b>Step 3 — pbccs calls consensus:</b> PacBio's own <code>pbccs</code> tool takes the noisy subreads, aligns them, and votes at each position — exactly the same algorithm used on real data. Random errors cancel out across passes, producing one clean HiFi read per molecule at >Q40 (>99.99% accuracy).</p>
          <p style="margin:0 0 6px"><b>Why this approach:</b> by using PacBio's real consensus tool, the final HiFi reads have realistic remaining error patterns and quality scores — not a simplified approximation. The trade-off is that this pipeline is slower than Illumina simulation and requires PBSIM3 + samtools + pbccs installed.</p>
          <div class="desc-label">Default parameters</div>
          <code style="display:block;line-height:1.6">mean_length &nbsp;&nbsp;= 15,000 bp<br>n_passes &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= 10<br>clr_error &nbsp;&nbsp;&nbsp;&nbsp;= ~15% (random)<br>hifi_accuracy = >99.9% (>Q40)<br>output &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= reads.fastq.gz<br>pipeline &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= PBSIM3 → samtools → pbccs</code>
        `;
      }
    } else if (option === 'nanopore') {
      if (descOverlay && !descOverlay._nanoporeInit) {
        descOverlay._nanoporeInit = true; descOverlay._novaInit = false; descOverlay._miseqInit = false; descOverlay._pacbioInit = false;
        descOverlay.style.display = 'block';
        descOverlay.innerHTML = `
          <p style="margin:0 0 6px"><b>Simulator:</b> ViroForge calls <b>PBSIM3 in ONT mode</b> — the same tool as PacBio, but configured with Oxford Nanopore's R10.4 chemistry error model. No consensus step needed (single-pass reads).</p>
          <p style="margin:0 0 6px"><b>Step 1 — Sample read positions:</b> for each genome, PBSIM3 picks random start positions and draws read lengths from a log-normal distribution (mean ~20 kb). Unlike Illumina, there is no fixed read length — each read can be a different size, just like real nanopore output.</p>
          <p style="margin:0 0 6px"><b>Step 2 — Inject errors:</b> PBSIM3 applies the R10.4 trained error model, which includes substitutions, insertions, and deletions. Critically, it applies a <b>6× elevated deletion rate in homopolymer regions</b> (runs of the same base) — this is nanopore's signature error pattern, caused by the flat ionic current signal when identical bases pass through the pore.</p>
          <p style="margin:0 0 6px"><b>Step 3 — Write FASTQ:</b> each read is written as a single long sequence (no paired ends). Headers include the source genome ID and ground-truth labels. Output is a single <code>reads.fastq.gz</code> file.</p>
          <p style="margin:0 0 6px"><b>Key difference from PacBio:</b> nanopore reads are single-pass (no consensus), so the error rate is higher (~5% vs <0.1% HiFi). But reads can be much longer — 20 kb typical, >100 kb possible — because there is no circular template limiting the length.</p>
          <div class="desc-label">Default parameters</div>
          <code style="display:block;line-height:1.6">chemistry &nbsp;&nbsp;&nbsp;&nbsp;= R10.4<br>mean_length &nbsp;&nbsp;= 20,000 bp<br>error_rate &nbsp;&nbsp;&nbsp;= ~5%<br>hp_del_bias &nbsp;&nbsp;= 6× (homopolymer)<br>length_dist &nbsp;&nbsp;= log-normal<br>output &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= reads.fastq.gz</code>
        `;
      }
    }

    if (descOverlay) {
      const _cvs = ctx.canvas;
      const canvasRect = _cvs.getBoundingClientRect();
      const scaleX = canvasRect.width / W;
      const scaleY = canvasRect.height / H;
      const descTop = (cY + 20) * scaleY;
      const descLeft = (rX + sp.pad) * scaleX;
      const descWidth = (rW - sp.pad * 2) * scaleX;
      const descBottom = canvasRect.height - 4;
      descOverlay.style.top = descTop + 'px';
      descOverlay.style.left = descLeft + 'px';
      descOverlay.style.width = descWidth + 'px';
      descOverlay.style.height = (descBottom - descTop) + 'px';
    }

    animFrame = requestAnimationFrame(draw);
  }
  draw();
}

/* === ARTIFACTS ANIMATION === */
function animateArtifacts(option, ctx, W, H, colors) {
  let t = 0;
  showLegend([]);

  function draw() {
    t++;
    ctx.clearRect(0, 0, W, H);
    const sp = drawSplitPanel(ctx, W, H, colors);
    const lW = sp.midX - sp.pad * 2, rX = sp.midX + sp.pad, rW = W - sp.midX - sp.pad * 2;
    const cY = sp.contentY;
    const areaH = H - cY - 10;
    const progress = Math.min(1, t / 200);

    if (option === 'adapters') {
      // ===== LEFT: Lab — how adapter read-through happens =====
      ctx.save();
      ctx.beginPath();
      ctx.rect(sp.pad, cY, lW, areaH);
      ctx.clip();

      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'center';
      ctx.fillText('Adapter Read-Through', sp.pad + lW / 2, cY + 12);

      const normL = sp.pad + 4, normR = sp.pad + lW - 8;
      const normW = normR - normL;
      const adpW = normW * 0.08;

      // --- Case 1: Normal insert ---
      const fY = cY + 28;
      ctx.font = '10px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      ctx.fillText('Normal insert (350 bp) — reads stay within DNA:', normL, fY);

      const normY = fY + 8;
      // P5 adapter
      ctx.fillStyle = colors.warm + '60';
      ctx.fillRect(normL, normY, adpW, 12);
      // Insert DNA
      ctx.fillStyle = colors.muted + '18';
      ctx.fillRect(normL + adpW, normY, normW - adpW * 2, 12);
      // P7 adapter
      ctx.fillStyle = colors.warm + '60';
      ctx.fillRect(normR - adpW, normY, adpW, 12);

      // P5 / P7 labels
      ctx.font = '7px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.warm;
      ctx.textAlign = 'center';
      ctx.fillText('P5', normL + adpW / 2, normY + 9);
      ctx.fillText('P7', normR - adpW / 2, normY + 9);

      // R1 and R2 reads growing
      const rFrac = 150 / 350;
      const r1W = (normW - adpW * 2) * rFrac;
      const rProg = Math.min(1, progress * 2);
      ctx.fillStyle = colors.accent;
      ctx.fillRect(normL + adpW, normY + 16, r1W * rProg, 6);
      ctx.fillStyle = colors.accent + 'A0';
      ctx.fillRect(normR - adpW - r1W * rProg, normY + 16, r1W * rProg, 6);
      if (rProg > 0.3) {
        ctx.font = '8px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.accent;
        ctx.textAlign = 'left';
        ctx.fillText('R1 (150 bp) →', normL + adpW, normY + 14);
        ctx.textAlign = 'right';
        ctx.fillText('← R2 (150 bp)', normR - adpW, normY + 14);
      }
      if (rProg > 0.8) {
        ctx.font = '9px -apple-system, sans-serif';
        ctx.fillStyle = '#4a9';
        ctx.textAlign = 'right';
        ctx.fillText('reads end within DNA insert', normR, normY + 28);
      }

      // --- Case 2: Short insert — read-through ---
      const sY = normY + 42;
      ctx.font = '10px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      ctx.fillText('Short insert (100 bp) — R1 reads into P7 adapter:', normL, sY);

      const sInsertW = normW * (100 / 350);
      const sL = normL + normW * 0.18;
      // P5 adapter
      ctx.fillStyle = colors.warm + '50';
      ctx.fillRect(sL - adpW, sY + 8, adpW, 12);
      // Short insert DNA
      ctx.fillStyle = colors.muted + '15';
      ctx.fillRect(sL, sY + 8, sInsertW, 12);
      // P7 adapter
      ctx.fillStyle = colors.warm + '50';
      ctx.fillRect(sL + sInsertW, sY + 8, adpW, 12);

      ctx.font = '7px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.warm;
      ctx.textAlign = 'center';
      ctx.fillText('P5', sL - adpW / 2, sY + 17);
      ctx.fillText('P7', sL + sInsertW + adpW / 2, sY + 17);

      // R1 extending into adapter
      const sProg = Math.min(1, Math.max(0, progress * 2 - 0.3));
      if (sProg > 0) {
        const readPx = r1W * sProg;
        const dnaPart = Math.min(readPx, sInsertW);
        const adpPart = Math.max(0, readPx - sInsertW);
        ctx.fillStyle = colors.accent;
        ctx.fillRect(sL, sY + 24, dnaPart, 6);
        if (adpPart > 0) {
          ctx.fillStyle = colors.warm;
          ctx.fillRect(sL + sInsertW, sY + 24, Math.min(adpPart, adpW), 6);
        }
        ctx.font = '8px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.accent;
        ctx.textAlign = 'left';
        ctx.fillText('R1 →', sL, sY + 22);
        if (adpPart > 3) {
          ctx.fillStyle = colors.warm;
          ctx.fillText('adapter bases in read!', sL + sInsertW + Math.min(adpPart, adpW) + 4, sY + 30);
        }
      }

      // --- Explanation ---
      const expY = sY + 46;
      ctx.font = '9px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      const adpNotes = [
        'Insert sizes follow N(350, 50²). The left tail',
        '(inserts shorter than read length) causes the',
        'sequencer to read past the DNA into the adapter.',
        '',
        'The shorter the insert, the more adapter bases',
        'appear in the read. A 100 bp insert with 150 bp',
        'reads → 50 bp of adapter sequence in R1.',
        '',
        'QC tools (fastp, Trimmomatic, cutadapt) detect',
        'adapter sequences by k-mer matching and trim them.',
        'Untrimmed adapter reads cause misassembly and',
        'inflate apparent contamination in taxonomy.',
      ];
      adpNotes.forEach((line, i) => {
        if (line === '') return;
        ctx.fillText(line, normL, expY + i * 12);
      });

      ctx.restore();

    } else if (option === 'duplicates') {
      // ===== LEFT: Lab — PCR creates duplicates =====
      ctx.save();
      ctx.beginPath();
      ctx.rect(sp.pad, cY, lW, areaH);
      ctx.clip();

      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'center';
      ctx.fillText('PCR Duplicate Formation', sp.pad + lW / 2, cY + 12);

      // --- Bridge amplification context ---
      const bY = cY + 26;
      ctx.font = '9px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      ctx.fillText('On the flow cell, each fragment is bridge-amplified', sp.pad, bY);
      ctx.fillText('into a cluster of ~1,000 identical copies:', sp.pad, bY + 12);

      // Original template
      const tY = bY + 30;
      ctx.fillStyle = colors.accent;
      ctx.fillRect(sp.pad, tY, lW - 12, 6);
      ctx.font = '8px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.accent;
      ctx.textAlign = 'left';
      ctx.fillText('Original template fragment', sp.pad, tY - 3);

      // Copies appearing with errors
      const copyProg = Math.min(1, progress * 2.5);
      const nCyc = Math.min(4, Math.floor(copyProg * 4.5));
      const copyY = tY + 12;
      let total = 0;

      for (let c = 0; c < nCyc; c++) {
        const nNew = Math.min(Math.pow(2, c), 4);
        for (let j = 0; j < nNew; j++) {
          total++;
          const cy = copyY + (total - 1) * 9;
          if (cy > tY + 60) continue;
          const alpha = Math.max(25, 70 - c * 12);
          ctx.fillStyle = colors.warm + alpha.toString(16).padStart(2, '0');
          ctx.fillRect(sp.pad + c * 3, cy, lW - 12 - c * 3, 4);

          const errRng = mulberry32(c * 100 + j + 55);
          for (let e = 0; e < c; e++) {
            const ex = sp.pad + c * 3 + errRng() * (lW - 20 - c * 3);
            ctx.fillStyle = '#e05555';
            ctx.fillRect(ex, cy, 2, 4);
          }
        }
      }

      let errLabelBottom = copyY + 4;
      if (nCyc > 0) {
        const errLabelY = copyY + Math.min(total, 7) * 9 + 4;
        errLabelBottom = errLabelY + 6;
        ctx.font = '8px "JetBrains Mono", monospace';
        ctx.fillStyle = '#e05555';
        ctx.textAlign = 'left';
        ctx.fillText('Red = PCR errors accumulating over cycles', sp.pad, errLabelY);
      }

      // --- Why duplicates are problematic ---
      const probY = Math.max(tY + 84, errLabelBottom + 10);
      ctx.font = '9px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      const dupNotes = [
        'Duplicates are identical copies of the same',
        'original fragment. They inflate coverage at',
        'that position without adding new information.',
        '',
        'Not all templates duplicate equally:',
      ];
      dupNotes.forEach((line, i) => {
        if (line === '') return;
        ctx.fillText(line, sp.pad, probY + i * 12);
      });

      // Bias bullets
      const biasY = probY + 60;
      const biasList = [
        '~50% GC templates amplify most efficiently',
        'Shorter fragments complete more PCR cycles',
        'Bridge amplification favors certain binding',
        'This creates systematic coverage bias',
      ];
      biasList.forEach((line, i) => {
        ctx.fillStyle = colors.text;
        ctx.beginPath();
        ctx.arc(sp.pad + 4, biasY + i * 13 - 3, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = colors.textTer;
        ctx.font = '9px -apple-system, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(line, sp.pad + 12, biasY + i * 13);
      });

      // Detection
      const detY = biasY + 60;
      ctx.font = '9px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.fillText('Tools like Picard MarkDuplicates and samtools', sp.pad, detY);
      ctx.fillText('markdup detect duplicates by matching read', sp.pad, detY + 12);
      ctx.fillText('start positions and orientations.', sp.pad, detY + 24);

      ctx.restore();

    } else {
      // ===== LEFT: Lab — animated low-complexity artifact sources =====
      ctx.save();
      ctx.beginPath();
      ctx.rect(sp.pad, cY, lW, areaH);
      ctx.clip();

      const baseColors = { A: '#4CAF50', T: '#F44336', G: '#FFC107', C: '#2196F3' };
      const _cvs = ctx.canvas;

      // Tab selection — stored on canvas, persists across frames
      if (_cvs._lcTab === undefined) _cvs._lcTab = 0;
      if (_cvs._lcTabT === undefined) _cvs._lcTabT = 0;
      _cvs._lcTabT++;
      const lcPhase = _cvs._lcTab;
      const lcPhaseProg = Math.min(1, _cvs._lcTabT / 300);

      // Draw clickable tabs
      const tabLabels = ['Poly-G', 'Homopolymer', 'Cluster fail', 'Low entropy'];
      const tabPcts = ['40%', '25%', '15%', '20%'];
      ctx.font = '9px -apple-system, sans-serif';
      const tabGap = 4;
      const tabWidths = tabLabels.map(l => ctx.measureText(l).width + 14);
      const totalTabW = tabWidths.reduce((s, w) => s + w + tabGap, -tabGap);
      let tabX = sp.pad + (lW - totalTabW) / 2;
      const tabY = cY + 4;
      const tabH = 18;

      // Store tab hit regions for click handling
      _cvs._lcTabHits = [];
      for (let d = 0; d < 4; d++) {
        const tw = tabWidths[d];
        const isActive = d === lcPhase;

        // Tab background
        ctx.fillStyle = isActive ? colors.accent + '20' : 'transparent';
        ctx.strokeStyle = isActive ? colors.accent : colors.muted + '50';
        ctx.lineWidth = isActive ? 1.5 : 0.5;
        ctx.beginPath();
        const r = 4;
        ctx.moveTo(tabX + r, tabY);
        ctx.lineTo(tabX + tw - r, tabY);
        ctx.quadraticCurveTo(tabX + tw, tabY, tabX + tw, tabY + r);
        ctx.lineTo(tabX + tw, tabY + tabH - r);
        ctx.quadraticCurveTo(tabX + tw, tabY + tabH, tabX + tw - r, tabY + tabH);
        ctx.lineTo(tabX + r, tabY + tabH);
        ctx.quadraticCurveTo(tabX, tabY + tabH, tabX, tabY + tabH - r);
        ctx.lineTo(tabX, tabY + r);
        ctx.quadraticCurveTo(tabX, tabY, tabX + r, tabY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Tab label
        ctx.font = isActive ? 'bold 8px -apple-system, sans-serif' : '8px -apple-system, sans-serif';
        ctx.fillStyle = isActive ? colors.accent : colors.textTer;
        ctx.textAlign = 'center';
        ctx.fillText(tabLabels[d], tabX + tw / 2, tabY + 12);

        _cvs._lcTabHits.push({ x: tabX, y: tabY, w: tw, h: tabH, idx: d });
        tabX += tw + tabGap;
      }

      // Percentage label for active tab
      ctx.font = '8px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.muted;
      ctx.textAlign = 'center';
      ctx.fillText(tabPcts[lcPhase] + ' of artifacts', sp.pad + lW / 2, tabY + tabH + 10);

      // Click + hover handlers — attach once
      if (!_cvs._lcClickHandler) {
        const lcHitTest = function(e) {
          const hits = _cvs._lcTabHits;
          if (!hits) return -1;
          const rect = _cvs.getBoundingClientRect();
          const zoom = 1.35;
          const mx = (e.clientX - rect.left) / zoom;
          const my = (e.clientY - rect.top) / zoom;
          for (const h of hits) {
            if (mx >= h.x && mx <= h.x + h.w && my >= h.y && my <= h.y + h.h) return h.idx;
          }
          return -1;
        };
        _cvs._lcClickHandler = function(e) {
          const idx = lcHitTest(e);
          if (idx >= 0) {
            _cvs._lcTab = idx;
            _cvs._lcTabT = 0;
          }
        };
        _cvs._lcMoveHandler = function(e) {
          _cvs.style.cursor = lcHitTest(e) >= 0 ? 'pointer' : 'default';
        };
        _cvs.addEventListener('click', _cvs._lcClickHandler);
        _cvs.addEventListener('mousemove', _cvs._lcMoveHandler);
      }

      const lcAreaTop = cY + 40;
      const lcAreaH = areaH - 40;

      if (lcPhase === 0) {
        // === POLY-G: Two-color chemistry failure ===
        ctx.font = '9px -apple-system, sans-serif';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        ctx.fillText('NovaSeq/NextSeq use 2-color chemistry:', sp.pad, lcAreaTop + 8);
        ctx.fillText('Red channel = T or C, Green channel = A or C', sp.pad, lcAreaTop + 20);

        // Draw two "channels" as signal bars
        const chY = lcAreaTop + 34;
        const chW = lW - 16;
        // Red channel
        ctx.fillStyle = '#e05555';
        ctx.font = '8px "JetBrains Mono", monospace';
        ctx.fillText('Red ch:', sp.pad, chY + 8);
        // Green channel
        ctx.fillStyle = '#4CAF50';
        ctx.fillText('Green ch:', sp.pad, chY + 22);

        const sigL = sp.pad + 50, sigR = sp.pad + chW;
        const sigW = sigR - sigL;
        const nBars = 20;
        const barW = sigW / nBars - 1;

        // Signal degrades over time
        const sigRng = mulberry32(77);
        for (let b = 0; b < nBars; b++) {
          const bx = sigL + b * (barW + 1);
          const fadePoint = lcPhaseProg * nBars * 1.3;
          const alive = b < fadePoint ? Math.max(0, 1 - (fadePoint - b) * 0.15) : 1;

          // Red channel signal
          const rH = (sigRng() * 6 + 3) * alive;
          ctx.fillStyle = `rgba(224, 85, 85, ${0.3 + alive * 0.5})`;
          ctx.fillRect(bx, chY + 10 - rH, barW, rH);

          // Green channel signal
          const gH = (sigRng() * 6 + 3) * alive;
          ctx.fillStyle = `rgba(76, 175, 80, ${0.3 + alive * 0.5})`;
          ctx.fillRect(bx, chY + 24 - gH, barW, gH);
        }

        // Explanation of what happens
        const expY = chY + 38;
        ctx.font = '9px -apple-system, sans-serif';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        if (lcPhaseProg < 0.3) {
          ctx.fillText('Normal: both channels have signal.', sp.pad, expY);
          ctx.fillText('Base calls from color combinations:', sp.pad, expY + 13);
          ctx.font = '9px "JetBrains Mono", monospace';
          ctx.fillStyle = '#e05555'; ctx.fillText('Red', sp.pad + 4, expY + 28);
          ctx.fillStyle = colors.textTer; ctx.fillText(' + ', sp.pad + 24, expY + 28);
          ctx.fillStyle = '#4CAF50'; ctx.fillText('Green', sp.pad + 36, expY + 28);
          ctx.fillStyle = colors.textTer; ctx.fillText(' = C', sp.pad + 66, expY + 28);

          ctx.fillStyle = '#e05555'; ctx.fillText('Red', sp.pad + 4, expY + 40);
          ctx.fillStyle = colors.textTer; ctx.fillText(' only       = T', sp.pad + 24, expY + 40);
          ctx.fillStyle = '#4CAF50'; ctx.fillText('Green', sp.pad + 4, expY + 52);
          ctx.fillStyle = colors.textTer; ctx.fillText(' only     = A', sp.pad + 36, expY + 52);
          ctx.fillStyle = colors.textTer; ctx.fillText('Neither       = G', sp.pad + 4, expY + 64);
        } else {
          ctx.fillText('Signal drops out! Both channels go dark.', sp.pad, expY);
          ctx.fillText('No red + no green = base caller says "G"', sp.pad, expY + 14);
          ctx.fillText('for every remaining position.', sp.pad, expY + 26);
        }

        // Show resulting sequence
        const seqY = expY + (lcPhaseProg < 0.3 ? 82 : 46);
        ctx.font = '8px -apple-system, sans-serif';
        ctx.fillStyle = colors.textSec;
        ctx.fillText('Result:', sp.pad, seqY);
        const seqStr = 'ATGCAGTCGA' + 'GGGGGGGGGGGGGGGGG';
        const visLen = Math.floor(lcPhaseProg * seqStr.length);
        ctx.font = '10px "JetBrains Mono", monospace';
        let scx = sp.pad;
        for (let si = 0; si < visLen && si < seqStr.length; si++) {
          const ch = seqStr[si];
          ctx.fillStyle = si < 10 ? (baseColors[ch] || colors.text) : '#FFC107';
          ctx.fillText(ch, scx, seqY + 14);
          scx += 8;
        }
        if (visLen > 12) {
          ctx.font = '8px "JetBrains Mono", monospace';
          ctx.fillStyle = '#FFC107';
          ctx.fillText('← poly-G tail (artifact)', scx + 4, seqY + 14);
        }

        // Entropy readout
        if (lcPhaseProg > 0.6) {
          const entY = seqY + 30;
          ctx.font = '9px -apple-system, sans-serif';
          ctx.fillStyle = colors.textTer;
          ctx.fillText('H ≈ 0.0 — almost no information', sp.pad, entY);
          ctx.fillText('These reads are ~40% of all low-complexity', sp.pad, entY + 13);
          ctx.fillText('artifacts on NovaSeq/NextSeq platforms.', sp.pad, entY + 26);
        }

      } else if (lcPhase === 1) {
        // === HOMOPOLYMER: Polymerase slippage on repeats ===
        ctx.font = '9px -apple-system, sans-serif';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        ctx.fillText('Polymerase reads through a tandem repeat:', sp.pad, lcAreaTop + 8);

        // Show a template strand with a repeat region
        const tplY = lcAreaTop + 24;
        const tplSeq = 'ATGC' + 'AAAAAAAAA' + 'TGCA';
        ctx.font = '8px -apple-system, sans-serif';
        ctx.fillStyle = colors.textSec;
        ctx.fillText('Template:', sp.pad, tplY);
        ctx.font = '10px "JetBrains Mono", monospace';
        let tx = sp.pad;
        for (let i = 0; i < tplSeq.length; i++) {
          const ch = tplSeq[i];
          const inRepeat = i >= 4 && i < 13;
          ctx.fillStyle = inRepeat ? '#4CAF50' : (baseColors[ch] || colors.text);
          if (inRepeat) {
            ctx.fillRect(tx - 1, tplY + 4, 9, 14);
            ctx.fillStyle = '#fff';
          }
          ctx.fillText(ch, tx, tplY + 14);
          tx += 9;
        }
        ctx.font = '8px "JetBrains Mono", monospace';
        ctx.fillStyle = '#4CAF50';
        ctx.fillText('← poly-A region', tx + 4, tplY + 14);

        // Polymerase copying — show it stuttering
        const copyY = tplY + 28;
        ctx.font = '8px -apple-system, sans-serif';
        ctx.fillStyle = colors.textSec;
        ctx.fillText('Polymerase copies:', sp.pad, copyY);

        // Normal region then slippage
        const normalPart = 'TACG';
        const slippedPart = 'TTTTTTTTTTTTT'; // more T's than template has A's
        const copySeq = normalPart + slippedPart + 'ACGT';
        const copyVis = Math.floor(lcPhaseProg * copySeq.length * 1.2);
        ctx.font = '10px "JetBrains Mono", monospace';
        let cx = sp.pad;
        for (let i = 0; i < Math.min(copyVis, copySeq.length); i++) {
          const ch = copySeq[i];
          const inSlip = i >= 4 && i < 17;
          ctx.fillStyle = inSlip ? '#F44336' : (baseColors[ch] || colors.text);
          ctx.fillText(ch, cx, copyY + 14);
          cx += 9;
        }

        // Show the polymerase icon at current position
        if (copyVis > 0 && copyVis <= copySeq.length) {
          const polyX = sp.pad + Math.min(copyVis, copySeq.length) * 9;
          ctx.font = '10px -apple-system, sans-serif';
          ctx.fillStyle = colors.accent;
          ctx.fillText('▶', polyX, copyY + 14);
        }

        // Explanation
        const slipExpY = copyY + 30;
        ctx.font = '9px -apple-system, sans-serif';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        if (lcPhaseProg < 0.4) {
          ctx.fillText('Polymerase copies normally through unique', sp.pad, slipExpY);
          ctx.fillText('sequence...', sp.pad, slipExpY + 13);
        } else if (lcPhaseProg < 0.7) {
          ctx.fillText('In the repeat region, the template strand', sp.pad, slipExpY);
          ctx.fillText('can "slip" — loop out or skip back — because', sp.pad, slipExpY + 13);
          ctx.fillText('every position looks the same to the polymerase.', sp.pad, slipExpY + 26);
        } else {
          ctx.fillText('Result: the copy has more (or fewer) repeats', sp.pad, slipExpY);
          ctx.fillText('than the template. 9 A’s in template → 13 T’s', sp.pad, slipExpY + 13);
          ctx.fillText('in the read. The read is mostly one base.', sp.pad, slipExpY + 26);
          ctx.fillText('', sp.pad, slipExpY + 39);
          ctx.fillText('Longer homopolymer runs slip more often.', sp.pad, slipExpY + 42);
          ctx.fillText('Nanopore is especially prone to this — its', sp.pad, slipExpY + 55);
          ctx.fillText('signal can’t distinguish 5 A’s from 6 A’s.', sp.pad, slipExpY + 68);
        }

      } else if (lcPhase === 2) {
        // === CLUSTER FAILURE: garbled signal ===
        ctx.font = '9px -apple-system, sans-serif';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        ctx.fillText('A cluster on the flow cell degrades mid-run:', sp.pad, lcAreaTop + 8);

        // Draw a cluster as a circle of dots
        const clCx = sp.pad + lW / 2;
        const clCy = lcAreaTop + 60;
        const clR = 26;
        const nDots = 16;
        const clRng = mulberry32(33);
        const degradeProg = Math.min(1, lcPhaseProg * 1.8);

        for (let d = 0; d < nDots; d++) {
          const angle = (d / nDots) * Math.PI * 2;
          const r = clR * (0.3 + clRng() * 0.7);
          const dx = clCx + Math.cos(angle) * r;
          const dy = clCy + Math.sin(angle) * r;

          // Dots drift apart as cluster degrades
          const drift = degradeProg * (clRng() * 12 - 2);
          const ddx = dx + Math.cos(angle) * drift;
          const ddy = dy + Math.sin(angle) * drift;

          const alpha = Math.max(0.1, 1 - degradeProg * (0.3 + clRng() * 0.7));
          ctx.beginPath();
          ctx.arc(ddx, ddy, 2.5, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(100, 180, 255, ${alpha})`;
          ctx.fill();
        }

        // Labels
        ctx.font = '8px -apple-system, sans-serif';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'center';
        if (degradeProg < 0.4) {
          ctx.fillText('Healthy cluster (~1,000 copies)', clCx, clCy + clR + 16);
        } else {
          ctx.fillStyle = colors.warm;
          ctx.fillText('Degrading — copies detaching', clCx, clCy + clR + 16);
        }

        // Signal readout below
        const sigY = clCy + clR + 32;
        ctx.font = '8px -apple-system, sans-serif';
        ctx.fillStyle = colors.textSec;
        ctx.textAlign = 'left';
        ctx.fillText('Base caller output:', sp.pad, sigY);

        const sigRng2 = mulberry32(99 + Math.floor(lcPhaseProg * 3));
        ctx.font = '10px "JetBrains Mono", monospace';
        let sx = sp.pad;
        const nSigBases = 22;
        for (let b = 0; b < nSigBases; b++) {
          const goodSignal = b < Math.floor((1 - degradeProg) * nSigBases * 0.8);
          let ch;
          if (goodSignal) {
            ch = 'ACGT'[Math.floor(sigRng2() * 4)];
            ctx.fillStyle = baseColors[ch];
          } else {
            // Degraded signal — 60% G (two-color), some random
            ch = sigRng2() < 0.6 ? 'G' : 'ACGT'[Math.floor(sigRng2() * 4)];
            ctx.fillStyle = ch === 'G' ? '#FFC10780' : (baseColors[ch] + '50');
          }
          ctx.fillText(ch, sx, sigY + 14);
          sx += 8;
        }

        // Explanation
        const cfExpY = sigY + 28;
        ctx.font = '9px -apple-system, sans-serif';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        const cfLines = [
          'Physical causes: DNA strands detach from the',
          'glass surface, bubble passes over the cluster,',
          'dust particle blocks the laser, or a neighboring',
          'cluster’s signal bleeds over.',
          '',
          'The base caller still tries to call bases from',
          'whatever signal it detects. With weak signal on',
          'two-color platforms, it defaults to G (no signal',
          '= no color = G encoding).',
        ];
        cfLines.forEach((line, i) => {
          if (line === '') return;
          ctx.fillText(line, sp.pad, cfExpY + i * 12);
        });

      } else {
        // === LOW ENTROPY: Biased base composition ===
        ctx.font = '9px -apple-system, sans-serif';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        ctx.fillText('Some artifacts aren’t pure repeats but have', sp.pad, lcAreaTop + 8);
        ctx.fillText('heavily skewed base composition:', sp.pad, lcAreaTop + 20);

        // Show a frequency bar chart animating from uniform to skewed
        const barY = lcAreaTop + 50;
        const barH = 40;
        const barTotalW = lW - 60;
        const bases = ['A', 'T', 'G', 'C'];
        // Animate from uniform (0.25 each) to G-dominant (0.75 G)
        const skew = Math.min(1, lcPhaseProg * 1.5);
        const freqs = [
          0.25 - skew * 0.18,  // A drops
          0.25 - skew * 0.18,  // T drops
          0.25 + skew * 0.50,  // G rises
          0.25 - skew * 0.14,  // C drops
        ];

        bases.forEach((base, i) => {
          const bx = sp.pad + 30 + i * (barTotalW / 4 + 2);
          const bw = barTotalW / 4 - 4;
          const bh = freqs[i] * barH * 2;

          ctx.fillStyle = baseColors[base] + '80';
          ctx.fillRect(bx, barY + barH - bh, bw, bh);
          ctx.strokeStyle = baseColors[base];
          ctx.lineWidth = 1;
          ctx.strokeRect(bx, barY + barH - bh, bw, bh);

          // Base label
          ctx.font = '11px "JetBrains Mono", monospace';
          ctx.fillStyle = baseColors[base];
          ctx.textAlign = 'center';
          ctx.fillText(base, bx + bw / 2, barY + barH + 14);

          // Percentage
          ctx.font = '8px "JetBrains Mono", monospace';
          ctx.fillStyle = colors.textTer;
          ctx.fillText(Math.round(freqs[i] * 100) + '%', bx + bw / 2, barY + barH - bh - 4);
        });

        // Uniform line
        const uniformH = 0.25 * barH * 2;
        ctx.setLineDash([3, 3]);
        ctx.strokeStyle = colors.muted + '60';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(sp.pad + 26, barY + barH - uniformH);
        ctx.lineTo(sp.pad + 30 + barTotalW, barY + barH - uniformH);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.font = '7px -apple-system, sans-serif';
        ctx.fillStyle = colors.muted;
        ctx.textAlign = 'left';
        ctx.fillText('25%', sp.pad, barY + barH - uniformH + 3);

        // Show resulting sequence
        const leSeqY = barY + barH + 28;
        ctx.font = '8px -apple-system, sans-serif';
        ctx.fillStyle = colors.textSec;
        ctx.textAlign = 'left';
        ctx.fillText('Resulting read:', sp.pad, leSeqY);

        const leRng = mulberry32(88);
        ctx.font = '10px "JetBrains Mono", monospace';
        let lex = sp.pad;
        const leLen = 24;
        for (let i = 0; i < leLen; i++) {
          const r = leRng();
          let ch;
          if (r < freqs[0]) ch = 'A';
          else if (r < freqs[0] + freqs[1]) ch = 'T';
          else if (r < freqs[0] + freqs[1] + freqs[2]) ch = 'G';
          else ch = 'C';
          ctx.fillStyle = baseColors[ch];
          ctx.fillText(ch, lex, leSeqY + 14);
          lex += 8;
        }

        // Entropy calculation
        const leEntY = leSeqY + 30;
        const ent = -freqs.reduce((s, f) => s + (f > 0 ? f * Math.log2(f) : 0), 0);
        ctx.font = '9px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.muted;
        ctx.fillText('H = ' + ent.toFixed(2) + ' bits', sp.pad, leEntY);
        ctx.font = '9px -apple-system, sans-serif';
        ctx.fillStyle = colors.textTer;
        ctx.fillText(ent < 1.5 ? '(low — too skewed to be real data)' : '(normal range)', sp.pad + 90, leEntY);

        // Explanation
        const leExpY = leEntY + 18;
        ctx.font = '9px -apple-system, sans-serif';
        ctx.fillStyle = colors.textTer;
        const leLines = [
          'Not a clean repeat, but statistically unlikely',
          'to come from a real genome. 70% of these are',
          'G-dominant (two-color chemistry signal loss),',
          '30% are A/T-dominant (general signal dropout).',
          '',
          'These fall in the "gray zone" where QC tools',
          'disagree on whether to keep or discard them.',
        ];
        leLines.forEach((line, i) => {
          if (line === '') return;
          ctx.fillText(line, sp.pad, leExpY + i * 12);
        });
      }

      ctx.restore();
    }

    // ===== RIGHT: In ViroForge (HTML overlay) =====
    const descOverlay = document.getElementById('desc-overlay');

    if (option === 'adapters') {
      if (descOverlay && !descOverlay._adpInit) {
        descOverlay._adpInit = true; descOverlay._dupInit = false; descOverlay._lcInit = false;
        descOverlay.style.display = 'block';
        descOverlay.innerHTML = `
          <p style="margin:0 0 6px"><b>What this step does:</b> after Read Simulation produces clean FASTQ reads, ViroForge's <code>adapters.py</code> post-processor scans for reads where the insert was shorter than the read length, and appends real adapter sequence to those reads — simulating what happens when the sequencer reads past the DNA insert into the adapter on the other side.</p>
          <p style="margin:0 0 6px"><b>Step 1 — Identify short inserts:</b> during Read Simulation, each read pair was assigned an insert size drawn from N(350, 50²). ViroForge checks which inserts are shorter than the read length (150 bp for NovaSeq, 250 bp for MiSeq). These are the reads that would have adapter contamination in real data.</p>
          <p style="margin:0 0 6px"><b>Step 2 — Append adapter sequence:</b> for each short-insert read, ViroForge replaces the bases beyond the insert end with real adapter sequence from a bundled FASTA file. TruSeq adapters (11 sequences) are the default; Nextera (chimeric ligation adapters) is also available via <code>--adapter-type</code>.</p>
          <p style="margin:0 0 6px"><b>Step 3 — Tag and manifest:</b> affected reads are tagged with <code>source=adapter</code> in the FASTQ header. A manifest TSV is written listing every contaminated read, its insert size, and how many adapter bases were appended. This ground truth lets QC benchmarks measure exactly how well a trimming tool detected and removed adapter contamination.</p>
          <p style="margin:0 0 6px"><b>Emergent rate:</b> the adapter contamination rate is not set directly — it emerges from the insert size distribution. With N(350, 50²) and 150 bp reads, ~0.003% of inserts fall below 150 bp. The <code>--adapter-rate</code> flag (default 0.05) sets a target rate; ViroForge adjusts the insert size distribution tail to match.</p>
          <div class="desc-label">Default parameters</div>
          <code style="display:block;line-height:1.6">--adapter-rate &nbsp;= 0.05 (5%)<br>--adapter-type &nbsp;= truseq<br>adapter_fasta &nbsp;&nbsp;= bundled (11 seqs)<br>output &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= adapter_manifest.tsv</code>
        `;
      }
    } else if (option === 'duplicates') {
      if (descOverlay && !descOverlay._dupInit) {
        descOverlay._dupInit = true; descOverlay._adpInit = false; descOverlay._lcInit = false;
        descOverlay.style.display = 'block';
        descOverlay.innerHTML = `
          <p style="margin:0 0 6px"><b>What this step does:</b> ViroForge's <code>duplicates.py</code> post-processor takes existing reads from the FASTQ and creates copies of them — simulating PCR duplicates that arise during library amplification on the flow cell (bridge amplification for Illumina).</p>
          <p style="margin:0 0 6px"><b>Step 1 — Select template reads:</b> not all reads are equally likely to be duplicated. ViroForge selects templates with a bias toward 50% GC content (Gaussian, σ=0.15) and shorter fragment length (linear decay). This mimics real PCR bias where moderate-GC, short fragments amplify most efficiently.</p>
          <p style="margin:0 0 6px"><b>Step 2 — Determine copy count:</b> for each selected template, ViroForge draws the number of duplicates from a geometric distribution: P(k copies) = 0.5^k. So 50% of duplicated reads get 1 extra copy, 25% get 2, 12.5% get 3, etc. This matches the empirical distribution observed in real sequencing libraries.</p>
          <p style="margin:0 0 6px"><b>Step 3 — Inject PCR errors:</b> each duplicate copy has a small chance of PCR error (~0.1% per base per cycle). Later copies accumulate more errors because they are copies of copies. ViroForge models this by increasing the error count proportional to the copy generation — a 3rd-generation copy has more errors than a 1st-generation copy.</p>
          <p style="margin:0 0 6px"><b>Step 4 — Tag and manifest:</b> duplicate reads are tagged in the FASTQ header and a manifest TSV records which reads are duplicates of which template, the copy number, and any PCR errors introduced. This lets deduplication benchmarks (Picard MarkDuplicates, samtools markdup) measure their detection accuracy.</p>
          <p style="margin:0 0 6px"><b>Paired-end consistency:</b> when a read pair is selected for duplication, both R1 and R2 are duplicated together — just like real PCR duplicates, which always affect both mates of a pair.</p>
          <div class="desc-label">Default parameters</div>
          <code style="display:block;line-height:1.6">--duplicate-rate &nbsp;&nbsp;= 0.05 (5%)<br>pcr_error_rate &nbsp;&nbsp;&nbsp;= 0.001/base/cycle<br>copy_distribution = geometric(p=0.5)<br>gc_bias_center &nbsp;&nbsp;&nbsp;= 0.50 (σ=0.15)<br>output &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= duplicate_manifest.tsv</code>
        `;
      }
    } else {
      if (descOverlay && !descOverlay._lcInit) {
        descOverlay._lcInit = true; descOverlay._adpInit = false; descOverlay._dupInit = false;
        descOverlay.style.display = 'block';
        descOverlay.innerHTML = `
          <p style="margin:0 0 6px"><b>What this step does:</b> ViroForge's <code>low_complexity.py</code> injector generates synthetic reads with repetitive sequence and inserts them into the FASTQ — simulating the low-complexity reads that appear in real sequencing runs due to polymerase slippage, tandem repeats, and signal noise.</p>
          <p style="margin:0 0 6px"><b>Step 1 — Generate repetitive sequences:</b> ViroForge creates reads using four generation modes: <b>homopolymer runs</b> (AAAAAAA...), <b>dinucleotide repeats</b> (ATATAT...), <b>simple sequence repeats</b> (ATGATGATG...), and <b>controlled-entropy mix</b> (random sequence at a target entropy level). The mode is chosen randomly for each injected read.</p>
          <p style="margin:0 0 6px"><b>Step 2 — Control entropy:</b> Shannon entropy H measures sequence randomness on a scale from 0.0 (pure repeat, e.g., AAAA) to 2.0 (fully random). The <code>--entropy-range</code> flag (default 0.3–0.7) sets the target entropy window. This "gray zone" is specifically designed to test the sensitivity thresholds of complexity filters — reads at H=0.5 are ambiguous enough that different QC tools will disagree on whether to keep or discard them.</p>
          <p style="margin:0 0 6px"><b>Step 3 — Insert into FASTQ:</b> the generated low-complexity reads are inserted at random positions in the output FASTQ, replacing an equal number of existing reads to keep the total read count constant. Each injected read is tagged with <code>source=low_complexity</code> in the header.</p>
          <p style="margin:0 0 6px"><b>Step 4 — Manifest:</b> a TSV manifest records every injected read, its generation mode (homopolymer/dinucleotide/SSR/entropy-mix), and its calculated Shannon entropy. This lets QC benchmarks measure exactly which low-complexity reads a filter caught and which it missed, stratified by entropy level.</p>
          <div class="desc-label">Default parameters</div>
          <code style="display:block;line-height:1.6">--low-complexity-rate = 0.02 (2%)<br>--entropy-range &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= 0.3–0.7<br>generation_modes &nbsp;&nbsp;&nbsp;&nbsp;= 4 types<br>entropy_scale &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= 0.0–2.0 (Shannon)<br>output &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= low_complexity_manifest.tsv</code>
        `;
      }
    }

    if (descOverlay) {
      const _cvs = ctx.canvas;
      const canvasRect = _cvs.getBoundingClientRect();
      const scaleX = canvasRect.width / W;
      const scaleY = canvasRect.height / H;
      const descTop = (cY + 6) * scaleY;
      const descLeft = (rX + sp.pad) * scaleX;
      const descWidth = (rW - sp.pad * 2) * scaleX;
      const descBottom = canvasRect.height - 4;
      descOverlay.style.top = descTop + 'px';
      descOverlay.style.left = descLeft + 'px';
      descOverlay.style.width = descWidth + 'px';
      descOverlay.style.height = (descBottom - descTop) + 'px';
    }

    animFrame = requestAnimationFrame(draw);
  }
  draw();
}

    compKeys.forEach(key => {
      if (key === 'viral' || key === 'darkmatter') return;
      sc[key] = scaledKeys.includes(key) ? Math.min(c[key] * mult, 100) : c[key];
    });
    const totalContam = Object.values(sc).reduce((a, b) => a + b, 0);

  // Click handler

      if (my >= y && my <= y + hitRowH) { hit = true; break; }
    }
    if (!hit && selectedIdx >= 0 && my >= btnRowY && my <= btnRowY + btnH && mx >= W * 0.50) hit = true;

  }
  canvas.addEventListener('mousemove', onCanvasMove);
  canvas._collClickHandler = onCanvasClick;
  canvas._collMoveHandler = onCanvasMove;

    viral: 'Viral (classified)', darkmatter: 'Viral (dark matter)', bact: 'Bacterial', host: 'Host DNA', rrna: 'rRNA',

      // Category legend at bottom left
