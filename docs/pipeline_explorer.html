<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ViroForge Pipeline Overview</title>
<style>
@font-face {
  font-family: 'JBMono';
  src: url('data:font/woff2;base64,') format('woff2');
  font-weight: 400;
  font-style: normal;
}

:root, :root[data-theme="dark"], :root[data-theme="light"] {
  --ink: #1a1d23;
  --surface: #ffffff;
  --muted: #777a80;
  --accent: #2d7d9a;
  --accent-warm: #c4643a;
  --field: #f0eeea;
  --node-bg: #ffffff;
  --node-border: #d0cfc9;
  --node-active-bg: #eaf5f8;
  --node-active-border: #2d7d9a;
  --connector: #c5c4bf;
  --panel-bg: #ffffff;
  --panel-border: #e0dfda;
  --code-bg: #f5f4f0;
  --tag-bg: #eeedea;
  --tag-text: #444750;
  --canvas-bg: #ffffff;
  --particle-viral: #2d7d9a;
  --particle-bacteria: #c4643a;
  --particle-host: #9a7b2d;
  --particle-rrna: #7b2d9a;
  --particle-phix: #5a9a2d;
  --text-primary: #1a1d23;
  --text-secondary: #3a3d44;
  --text-tertiary: #666970;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  background: var(--surface);
  color: var(--text-primary);
  line-height: 1.5;
  min-height: 100vh;
}

.mono {
  font-family: "JetBrains Mono", "SF Mono", "Fira Code", "Cascadia Code", monospace;
}

header {
  padding: 24px 32px 20px;
  border-bottom: 1px solid var(--panel-border);
  background: var(--panel-bg);
}
header h1 {
  font-family: "JetBrains Mono", "SF Mono", "Fira Code", monospace;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--accent);
}
header p {
  font-size: 13px;
  color: var(--text-tertiary);
  margin-top: 4px;
}

.app {
  display: flex;
  height: calc(100vh - 73px);
  overflow: hidden;
}

/* Pipeline column */
.pipeline {
  width: 280px;
  min-width: 280px;
  border-right: 1px solid var(--panel-border);
  background: var(--panel-bg);
  overflow-y: auto;
  padding: 20px 16px;
}

.pipeline-label {
  font-family: "JetBrains Mono", "SF Mono", "Fira Code", monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-tertiary);
  margin-bottom: 16px;
  padding-left: 4px;
}

.step-node {
  position: relative;
  padding: 10px 12px;
  margin-bottom: 4px;
  border: 1.5px solid var(--node-border);
  border-radius: 6px;
  background: var(--node-bg);
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
}
.step-node:hover {
  border-color: var(--accent);
}
.step-node.active {
  background: var(--node-active-bg);
  border-color: var(--node-active-border);
}
.step-node .step-num {
  font-family: "JetBrains Mono", "SF Mono", "Fira Code", monospace;
  font-size: 10px;
  color: var(--text-tertiary);
  letter-spacing: 0.05em;
}
.step-node.active .step-num { color: var(--accent); }
.step-node .step-name {
  font-size: 13px;
  font-weight: 550;
  margin-top: 2px;
  color: var(--text-primary);
}
.step-node .step-desc {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 2px;
  line-height: 1.4;
}

.connector {
  width: 2px;
  height: 12px;
  background: var(--connector);
  margin: 0 auto;
  position: relative;
}
.connector::after {
  content: '';
  position: absolute;
  bottom: -3px;
  left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 5px solid var(--connector);
}

/* Detail panel */
.detail {
  flex: 1;
  overflow-y: auto;
  padding: 28px 36px;
}

.detail-header {
  margin-bottom: 24px;
}
.detail-header h2 {
  font-family: "JetBrains Mono", "SF Mono", "Fira Code", monospace;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  text-wrap: balance;
}
.detail-header .subtitle {
  font-size: 14px;
  color: var(--text-secondary);
  margin-top: 6px;
  max-width: 60ch;
  line-height: 1.6;
}

/* Option tabs */
.options-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.opt-btn {
  font-family: "JetBrains Mono", "SF Mono", "Fira Code", monospace;
  font-size: 11px;
  padding: 6px 14px;
  border: 1.5px solid var(--node-border);
  border-radius: 4px;
  background: var(--node-bg);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.opt-btn:hover { border-color: var(--accent); color: var(--accent); }
.opt-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* Canvas area */
.canvas-wrap {
  position: relative;
  background: var(--canvas-bg);
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 20px;
}
.desc-overlay {
  display: none;
  position: absolute;
  overflow-y: auto;
  font: 11px -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--text-tertiary);
  line-height: 1.45;
  padding: 0 4px 6px 0;
  box-sizing: border-box;
}
.desc-overlay::-webkit-scrollbar { width: 4px; }
.desc-overlay::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 2px; }
.desc-overlay .desc-label { color: var(--accent); font-weight: 600; margin-top: 6px; margin-bottom: 4px; }
.desc-overlay code { font: 11px "JetBrains Mono", monospace; }
.canvas-wrap canvas {
  display: block;
  width: 100%;
  height: 340px;
  transition: height 0.3s ease;
}
.canvas-wrap.canvas-tall canvas {
  height: 520px;
}

/* Info cards */

/* Legend */
.legend {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  padding: 10px 16px;
  background: var(--field);
  border-radius: 6px;
  margin-bottom: 16px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-secondary);
}
.legend-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
}

/* Welcome panel */
.welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  text-align: center;
  padding: 40px;
}
.welcome h2 {
  font-family: "JetBrains Mono", "SF Mono", "Fira Code", monospace;
  font-size: 20px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 12px;
}
.welcome p {
  font-size: 14px;
  color: var(--text-tertiary);
  max-width: 40ch;
  line-height: 1.6;
}
.welcome .arrow-hint {
  margin-top: 24px;
  font-size: 24px;
  color: var(--accent);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.4; transform: translateX(-8px); }
  50% { opacity: 1; transform: translateX(0); }
}

@media (prefers-reduced-motion: reduce) {
  .welcome .arrow-hint { animation: none; opacity: 0.7; }
  .connector::after { animation: none; }
}

/* Responsive */
@media (max-width: 720px) {
  .app { flex-direction: column; height: auto; }
  .pipeline {
    width: 100%; min-width: 0;
    border-right: none; border-bottom: 1px solid var(--panel-border);
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 12px;
    overflow-y: visible;
  }
  .pipeline-label { display: none; }
  .connector { display: none; }
  .step-node { margin-bottom: 0; flex: 1; min-width: 100px; }
  .step-node .step-desc { display: none; }
  .detail { padding: 20px 16px; }
  .canvas-wrap canvas { height: 280px; }
  .canvas-wrap.canvas-tall canvas { height: 460px; }
}
</style>

<header>
  <h1>ViroForge Pipeline Overview</h1>
  <p>Interactive guide to each stage of synthetic virome dataset generation</p>
</header>

<div class="app">
  <nav class="pipeline" id="pipeline"></nav>
  <main class="detail" id="detail">
    <div class="welcome">
      <h2>Select a pipeline step</h2>
      <p>Click any step on the left to see how it works, explore protocol options, and watch animated demonstrations.</p>
      <div class="arrow-hint">&larr;</div>
    </div>
  </main>
</div>

<script>
const STEPS = [
  {
    id: 'collection', num: '01', name: 'Collection Selection',
    desc: 'Choose a virome collection',
    subtitle: 'Select from 20 curated virome collections. Click any bar to see its composition breakdown at different contamination levels (clean 0.25×, realistic 1×, heavy 2.5×).',
    options: [],
    animation: 'collection'
  },
  {
    id: 'vlp', num: '02', name: 'VLP Enrichment',
    desc: 'Concentrate viral particles',
    subtitle: 'Simulate virus-like particle enrichment to remove bacteria and host cells while retaining viral particles. Each protocol has different size selectivity and recovery characteristics.',
    options: [
      { id: 'filtration', label: 'Filtration' },
      { id: 'ultracentrifugation', label: 'Ultracentrifuge' },
      { id: 'column', label: 'Column Kit' },
      { id: 'none', label: 'No VLP (Bulk)' }
    ],
    animation: 'vlp'
  },
  {
    id: 'amplification', num: '03', name: 'Amplification',
    desc: 'Model amplification bias',
    subtitle: 'Simulate how different amplification protocols distort the original abundance distribution through GC content bias, length bias, and stochastic effects.',
    options: [
      { id: 'linker', label: 'Linker (PCR)' },
      { id: 'mda', label: 'MDA (phi29)' },
      { id: 'rdab', label: 'RdAB (RT-PCR)' },
      { id: 'none_amp', label: 'None' }
    ],
    animation: 'amplification'
  },
  {
    id: 'sequencing', num: '04', name: 'Read Simulation',
    desc: 'Generate synthetic reads',
    subtitle: 'Simulate platform-specific sequencing. Each technology produces reads with distinct length distributions, error profiles, and output formats.',
    options: [
      { id: 'novaseq', label: 'NovaSeq' },
      { id: 'miseq', label: 'MiSeq' },
      { id: 'pacbio', label: 'PacBio HiFi' },
      { id: 'nanopore', label: 'Nanopore' }
    ],
    animation: 'sequencing'
  },
  {
    id: 'artifacts', num: '05', name: 'Artifact Injection',
    desc: 'Add sequencing artifacts',
    subtitle: 'Layer realistic sequencing artifacts onto the reads: adapter read-through from short inserts, PCR duplicates with GC/length bias, low-complexity sequences, and chimeric reads from MDA.',
    options: [
      { id: 'adapters', label: 'Adapters' },
      { id: 'duplicates', label: 'PCR Duplicates' },
      { id: 'lowcomplex', label: 'Low-Complexity' }
    ],
    animation: 'artifacts'
  },
  {
    id: 'output', num: '06', name: 'Output Files',
    desc: 'FASTQ + ground truth',
    subtitle: 'Every read is labeled with its source (viral, host_dna, rrna, phix, reagent, bacterial, erv_endogenous). The output includes FASTQ files, metadata JSON, and composition tables.',
    options: [
      { id: 'fastq', label: 'FASTQ Files' },
      { id: 'metadata', label: 'Metadata JSON' },
      { id: 'manifests', label: 'Manifests' }
    ],
    animation: 'output'
  },
  {
    id: 'report', num: '07', name: 'Diagnostic Report',
    desc: 'HTML visualization',
    subtitle: 'Auto-generated HTML report with 8 diagnostic plots: composition pie chart, VLP before/after bars, family distribution, rank-abundance curve, GC histogram, genome length scatter, contamination table, and artifact summary.',
    options: [],
    animation: 'report'
  },
  {
    id: 'benchmark', num: '08', name: 'Benchmarking',
    desc: 'Score your pipeline',
    subtitle: 'Score your analysis pipeline against known ground truth. Three modules available: QC (contamination removal), Assembly (genome recovery), and Taxonomy (read/contig classification accuracy).',
    options: [
      { id: 'qc', label: 'QC Module' },
      { id: 'assembly', label: 'Assembly' },
      { id: 'taxonomy', label: 'Taxonomy' }
    ],
    animation: 'benchmark'
  }
];

// Build pipeline nav
const pipelineEl = document.getElementById('pipeline');
const detailEl = document.getElementById('detail');
const labelEl = document.createElement('div');
labelEl.className = 'pipeline-label';
labelEl.textContent = 'Pipeline Steps';
pipelineEl.appendChild(labelEl);

STEPS.forEach((step, i) => {
  if (i > 0) {
    const conn = document.createElement('div');
    conn.className = 'connector';
    pipelineEl.appendChild(conn);
  }
  const node = document.createElement('div');
  node.className = 'step-node';
  node.dataset.step = step.id;
  node.innerHTML = `<div class="step-num mono">${step.num}</div><div class="step-name">${step.name}</div><div class="step-desc">${step.desc}</div>`;
  node.addEventListener('click', () => selectStep(step));
  node.setAttribute('tabindex', '0');
  node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectStep(step); } });
  pipelineEl.appendChild(node);
});

let currentStep = null;
let currentOption = null;
let animFrame = null;

function selectStep(step) {
  currentStep = step;
  document.querySelectorAll('.step-node').forEach(n => n.classList.remove('active'));
  document.querySelector(`.step-node[data-step="${step.id}"]`).classList.add('active');
  currentOption = step.options.length > 0 ? step.options[0].id : null;
  renderDetail();
}

function renderDetail() {
  const step = currentStep;
  if (!step) return;
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  const cvs = document.getElementById('anim-canvas');
  if (cvs && cvs._collClickHandler) { cvs.removeEventListener('click', cvs._collClickHandler); cvs._collClickHandler = null; }
  if (cvs && cvs._collMoveHandler) { cvs.removeEventListener('mousemove', cvs._collMoveHandler); cvs._collMoveHandler = null; cvs.style.cursor = 'default'; }
  if (cvs && cvs._lcClickHandler) { cvs.removeEventListener('click', cvs._lcClickHandler); cvs._lcClickHandler = null; }
  if (cvs && cvs._lcMoveHandler) { cvs.removeEventListener('mousemove', cvs._lcMoveHandler); cvs._lcMoveHandler = null; cvs.style.cursor = 'default'; }
  if (cvs) { cvs._lcTab = undefined; cvs._lcTabT = undefined; cvs._lcTabHits = undefined; }
  // Reset description overlay on step change
  const _dov = document.getElementById('desc-overlay');
  if (_dov) { _dov.style.display = 'none'; _dov._filtInit = false; _dov._ucInit = false; _dov._colInit = false; _dov._rdabInit = false; _dov._mdaInit = false; _dov._linkerInit = false; _dov._novaInit = false; _dov._miseqInit = false; _dov._pacbioInit = false; _dov._nanoporeInit = false; _dov._adpInit = false; _dov._dupInit = false; _dov._lcInit = false; _dov.innerHTML = ''; }

  let optionsHtml = '';
  if (step.options.length > 0) {
    optionsHtml = `<div class="options-bar">${step.options.map(o =>
      `<button class="opt-btn${o.id === currentOption ? ' active' : ''}" data-opt="${o.id}">${o.label}</button>`
    ).join('')}</div>`;
  }

  detailEl.innerHTML = `
    <div class="detail-header">
      <h2>${step.name}</h2>
      <div class="subtitle">${step.subtitle}</div>
    </div>
    ${optionsHtml}
    <div id="legend-area"></div>
    <div class="canvas-wrap"><canvas id="anim-canvas"></canvas><div class="desc-overlay" id="desc-overlay"></div></div>
  `;

  detailEl.querySelectorAll('.opt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentOption = btn.dataset.opt;
      renderDetail();
    });
  });

  const canvas = document.getElementById('anim-canvas');
  const wrap = canvas.closest('.canvas-wrap');
  const splitPanelSteps = ['vlp', 'amplification', 'sequencing', 'artifacts'];
  if (step.animation === 'collection' || splitPanelSteps.includes(step.animation)) wrap.classList.add('canvas-tall');
  else wrap.classList.remove('canvas-tall');

  requestAnimationFrame(() => {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const zoom = 1.35;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr * zoom, dpr * zoom);
    const W = rect.width / zoom, H = rect.height / zoom;
    ctx.clearRect(0, 0, W, H);

    startAnimation(step.animation, currentOption, ctx, W, H);
    renderInfo(step.id, currentOption);
  });
}

function getColor(varName) {
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}

function startAnimation(type, option, ctx, W, H) {
  const colors = {
    viral: getColor('--particle-viral'),
    bacteria: getColor('--particle-bacteria'),
    host: getColor('--particle-host'),
    rrna: getColor('--particle-rrna'),
    phix: getColor('--particle-phix'),
    accent: getColor('--accent'),
    warm: getColor('--accent-warm'),
    muted: getColor('--muted'),
    bg: getColor('--canvas-bg'),
    text: getColor('--text-primary'),
    textSec: getColor('--text-secondary'),
    textTer: getColor('--text-tertiary'),
    border: getColor('--panel-border'),
    field: getColor('--field'),
  };

  if (type === 'vlp') animateVLP(option, ctx, W, H, colors);
  else if (type === 'amplification') animateAmplification(option, ctx, W, H, colors);
  else if (type === 'sequencing') animateSequencing(option, ctx, W, H, colors);
  else if (type === 'artifacts') animateArtifacts(option, ctx, W, H, colors);
  else if (type === 'collection') animateCollection(option, ctx, W, H, colors);
  else if (type === 'output') animateOutput(option, ctx, W, H, colors);
  else if (type === 'report') animateReport(ctx, W, H, colors);
  else if (type === 'benchmark') animateBenchmark(option, ctx, W, H, colors);
}

/* Particle helpers */
function makeParticle(x, y, r, type, vx, vy) {
  return { x, y, r, type, vx: vx||0, vy: vy||0, opacity: 1, alive: true };
}

function drawParticle(ctx, p, colors) {
  if (!p.alive) return;
  const c = { viral: colors.viral, bacteria: colors.bacteria, host: colors.host, rrna: colors.rrna, phix: colors.phix, fungal: '#8d6e3f', archaeal: '#5a7a3a', host_cell: '#c4707a' }[p.type] || colors.muted;
  ctx.globalAlpha = p.opacity;
  ctx.beginPath();
  if (p.type === 'host_cell') {
    // Large irregular eukaryotic cell with nucleus
    ctx.moveTo(p.x + p.r, p.y);
    for (let a = 0; a < Math.PI * 2; a += 0.3) {
      const rr = p.r * (0.85 + 0.15 * Math.sin(a * 2.3 + 1));
      ctx.lineTo(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fillStyle = c;
    ctx.fill();
    // Nucleus
    ctx.beginPath();
    ctx.arc(p.x - p.r * 0.15, p.y, p.r * 0.4, 0, Math.PI * 2);
    ctx.fillStyle = '#a85060';
    ctx.fill();
    ctx.globalAlpha = 1;
    return;
  } else if (p.type === 'bacteria') {
    ctx.ellipse(p.x, p.y, p.r * 1.6, p.r, 0, 0, Math.PI * 2);
  } else if (p.type === 'fungal') {
    // Budding yeast — oval with a small bud
    ctx.ellipse(p.x, p.y, p.r * 1.3, p.r, 0, 0, Math.PI * 2);
    ctx.moveTo(p.x + p.r * 1.1 + p.r * 0.5, p.y - p.r * 0.4);
    ctx.arc(p.x + p.r * 1.1, p.y - p.r * 0.4, p.r * 0.5, 0, Math.PI * 2);
  } else if (p.type === 'archaeal') {
    // Small coccoid (round) — slightly irregular
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
  } else if (p.type === 'host' || p.type === 'rrna') {
    // Squiggle line (free nucleic acid fragment)
    ctx.moveTo(p.x - p.r, p.y);
    for (let s = 1; s <= 5; s++) {
      ctx.lineTo(p.x - p.r + s * p.r * 0.4, p.y + Math.sin(s * 1.6) * p.r * 0.6);
    }
    ctx.strokeStyle = c;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.globalAlpha = 1;
    return;
  } else {
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
  }
  ctx.fillStyle = c;
  ctx.fill();
  ctx.globalAlpha = 1;
}

function showLegend(items) {
  const el = document.getElementById('legend-area');
  if (!el) return;
  el.innerHTML = `<div class="legend">${items.map(([color, label]) =>
    `<div class="legend-item"><div class="legend-dot" style="background:${color}"></div>${label}</div>`
  ).join('')}</div>`;
}

/* === SPLIT PANEL HELPER === */
function drawSplitPanel(ctx, W, H, colors) {
  const midX = Math.floor(W / 2);
  const headerH = 32;
  const pad = 6;

  // Divider line
  ctx.strokeStyle = colors.border;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(midX, 0);
  ctx.lineTo(midX, H);
  ctx.stroke();

  // Column headers
  ctx.font = '14px "JetBrains Mono", monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = colors.warm;
  ctx.fillText('IN THE LAB', midX * 0.5, 20);
  ctx.fillStyle = colors.accent;
  ctx.fillText('IN VIROFORGE', midX * 1.5, 20);

  // Header underlines
  ctx.strokeStyle = colors.border + '60';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(pad, headerH);
  ctx.lineTo(midX - pad, headerH);
  ctx.moveTo(midX + pad, headerH);
  ctx.lineTo(W - pad, headerH);
  ctx.stroke();

  return { midX, headerH, pad, contentY: headerH + 6 };
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '', dy = y;
  for (let i = 0; i < words.length; i++) {
    const test = line + (line ? ' ' : '') + words[i];
    if (ctx.measureText(test).width > maxWidth && line) {
      ctx.fillText(line, x, dy);
      line = words[i];
      dy += lineHeight;
    } else {
      line = test;
    }
  }
  if (line) { ctx.fillText(line, x, dy); dy += lineHeight; }
  return dy;
}

/* === INLINE LEGEND HELPER === */
// shape: 'circle' | 'ellipse' | 'bud' | 'blob' | 'squiggle' | 'diamond'
function drawInlineLegend(ctx, x, y, items, maxWidth, colors) {
  ctx.save();
  ctx.globalAlpha = 0.7;
  ctx.font = '8px -apple-system, sans-serif';
  ctx.textAlign = 'left';
  let curX = x, curY = y;
  items.forEach(([color, label, shape]) => {
    const itemW = ctx.measureText(label).width + 16;
    if (curX + itemW > x + maxWidth && curX > x) {
      curX = x;
      curY += 12;
    }
    const cx = curX + 4, cy = curY;
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.2;
    if (shape === 'ellipse') {
      ctx.beginPath();
      ctx.ellipse(cx, cy, 4, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (shape === 'bud') {
      ctx.beginPath();
      ctx.ellipse(cx - 1, cy, 3, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx + 3, cy - 1.5, 1.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (shape === 'blob') {
      ctx.beginPath();
      for (let a = 0; a < Math.PI * 2; a += 0.5) {
        const rr = 3 * (0.8 + 0.3 * Math.sin(a * 3.7));
        const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
        a === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    } else if (shape === 'squiggle') {
      ctx.beginPath();
      ctx.moveTo(cx - 4, cy);
      for (let s = 1; s <= 4; s++) ctx.lineTo(cx - 4 + s * 2, cy + Math.sin(s * 1.8) * 2.5);
      ctx.stroke();
    } else if (shape === 'diamond') {
      ctx.beginPath();
      ctx.moveTo(cx, cy - 3); ctx.lineTo(cx + 3, cy); ctx.lineTo(cx, cy + 3); ctx.lineTo(cx - 3, cy);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = colors.textSec;
    ctx.fillText(label, curX + 10, curY + 3);
    curX += itemW + 2;
  });
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* === VLP ENRICHMENT ANIMATION === */
function animateVLP(option, ctx, W, H, colors) {
  showLegend([
    [colors.viral, 'Viral (20-150 nm)'],
    [colors.bacteria, 'Bacteria (1-5 µm)'],
    ['#c4707a', 'Host cell (10-30 µm)'],
    ['#8d6e3f', 'Fungal'],
    ['#5a7a3a', 'Archaeal'],
    [colors.host, 'Host DNA (free)'],
    [colors.rrna, 'rRNA'],
  ]);

  const vlpLegendItems = [
    [colors.viral, 'Viral', 'circle'],
    [colors.bacteria, 'Bacteria', 'ellipse'],
    ['#c4707a', 'Host cell', 'blob'],
    ['#8d6e3f', 'Fungal', 'bud'],
    ['#5a7a3a', 'Archaeal', 'circle'],
    [colors.host, 'Free DNA', 'squiggle'],
    [colors.rrna, 'rRNA', 'squiggle'],
  ];

  const rng = mulberry32(42);

  if (option === 'none') {
    // No VLP — no split needed
    const particles = [];
    for (let i = 0; i < 40; i++) {
      const types = ['viral','viral','viral','viral','bacteria','bacteria','host','host','rrna','fungal','archaeal','host_cell','host_cell'];
      const tp = types[Math.floor(rng() * types.length)];
      const sz = tp === 'host_cell' ? 10 + rng()*6 : tp === 'bacteria' ? 8 + rng()*6 : tp === 'viral' ? 3 + rng()*5 : tp === 'fungal' ? 7 + rng()*5 : tp === 'archaeal' ? 4 + rng()*3 : 4 + rng()*4;
      particles.push(makeParticle(20 + rng() * (W - 40), 30 + rng() * (H - 60), sz, tp));
    }
    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'center';
      ctx.fillText('No VLP enrichment applied', W * 0.5, H * 0.3);
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.fillText('All particles retained — bulk metagenome simulation', W * 0.5, H * 0.3 + 24);
      ctx.fillText('Bacterial reads dominate: 60–80% of total', W * 0.5, H * 0.3 + 46);
      particles.forEach(p => {
        p.x += (rng() - 0.5) * 2;
        p.y += (rng() - 0.5) * 2;
        if (p.x < 20) p.x = 20; if (p.x > W - 20) p.x = W - 20;
        if (p.y < 60) p.y = 60; if (p.y > H - 20) p.y = H - 20;
        drawParticle(ctx, p, colors);
      });
      animFrame = requestAnimationFrame(() => draw(t + 16));
    }
    draw(0);
    return;
  }

  // --- Split-panel layout for filtration / ultracentrifugation / column ---
  const particles = [];
  for (let i = 0; i < 30; i++) {
    const types = ['viral','viral','viral','viral','bacteria','bacteria','host','host','rrna','fungal','archaeal','host_cell','host_cell'];
    const tp = types[Math.floor(rng() * types.length)];
    const sz = tp === 'host_cell' ? 8 + rng()*5 : tp === 'bacteria' ? 6 + rng()*4 : tp === 'viral' ? 3 + rng()*4 : tp === 'fungal' ? 5 + rng()*4 : tp === 'archaeal' ? 3 + rng()*3 : 3 + rng()*3;
    particles.push(makeParticle(0, 0, sz, tp, 0.2 + rng() * 0.4, (rng() - 0.5) * 0.25));
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    // Hide description overlay when switching options (each option re-inits its own)
    const _descOv = document.getElementById('desc-overlay');
    if (_descOv) {
      const activeOpt = option;
      if (activeOpt === 'filtration' && !_descOv._filtInit) { _descOv.style.display = 'none'; _descOv._ucInit = false; _descOv._colInit = false; _descOv.innerHTML = ''; }
      else if (activeOpt === 'ultracentrifugation' && !_descOv._ucInit) { _descOv.style.display = 'none'; _descOv._filtInit = false; _descOv._colInit = false; _descOv.innerHTML = ''; }
      else if (activeOpt === 'column' && !_descOv._colInit) { _descOv.style.display = 'none'; _descOv._filtInit = false; _descOv._ucInit = false; _descOv.innerHTML = ''; }
    }
    const sp = drawSplitPanel(ctx, W, H, colors);
    const lW = sp.midX - sp.pad * 2, rX = sp.midX + sp.pad, rW = W - sp.midX - sp.pad * 2;
    const cY = sp.contentY;
    const areaH = H - cY - 10;

    // ===== LEFT: Real lab =====
    ctx.save();
    ctx.beginPath();
    ctx.rect(sp.pad, cY, lW, areaH);
    ctx.clip();

    function drawSquiggle(ctx, sx, sy, segLen, col, alpha, t, idx) {
      if (alpha < 0.02) return;
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = col;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      for (let s = 1; s <= 4; s++) {
        ctx.lineTo(sx + s * segLen / 4, sy + Math.sin(s * 1.5 + t * 0.015 + idx) * 3.5);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    function drawEnzyme(ctx, ex, ey, alpha, t, idx, size) {
      const sz = size || 4;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#e8a735';
      ctx.save();
      ctx.translate(ex, ey);
      ctx.rotate(t * 0.001 + idx);
      ctx.beginPath();
      ctx.moveTo(0, -sz); ctx.lineTo(sz, 0); ctx.lineTo(0, sz); ctx.lineTo(-sz, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    if (option === 'filtration') {
      // Single continuous scene (t increments by 16 per frame ≈ 60fps):
      //   Particles + free DNA/RNA drift and filter throughout.
      //   After ~10s, nuclease enzymes fade in on filtrate side, seek out
      //   DNA/RNA fragments, bind to them, and degrade them one by one.
      const nucleaseStart = 10000;
      const memX = sp.pad + lW * 0.5;
      const filtrateL = memX + 8;
      const filtrateR = sp.pad + lW - 6;

      // Persistent free DNA/RNA fragments
      if (!particles._dnaFrags) {
        const fRng = mulberry32(55);
        particles._dnaFrags = [];
        for (let i = 0; i < 10; i++) {
          particles._dnaFrags.push({
            x: 10 + fRng() * (lW * 0.42),
            y: cY + 25 + fRng() * (areaH - 50),
            vx: 0.2 + fRng() * 0.3,
            vy: (fRng() - 0.5) * 0.2,
            isHost: fRng() > 0.5,
            segLen: 6 + fRng() * 6,
            passed: false,
            alive: true,       // still intact
            fadeOut: 0,         // 0→1 fade when being degraded
            boundBy: -1,        // index of enzyme bound to this fragment
          });
        }
      }
      const dnaFrags = particles._dnaFrags;

      // Persistent nuclease enzymes (initialized once)
      if (!particles._enzymes) {
        const eRng = mulberry32(99);
        particles._enzymes = [];
        for (let i = 0; i < 6; i++) {
          particles._enzymes.push({
            x: filtrateL + eRng() * (filtrateR - filtrateL - 10),
            y: cY + 25 + eRng() * (areaH - 60),
            target: -1,         // index into dnaFrags, -1 = searching
            state: 'idle',      // idle → seeking → bound → idle
            idleTimer: 0,
          });
        }
      }
      const enzymes = particles._enzymes;

      // --- Draw membrane filter (always visible) ---
      ctx.fillStyle = colors.border;
      ctx.fillRect(memX - 2, cY, 4, areaH);
      ctx.fillStyle = colors.bg;
      for (let y = cY + 10; y < cY + areaH; y += 22) {
        ctx.fillRect(memX - 2, y, 4, 10);
      }
      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      ctx.fillText('0.2 µm', memX, cY + areaH - 2);
      ctx.fillText('Sample', sp.pad + lW * 0.25, cY + 12);
      ctx.fillText('Filtrate', sp.pad + lW * 0.75, cY + 12);

      // --- Move and draw particles (always running) ---
      particles.forEach((p, i) => {
        if (t < 32) { p.x = 8 + rng() * (lW * 0.44); p.y = cY + 20 + rng() * (areaH - 40); }
        p.x += p.vx;
        p.y += p.vy + Math.sin(t * 0.002 + i) * 0.2;
        if (p.y < cY + 10 || p.y > cY + areaH - 10) p.vy *= -1;
        if (p.x > memX - 4 && p.x < memX + 4) {
          const pass = p.type === 'host_cell' ? 0 : p.type === 'bacteria' ? 0.02 : p.type === 'fungal' ? 0.01 : p.type === 'archaeal' ? 0.05 : p.type === 'viral' ? 0.92 : 0.15;
          if (rng() < pass) { p.x = memX + 6; } else { p.vx *= -0.5; p.x = memX - 6; }
        }
        if (p.x > sp.pad + lW - 6) { p.vx *= -0.3; p.x = sp.pad + lW - 8; }
        if (p.x < 12) { p.vx = Math.abs(p.vx); }
        drawParticle(ctx, p, colors);
      });

      // --- Move and draw free DNA/RNA fragments ---
      dnaFrags.forEach((f, i) => {
        if (!f.alive && f.fadeOut >= 1) return; // fully degraded, skip
        // Don't move if an enzyme is bound
        if (f.boundBy < 0) {
          f.x += f.vx;
          f.y += f.vy + Math.sin(t * 0.003 + i * 2) * 0.15;
          if (f.y < cY + 15 || f.y > cY + areaH - 15) f.vy *= -1;
          if (f.x > memX - 4 && f.x < memX + 4 && !f.passed) {
            f.x = memX + 6;
            f.passed = true;
          }
          if (f.x > sp.pad + lW - 10) { f.vx *= -0.3; f.x = sp.pad + lW - 12; }
          if (f.x < 12) { f.vx = Math.abs(f.vx); }
        }
        const alpha = f.alive ? 0.8 : Math.max(0, 0.8 * (1 - f.fadeOut));
        drawSquiggle(ctx, f.x, f.y, f.segLen, f.isHost ? colors.host : colors.rrna, alpha, t, i);
      });

      // --- Nuclease enzymes: seek, bind, degrade, then inactivate ---
      const inNuclease = t > nucleaseStart;
      if (inNuclease) {
        const nt = t - nucleaseStart;
        const allDegraded = dnaFrags.filter(f => f.passed).every(f => f.fadeOut >= 1);

        // Track when all fragments were degraded
        if (!particles._allDegradedAt && allDegraded) {
          particles._allDegradedAt = t;
        }
        const doneAt = particles._allDegradedAt || 0;
        const inactivating = doneAt > 0 && (t - doneAt) > 1500; // 1.5s pause then fade
        const inactiveProgress = inactivating ? Math.min(1, (t - doneAt - 1500) / 3000) : 0;

        // Enzyme visibility: fade in over 2s, then fade out when inactivating
        const enzAlpha = Math.min(1, nt / 2000) * (1 - inactiveProgress);

        enzymes.forEach((e, ei) => {
          if (!inactivating) {
            if (e.state === 'idle') {
              let bestDist = Infinity, bestIdx = -1;
              dnaFrags.forEach((f, fi) => {
                if (!f.alive || !f.passed || f.boundBy >= 0) return;
                const dx = f.x - e.x, dy = f.y - e.y;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < bestDist) { bestDist = d; bestIdx = fi; }
              });
              if (bestIdx >= 0) {
                e.target = bestIdx;
                e.state = 'seeking';
              } else {
                e.x += Math.sin(t * 0.0005 + ei * 2) * 0.3;
                e.y += Math.cos(t * 0.0004 + ei * 3) * 0.3;
              }
            }

            if (e.state === 'seeking') {
              const f = dnaFrags[e.target];
              if (!f || !f.alive || f.boundBy >= 0) {
                e.state = 'idle'; e.target = -1;
              } else {
                const dx = f.x - e.x, dy = f.y - e.y;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < 5) {
                  e.state = 'bound';
                  f.boundBy = ei;
                  f.alive = false;
                  f.fadeOut = 0;
                } else {
                  const speed = 0.6;
                  e.x += (dx / d) * speed;
                  e.y += (dy / d) * speed;
                }
              }
            }

            if (e.state === 'bound') {
              const f = dnaFrags[e.target];
              e.x = f.x;
              e.y = f.y;
              f.fadeOut = Math.min(1, f.fadeOut + 0.008);
              if (f.fadeOut >= 1) {
                f.boundBy = -1;
                e.state = 'idle';
                e.target = -1;
              }
            }
          }

          if (enzAlpha > 0.02) {
            drawEnzyme(ctx, e.x, e.y, enzAlpha, t, ei);
          }
        });

        // Status label on filtrate side
        const labAlpha = Math.min(0.8, nt / 2000);
        ctx.globalAlpha = labAlpha;
        ctx.font = '9px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        let statusLabel = 'Nuclease treatment';
        let statusColor = '#e8a735';
        if (inactiveProgress >= 1) {
          statusLabel = 'Inactivated (EDTA) ✓';
          statusColor = colors.textTer;
        } else if (inactivating) {
          statusLabel = 'Inactivating (EDTA)...';
          statusColor = '#e8a735';
        } else if (allDegraded) {
          statusLabel = 'Digestion complete';
          statusColor = '#e8a735';
        }
        ctx.fillStyle = statusColor;
        ctx.fillText(statusLabel, sp.pad + lW * 0.75, cY + areaH - 4);
        ctx.globalAlpha = 1;
      }


    } else if (option === 'ultracentrifugation') {
      const tubeL = sp.pad + lW * 0.30, tubeR = sp.pad + lW * 0.62, tubeT = cY + 20, tubeB = cY + areaH - 20;
      const tubeW = tubeR - tubeL;
      const tubeH = tubeB - tubeT;

      // Co-purified DNA/RNA fragments — these get trapped/associated with
      // viral particles during centrifugation (not density-matched, but
      // non-specifically bound), aspirated with the viral band, and
      // appear in the vial for nuclease treatment.
      if (!particles._ucTubeFrags) {
        const tfRng = mulberry32(211);
        particles._ucTubeFrags = [];
        for (let i = 0; i < 5; i++) {
          particles._ucTubeFrags.push({
            x: tubeL + 10 + tfRng() * (tubeW - 20),
            y: tubeT + 10 + tfRng() * (tubeH - 25),
            _vx: 0, _vy: 0,
            _phase: tfRng() * Math.PI * 2,
            _swirlR: 8 + tfRng() * 12,
            isHost: tfRng() > 0.5,
            segLen: 4 + tfRng() * 3,
            collected: false,
            fadeOut: 0,
          });
        }
      }
      const ucTubeFrags = particles._ucTubeFrags;
      const tubeCX = (tubeL + tubeR) / 2;

      // Timeline (~60fps, t increments by 16 per frame, 0.8× speed):
      //   0-1440      (~24s)  mixed, gentle Brownian drift
      //   1440-2880   (~24s)  spin ramps up, swirl becomes visible
      //   2880-7200   (~72s)  full spin — swirling + sedimentation separates layers
      //   7200-8800   (~27s)  spin winds down, particles settle to rest
      //   8800-9600   (~13s)  labels visible, settled
      //   9600-10400  (~13s)  needle enters from left, punctures at viral band
      //   10400-12800 (~40s)  viral particles aspirated into needle
      //   12800-13600 (~13s)  needle withdraws
      //   13600-14800 (~20s)  vial fades in with collected fraction
      //   14800+              nuclease treatment inside vial
      const rampStart = 1440, fullSpinStart = 2880, spinEnd = 7200, settleEnd = 8800;
      const needleStart = 9600, aspirateStart = 10400, aspirateEnd = 12800;
      const withdrawStart = 13000, withdrawEnd = 13600;
      const vialNuclStart = 14800;

      let spinSpeed = 0;
      if (t >= rampStart && t < fullSpinStart) {
        spinSpeed = (t - rampStart) / (fullSpinStart - rampStart);
      } else if (t >= fullSpinStart && t < spinEnd) {
        spinSpeed = 1;
      } else if (t >= spinEnd && t < settleEnd) {
        spinSpeed = Math.max(0, 1 - (t - spinEnd) / (settleEnd - spinEnd));
      }

      let sep = 0;
      if (t >= fullSpinStart && t < settleEnd) {
        sep = Math.min(1, (t - fullSpinStart) / (settleEnd - fullSpinStart));
      } else if (t >= settleEnd) {
        sep = 1;
      }

      // Fade tube + contents after collection complete
      const tubeFade = t > withdrawEnd ? Math.max(0.25, 1 - (t - withdrawEnd) / 4000) : 1;

      // Draw tube
      ctx.globalAlpha = tubeFade;
      ctx.strokeStyle = colors.border;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(tubeL, tubeT);
      ctx.lineTo(tubeL, tubeB - 15);
      ctx.quadraticCurveTo(tubeL, tubeB, tubeL + 15, tubeB);
      ctx.lineTo(tubeR - 15, tubeB);
      ctx.quadraticCurveTo(tubeR, tubeB, tubeR, tubeB - 15);
      ctx.lineTo(tubeR, tubeT);
      ctx.stroke();
      ctx.globalAlpha = 1;

      // Density gradient with distinct bands as separation progresses
      if (sep > 0.1) {
        const gAlpha = Math.min(1, sep * 1.3);
        // CsCl gradient: light at top → dense at bottom
        const grad = ctx.createLinearGradient(0, tubeT, 0, tubeB);
        grad.addColorStop(0, 'transparent');
        grad.addColorStop(0.20, `rgba(180,190,220,${0.02 * gAlpha})`);  // buffer supernatant
        grad.addColorStop(0.32, `rgba(140,160,200,${0.04 * gAlpha})`);  // light fraction
        grad.addColorStop(0.38, colors.viral + (Math.floor(30 * gAlpha)).toString(16).padStart(2, '0'));    // viral band
        grad.addColorStop(0.48, `rgba(140,160,200,${0.03 * gAlpha})`);  // gap
        grad.addColorStop(0.58, `rgba(90,122,58,${0.12 * gAlpha})`);    // archaeal band
        grad.addColorStop(0.64, `rgba(140,160,200,${0.03 * gAlpha})`);  // gap
        grad.addColorStop(0.72, colors.bacteria + (Math.floor(22 * gAlpha)).toString(16).padStart(2, '0')); // bacteria + fungi
        grad.addColorStop(0.82, `rgba(141,110,63,${0.12 * gAlpha})`);   // DNA/RNA pellet
        grad.addColorStop(1.0, `rgba(100,80,60,${0.18 * gAlpha})`);
        ctx.fillStyle = grad;
        ctx.fillRect(tubeL + 2, tubeT, tubeW - 4, tubeH);
      }

      // Status label
      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      if (spinSpeed > 0.05) {
        ctx.fillStyle = colors.accent;
        ctx.fillText('100,000×g  ↻ spinning', (tubeL + tubeR) / 2, tubeT - 4);
      } else if (sep >= 1) {
        ctx.fillStyle = colors.textTer;
        ctx.fillText('100,000×g  done', (tubeL + tubeR) / 2, tubeT - 4);
      } else {
        ctx.fillStyle = colors.textTer;
        ctx.fillText('mixed sample', (tubeL + tubeR) / 2, tubeT - 4);
      }

      // Result labels after settling — show distinct bands
      if (sep > 0.85) {
        const la = Math.min(1, (sep - 0.85) / 0.15);
        ctx.globalAlpha = la;
        ctx.font = '9px -apple-system, sans-serif';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        const labX = tubeR + 6;
        // Viral band
        ctx.fillStyle = colors.viral;
        ctx.fillText('← viral band', labX, tubeT + tubeH * 0.38);
        ctx.fillStyle = colors.textTer;
        ctx.fillText('  1.2–1.5 g/cm³', labX, tubeT + tubeH * 0.38 + 12);
        // Archaeal band
        ctx.fillStyle = '#5a7a3a';
        ctx.fillText('← archaea', labX, tubeT + tubeH * 0.58);
        ctx.fillStyle = colors.textTer;
        ctx.fillText('  1.4–1.6 g/cm³', labX, tubeT + tubeH * 0.58 + 12);
        // Pellet: bacteria, fungi, host cells, DNA, RNA
        ctx.fillStyle = colors.bacteria;
        ctx.fillText('← bacteria, fungi,', labX, tubeT + tubeH * 0.74);
        ctx.fillText('   host cells, DNA', labX, tubeT + tubeH * 0.74 + 11);
        ctx.fillStyle = colors.textTer;
        ctx.fillText('  1.5–2.0 g/cm³', labX, tubeT + tubeH * 0.74 + 23);
        ctx.globalAlpha = 1;
      }

      // Particle simulation — swirl in liquid + sedimentation
      particles.forEach((p, i) => {
        if (!p._ucInit) {
          p._ucInit = true;
          const pRng = mulberry32(i * 37 + 7);
          p.x = tubeL + 10 + pRng() * (tubeW - 20);
          p.y = tubeT + 10 + pRng() * (tubeH - 25);
          p._vx = 0;
          p._vy = 0;
          p._phase = pRng() * Math.PI * 2;
          p._swirlR = 8 + pRng() * 15;
        }

        // Swirl: each particle orbits its own small circle, like
        // being carried by a rotating liquid. The orbit speed and
        // radius scale with spinSpeed.
        const swirlAngle = p._phase + t * 0.012 * spinSpeed;
        const swirlAmt = spinSpeed * (1 - sep * 0.7);
        const swirlOX = Math.cos(swirlAngle) * p._swirlR * swirlAmt;
        const swirlOY = Math.sin(swirlAngle) * p._swirlR * swirlAmt * 0.4;

        // Sedimentation: heavy particles sink, free molecules float up
        let targetY;
        // Mark a few bacteria/archaea as density-overlapping — they co-band with viruses
        if (!p._ucDensitySet) {

            particles._bacCount++;

          } else if (p.type === 'archaeal') {
            if (!particles._archCount) particles._archCount = 0;
            particles._archCount++;
            p._overlapViral = (particles._archCount === 1);
          }
        }
        if ((p.type === 'bacteria' || p.type === 'archaeal') && p._overlapViral) {
          // Density overlap with viral band
          const bandFrac = ((i * 11 + 3) % 9) / 8;
          targetY = tubeT + tubeH * (0.38 + bandFrac * 0.06);
        } else if (p.type === 'bacteria') {
          // Bacteria: band in lower-middle (~68-75%)

        } else if (p.type === 'fungal') {

        } else if (p.type === 'archaeal') {

        } else if (p.type === 'viral') {
          // Viruses: characteristic density band (~35-42%)
          const bandFrac = ((i * 11 + 5) % 17) / 16;
          targetY = tubeT + tubeH * (0.35 + bandFrac * 0.07);
        } else if (p.type === 'host_cell') {
          // Host cells: largest, heaviest — pellet to very bottom (~88-95%)
          const bandFrac = ((i * 7 + 2) % 9) / 8;
          targetY = tubeT + tubeH * (0.88 + bandFrac * 0.07);
        } else if (p.type === 'host') {
          // Free DNA: dense, bands near bottom (~82-88%)
          const bandFrac = ((i * 13 + 2) % 11) / 10;
          targetY = tubeT + tubeH * (0.82 + bandFrac * 0.06);
        } else if (p.type === 'rrna') {
          // Free RNA: very dense, pellets to bottom (~86-92%)

        // Smoothstep easing for separation

        const baseY = p.y;

        if (p.y < tubeT + 5) { p.y = tubeT + 5; p._vy = Math.abs(p._vy) * 0.2; }

        // Aspiration: viral + density-overlapping cells move toward needle

      });

      // --- Co-purified DNA/RNA fragments in tube ---
      ucTubeFrags.forEach((f, i) => {
        if (f.collected) return;

        // Same physics as particles: swirl + sediment toward viral band depth
        const swirlAngle = f._phase + t * 0.012 * spinSpeed;
        const swirlAmt = spinSpeed * (1 - sep * 0.7);
        const swirlOX = Math.cos(swirlAngle) * f._swirlR * swirlAmt;
        const swirlOY = Math.sin(swirlAngle) * f._swirlR * swirlAmt * 0.4;

        // Band at viral density layer (trapped/associated with viral particles)
        const bandFrac = ((i * 11 + 7) % 9) / 8;
        const targetY = tubeT + tubeH * (0.34 + bandFrac * 0.08);

        if (t > aspirateStart) {

          const stagger = ((i + 6) % 5) / 5;
          const myProg = Math.max(0, Math.min(1, (aspProg - stagger * 0.5) / 0.5));

            const needleTipY = tubeT + tubeH * 0.39;

      });

      // --- Needle / syringe for fraction collection ---
      if (t > needleStart) {
        const viralBandY = tubeT + tubeH * 0.39;
        const needleTipX = tubeL + 2;
        const needleFromX = sp.pad - 10;

        // Needle position: enter → stay → withdraw

        if (t < aspirateStart) {

        } else if (t < withdrawStart) {

          // Syringe barrel
          ctx.strokeStyle = colors.border;
          ctx.lineWidth = 1.5;
          ctx.fillStyle = colors.bg;
          const barrelL = Math.min(currentTipX - 18, sp.pad - 6);
          const barrelR = barrelL + 14;
          const barrelT = viralBandY - 6;
          const barrelB = viralBandY + 6;
          ctx.fillRect(barrelL, barrelT, barrelR - barrelL, barrelB - barrelT);
          ctx.strokeRect(barrelL, barrelT, barrelR - barrelL, barrelB - barrelT);

          // Plunger + fluid fill

            const pullProg = Math.min(1, (t - aspirateStart) / (aspirateEnd - aspirateStart));
            const plungerX = barrelL - pullProg * 8;
            ctx.beginPath();
            ctx.moveTo(plungerX, barrelT + 2);
            ctx.lineTo(plungerX, barrelB - 2);

            ctx.beginPath();

            ctx.lineTo(plungerX - 4, viralBandY);

        } else if (t < aspirateEnd) {

            const enzEntryProg = Math.min(1, vnt / 2000);

      // Five-stage Norgen column extraction matching the code:

      //

      const stageT = Math.min(1, (t - stage * S) / S);

      const zoneT = cY + 14;

        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'center';
        ctx.fillText('silica resin', (colL + colR) / 2, colT - 3);

        // Spout
        ctx.strokeStyle = colors.border;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(colL + colW / 2 - 5, colB);
        ctx.lineTo(colL + colW / 2 - 5, colB + 8);
        ctx.moveTo(colL + colW / 2 + 5, colB);
        ctx.lineTo(colL + colW / 2 + 5, colB + 8);
        ctx.stroke();

        // Collection tube
        ctx.strokeStyle = stage >= 4 ? colors.accent + '80' : colors.muted + '30';
        ctx.lineWidth = 1;
        ctx.strokeRect(ctL, ctT, ctR - ctL, ctB - ctT);
        if (stage === 3) {
          ctx.font = '11px -apple-system, sans-serif';
          ctx.fillStyle = colors.textTer;
          ctx.textAlign = 'center';
          ctx.fillText('waste', (ctL + ctR) / 2, ctB + 8);
        } else if (stage >= 4) {
          ctx.font = '11px -apple-system, sans-serif';
          ctx.fillStyle = colors.accent;
          ctx.textAlign = 'center';
          ctx.fillText('collected', (ctL + ctR) / 2, ctB + 8);
        }
      }

      // Particle simulation
      particles.forEach((p, i) => {
        if (!p._colInit) {
          p._colInit = true;
          const pRng = mulberry32(i * 53 + 13);
          // Random position inside column rectangle
          p._homeX = colL + 6 + pRng() * (colW - 12);
          p._homeY = colT + 6 + pRng() * (colH - 12);
          p.x = p._homeX;
          p.y = p._homeY;
          // For viral particles: the DNA fragment released after lysis
          p._dnaX = Math.max(colL + 8, Math.min(colR - 8, p._homeX + (pRng() - 0.5) * 8));
          p._dnaY = Math.max(colT + 6, Math.min(colB - 6, p._homeY + (pRng() - 0.5) * 8));
          // Column bind position
          p._bindX = colL + 8 + pRng() * (colW - 16);
          p._bindY = colT + 6 + pRng() * (colH * 0.8);
          // Size-dependent binding efficiency (larger = better)
          p._viralSize = 3 + pRng() * 4; // matches particle radius
          p._bindEff = 0.6 + 0.4 * Math.min(1, (p._viralSize * 15) / 80);
          // Collection position
          p._collectX = ctL + 4 + pRng() * (ctR - ctL - 8);
          p._collectY = ctT + 4 + pRng() * (ctB - ctT - 8);
          // State flags
          p._lysed = false;
          p._degraded = false;
          p._washed = false;
          // Some contaminants survive (matching ViroForge removal rates)
          // Guarantee 1 bacterium survives to show imperfect purification
          if (!particles._colBacSurv) particles._colBacSurv = 0;
          if (!particles._colHostSurv) particles._colHostSurv = 0;
          const survRoll = pRng();
          if (p.type === 'bacteria') {
            particles._colBacSurv++;
            p._survives = (particles._colBacSurv === 1);
          } else if (p.type === 'host') {
            particles._colHostSurv++;
            p._survives = (particles._colHostSurv === 1);
          } else if (p.type === 'rrna') p._survives = survRoll < 0.15;
          else if (p.type === 'fungal') p._survives = survRoll < 0.10;
          else if (p.type === 'archaeal') p._survives = survRoll < 0.10;
          else p._survives = false;
        }

        let drawIt = true;
        let showBind = false;
        let drawAsDNA = false;

        // DNA strand color per particle type
        const dnaColor = { viral: colors.viral, bacteria: colors.bacteria, host: colors.host, rrna: colors.rrna, fungal: '#8d6e3f', archaeal: '#5a7a3a', host_cell: '#c4707a' }[p.type] || colors.muted;
        const dLen = 10 + p._viralSize * 2;

        if (stage === 0) {
          // LYSE: capsids and some cells break open, releasing DNA
          p.x = Math.max(colL + 4, Math.min(colR - 4, p._homeX + Math.sin(t * 0.005 + i * 0.7) * 2));
          p.y = Math.max(colT + 4, Math.min(colB - 4, p._homeY + Math.cos(t * 0.004 + i * 0.5) * 1.5));

          const shouldLyse = p.type === 'viral' || p._survives;
          if (shouldLyse) {
            const lyseT = Math.max(0, (stageT - 0.2 - (i % 6) * 0.08) / 0.5);
            const lp = Math.min(1, lyseT);
            if (lp > 0) {
              ctx.globalAlpha = Math.max(0, 1 - lp);
              drawParticle(ctx, p, colors);
              ctx.globalAlpha = 1;
              if (lp > 0.3) {
                const dnaAlpha = Math.min(1, (lp - 0.3) / 0.4);
                ctx.globalAlpha = dnaAlpha;
                ctx.strokeStyle = dnaColor;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                for (let s = 0; s < dLen; s++) {
                  const sx = p._dnaX - dLen / 2 + s;
                  const sy = p._dnaY + Math.sin(s * 0.5 + t * 0.02) * 2;
                  if (s === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
                }
                ctx.stroke();
                ctx.globalAlpha = 1;
              }
              drawIt = false;
            }
          }

        } else if (stage === 1) {
          // NUCLEASE: degrades free DNA/rRNA; viral DNA and surviving contaminant DNA persist
          if (p.type === 'viral' || p._survives) {
            // Show as DNA strand, drifting
            ctx.strokeStyle = dnaColor;
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = p.type === 'viral' ? 1 : 0.7;
            ctx.beginPath();
            for (let s = 0; s < dLen; s++) {
              const sx = p._dnaX - dLen / 2 + s + Math.sin(t * 0.003 + i) * 2;
              const sy = p._dnaY + Math.sin(s * 0.5 + t * 0.015) * 2 + Math.cos(t * 0.004 + i * 0.7) * 1;
              if (s === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
            }
            ctx.stroke();
            ctx.globalAlpha = 1;
            drawIt = false;
          } else if (p.type === 'host' || p.type === 'rrna') {
            // Non-surviving free DNA/rRNA: nuclease degrades them
            const degradeT = Math.max(0, (stageT - 0.1 - (i % 5) * 0.1) / 0.6);
            const dp = Math.min(1, degradeT);
            if (dp > 0) {
              ctx.globalAlpha = Math.max(0, 1 - dp);
              const origR = p.r;
              p.r = origR * (1 - dp * 0.7);
              drawParticle(ctx, p, colors);
              p.r = origR;
              ctx.globalAlpha = 1;
              if (dp >= 1) p._degraded = true;
              drawIt = false;
            }
          } else {
            // Non-surviving bacteria/fungal/archaeal: intact cells, nuclease doesn't affect them
            p.x = Math.max(colL + 4, Math.min(colR - 4, p._homeX + Math.sin(t * 0.004 + i) * 1.5));
            p.y = Math.max(colT + 4, Math.min(colB - 4, p._homeY + Math.cos(t * 0.003 + i * 0.5) * 1));
          }

        } else if (stage === 2) {
          // LOAD onto column: viral DNA flows in and binds to resin
          // Bacteria flow through, degraded host/rRNA are gone
          if (p._degraded) { drawIt = false; }
          else if (p.type === 'viral') {
            // DNA moves from sample area into column, binds to resin
            const ease = stageT * stageT * (3 - 2 * stageT);
            const dLen = 10 + p._viralSize * 2;
            const curX = p._dnaX + (p._bindX - p._dnaX) * ease;
            const curY = p._dnaY + (p._bindY - p._dnaY) * ease;
            ctx.strokeStyle = colors.viral;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            const wobble = (1 - ease) * 2;
            for (let s = 0; s < dLen; s++) {
              const sx = curX - dLen / 2 + s;
              const sy = curY + Math.sin(s * 0.5 + t * 0.015) * wobble;
              if (s === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
            }
            ctx.stroke();
            if (ease > 0.8) {
              // Glow ring shows binding
              ctx.strokeStyle = colors.accent + '40';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.arc(curX, curY, dLen / 2 + 3, 0, Math.PI * 2);
              ctx.stroke();
            }
            drawIt = false;
          } else if (p._survives && !p._degraded) {
            // Surviving contaminant DNA binds to resin alongside viral DNA
            const ease = stageT * stageT * (3 - 2 * stageT);
            const curX = p._dnaX + (p._bindX - p._dnaX) * ease;
            const curY = p._dnaY + (p._bindY - p._dnaY) * ease;
            ctx.strokeStyle = dnaColor;
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = 0.7;
            ctx.beginPath();
            const wobble = (1 - ease) * 2;
            for (let s = 0; s < dLen; s++) {
              const sx = curX - dLen / 2 + s;
              const sy = curY + Math.sin(s * 0.5 + t * 0.015) * wobble;
              if (s === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
            }
            ctx.stroke();
            ctx.globalAlpha = 1;
            drawIt = false;
          } else if (p.type === 'bacteria' || p.type === 'fungal' || p.type === 'archaeal') {
            // Non-surviving cells flow through column to bottom
            const ease = stageT * stageT * (3 - 2 * stageT);
            p.x = p._homeX + (colL + colW / 2 - p._homeX) * Math.min(1, ease * 1.5);
            p.y = p._homeY + (colB + 2 - p._homeY) * ease;
            if (ease > 0.9) ctx.globalAlpha = Math.max(0.1, 1 - (ease - 0.9) / 0.1);
          }

        } else if (stage === 3) {
          // WASH: buffer flushes bacteria out, viral DNA stays bound
          if (p._degraded) { drawIt = false; }
          else if (p.type === 'viral') {
            // Bound DNA: gentle wobble on resin
            const dLen = 10 + p._viralSize * 2;
            ctx.strokeStyle = colors.viral;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let s = 0; s < dLen; s++) {
              const sx = p._bindX - dLen / 2 + s;
              const sy = p._bindY + Math.sin(s * 0.5 + t * 0.01) * 0.8;
              if (s === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
            }
            ctx.stroke();
            ctx.strokeStyle = colors.accent + '35';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(p._bindX, p._bindY, dLen / 2 + 3, 0, Math.PI * 2);
            ctx.stroke();
            drawIt = false;
          } else if (p._survives && !p._degraded) {
            // Survivor DNA stays bound on resin
            ctx.strokeStyle = dnaColor;
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = 0.7;
            ctx.beginPath();
            for (let s = 0; s < dLen; s++) {
              const sx = p._bindX - dLen / 2 + s;
              const sy = p._bindY + Math.sin(s * 0.5 + t * 0.01) * 0.8;
              if (s === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
            }
            ctx.stroke();
            ctx.globalAlpha = 1;
            drawIt = false;
          } else {
            // Non-survivors: wash down and out
            if (!p._washed) {
              const wy = colB + 2 + stageT * (ctB - colB);
              p.y = wy;
              p.x = colL + colW / 2 + Math.sin(i) * 6;
              if (stageT > 0.7) {
                ctx.globalAlpha = Math.max(0, 1 - (stageT - 0.7) / 0.3);
                if (stageT > 0.95) p._washed = true;
              }
            }
            if (p._washed) drawIt = false;
          }

        } else if (stage === 4) {
          // ELUTE: elution buffer releases viral DNA from resin → collect
          if (p.type === 'viral') {
            const releaseDelay = (i % 10) * 0.05;
            const localT = Math.max(0, Math.min(1, (stageT - releaseDelay) / (0.7)));
            const ease = localT * localT * (3 - 2 * localT);
            const dLen = 10 + p._viralSize * 2;
            const curX = p._bindX + (p._collectX - p._bindX) * ease;
            const curY = p._bindY + (p._collectY - p._bindY) * ease;

            ctx.strokeStyle = colors.viral;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            const wobble = (1 - ease) * 1.5;
            for (let s = 0; s < dLen; s++) {
              const sx = curX - dLen / 2 + s;
              const sy = curY + Math.sin(s * 0.5 + t * 0.01) * wobble;
              if (s === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
            }
            ctx.stroke();

            if (ease < 0.2) {
              ctx.strokeStyle = colors.accent + '35';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.arc(p._bindX, p._bindY, dLen / 2 + 3, 0, Math.PI * 2);
              ctx.stroke();
            }
            drawIt = false;
          } else if (p._survives && !p._degraded) {
            // Surviving contaminant DNA elutes into collection tube
            const releaseDelay = (i % 10) * 0.05 + 0.1;
            const localT = Math.max(0, Math.min(1, (stageT - releaseDelay) / 0.7));
            const ease = localT * localT * (3 - 2 * localT);
            const curX = p._bindX + (p._collectX - p._bindX) * ease;
            const curY = p._bindY + (p._collectY - p._bindY) * ease;
            ctx.strokeStyle = dnaColor;
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = 0.7;
            ctx.beginPath();
            const wobble = (1 - ease) * 1.5;
            for (let s = 0; s < dLen; s++) {
              const sx = curX - dLen / 2 + s;
              const sy = curY + Math.sin(s * 0.5 + t * 0.01) * wobble;
              if (s === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
            }
            ctx.stroke();
            ctx.globalAlpha = 1;
            drawIt = false;
          } else {
            drawIt = false;
          }

        } else {
          // DONE: viral DNA + surviving contaminants in collection tube
          if (p.type === 'viral') {
            const dLen = 10 + p._viralSize * 2;
            ctx.strokeStyle = colors.viral;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let s = 0; s < dLen; s++) {
              const sx = p._collectX - dLen / 2 + s;
              const sy = p._collectY + Math.sin(s * 0.5) * 0.5;
              if (s === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
            }
            ctx.stroke();
            drawIt = false;
          } else if (p._survives && !p._degraded) {
            // Surviving contaminant DNA in collection tube
            ctx.strokeStyle = dnaColor;
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = 0.7;
            ctx.beginPath();
            for (let s = 0; s < dLen; s++) {
              const sx = p._collectX - dLen / 2 + s;
              const sy = p._collectY + Math.sin(s * 0.5) * 0.5;
              if (s === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
            }
            ctx.stroke();
            ctx.globalAlpha = 1;
            drawIt = false;
          } else {
            drawIt = false;
          }
        }

        if (drawIt) {
          drawParticle(ctx, p, colors);
          ctx.globalAlpha = 1;
        }
      });
    }

    // Inline legend in bottom-left of the lab panel
    drawInlineLegend(ctx, sp.pad + 2, cY + areaH - 16, vlpLegendItems, lW - 4, colors);

    ctx.restore();

    // ===== RIGHT: ViroForge model =====
    ctx.save();
    ctx.beginPath();
    ctx.rect(rX, cY, rW, areaH);
    ctx.clip();

    if (option === 'filtration') {
      // Sigmoid retention curve
      ctx.font = '12px -apple-system, sans-serif';
      ctx.fillStyle = colors.accent;
      ctx.textAlign = 'center';
      ctx.fillText('Sigmoid retention model', rX + rW / 2, cY + 14);

      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.fillText('P(pass) = 1 / (1 + exp(s·(d − pore)))', rX + rW / 2, cY + 30);

      // Plot sigmoid on LOG scale (10 nm – 10,000 nm)
      const plotL = rX + 34, plotR = rX + rW - 10;
      const plotT = cY + 42, plotB = cY + areaH * 0.55;
      const plotW = plotR - plotL, plotH = plotB - plotT;
      const logMin = Math.log10(10), logMax = Math.log10(10000);
      const logRange = logMax - logMin; // 3 decades
      function nmToPx(nm) { return plotL + ((Math.log10(nm) - logMin) / logRange) * plotW; }

      // Axes
      ctx.strokeStyle = colors.border;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(plotL, plotB);
      ctx.lineTo(plotR, plotB);
      ctx.moveTo(plotL, plotT);
      ctx.lineTo(plotL, plotB);
      ctx.stroke();

      // Log-scale tick marks
      ctx.font = '9px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      [10, 100, 1000, 10000].forEach(nm => {
        const tx = nmToPx(nm);
        ctx.beginPath();
        ctx.moveTo(tx, plotB);
        ctx.lineTo(tx, plotB + 4);
        ctx.stroke();
        ctx.fillText(nm >= 1000 ? (nm/1000) + 'µm' : nm + 'nm', tx, plotB + 13);
      });

      // Sigmoid curve
      ctx.beginPath();
      ctx.strokeStyle = colors.accent;
      ctx.lineWidth = 2;
      const pore = 200;
      const s = 0.04;
      for (let px = 0; px < plotW; px++) {
        const logD = logMin + (px / plotW) * logRange;
        const d = Math.pow(10, logD);
        const p = 1 / (1 + Math.exp(s * (d - pore)));
        const y = plotB - p * plotH;
        if (px === 0) ctx.moveTo(plotL + px, y); else ctx.lineTo(plotL + px, y);
      }
      ctx.stroke();
      ctx.lineWidth = 1;

      // Pore size marker
      const porePx = nmToPx(pore);
      ctx.strokeStyle = colors.warm + '80';
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(porePx, plotT);
      ctx.lineTo(porePx, plotB);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.warm;
      ctx.textAlign = 'center';
      ctx.fillText('pore 200nm', porePx, plotB + 24);

      // Axis labels
      ctx.fillStyle = colors.textTer;
      ctx.font = '10px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Particle diameter (log scale)', plotL + plotW / 2, plotB + 35);
      ctx.textAlign = 'right';
      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillText('1.0', plotL - 4, plotT + 5);
      ctx.fillText('0', plotL - 4, plotB + 3);
      // Y-axis label (rotated)
      ctx.save();
      ctx.font = '10px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      ctx.translate(plotL - 18, plotT + plotH / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText('Probability', 0, 0);
      ctx.restore();

      // Size-range shading
      const virusPx0 = nmToPx(20), virusPx1 = nmToPx(300);
      const overlapPx0 = nmToPx(200), overlapPx1 = nmToPx(500);
      const bactPx0 = nmToPx(500), bactPx1 = nmToPx(10000);

      ctx.globalAlpha = 0.45;
      ctx.fillStyle = colors.viral + '20';
      ctx.fillRect(virusPx0, plotT, overlapPx0 - virusPx0, plotH);
      ctx.fillStyle = colors.viral + '12';
      ctx.fillRect(overlapPx0, plotT, overlapPx1 - overlapPx0, plotH);
      ctx.fillStyle = colors.bacteria + '12';
      ctx.fillRect(overlapPx0, plotT, overlapPx1 - overlapPx0, plotH);
      ctx.fillStyle = colors.bacteria + '15';
      ctx.fillRect(bactPx0, plotT, bactPx1 - bactPx0, plotH);
      ctx.globalAlpha = 1;

      // Range labels along top
      ctx.font = '10px -apple-system, sans-serif';
      ctx.fillStyle = colors.viral;
      ctx.textAlign = 'center';
      ctx.fillText('most viruses', (virusPx0 + overlapPx0) / 2, plotT + 10);
      ctx.font = '9px "JetBrains Mono", monospace';
      ctx.fillText('20–300 nm', (virusPx0 + overlapPx0) / 2, plotT + 20);
      ctx.font = '10px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      ctx.fillText('overlap', (overlapPx0 + overlapPx1) / 2, plotT + 10);
      ctx.font = '9px "JetBrains Mono", monospace';
      ctx.fillText('200–500', (overlapPx0 + overlapPx1) / 2, plotT + 20);
      ctx.font = '10px -apple-system, sans-serif';
      ctx.fillStyle = colors.bacteria;
      ctx.textAlign = 'center';
      ctx.fillText('most bacteria', (bactPx0 + bactPx1) / 2, plotT + 10);
      ctx.font = '9px "JetBrains Mono", monospace';
      ctx.fillText('500–10,000 nm', (bactPx0 + bactPx1) / 2, plotT + 20);

      // Description — rendered in HTML overlay for scrolling
      // Position overlay over the right panel description area
      const descOverlay = document.getElementById('desc-overlay');
      if (descOverlay && !descOverlay._filtInit) {
        descOverlay._filtInit = true;
        descOverlay.style.display = 'block';
        descOverlay.innerHTML = `
          <p style="margin:0 0 6px"><b>Model:</b> each particle is assigned a pass probability based on its diameter relative to the filter pore size.</p>
          <p style="margin:0 0 6px">Small viruses (20–150 nm) pass with high probability (~95–99%). Bacteria (>500 nm) are mostly blocked (&lt;1%). Giant viruses and small bacteria in the 200–500 nm overlap zone have intermediate pass rates.</p>
          <p style="margin:0 0 6px"><b>Nuclease step:</b> ViroForge removes a fraction (<code>nuclease_eff</code>, default 98%) of non-viral reads (host DNA, rRNA) that passed the filter, simulating enzymatic digestion of free nucleic acids. Reads from intact viral capsids are retained.</p>
          <div class="desc-label">Default parameters</div>
          <code style="display:block;line-height:1.6">recovery &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= 85%<br>nuclease_eff &nbsp;= 98%<br>pore_size &nbsp;&nbsp;&nbsp;&nbsp;= 0.2 µm (default)<br>pore_options &nbsp;= 0.1, 0.2, 0.45 µm<br>steepness (s) = 0.04</code>
        `;
      }
      if (descOverlay) {
        const _cvs = ctx.canvas;
        const canvasRect = _cvs.getBoundingClientRect();
        const scaleX = canvasRect.width / W;
        const scaleY = canvasRect.height / H;
        const descTop = (plotB + 50) * scaleY;
        const descLeft = (rX + sp.pad) * scaleX;
        const descWidth = (rW - sp.pad * 2) * scaleX;
        const descBottom = canvasRect.height;
        descOverlay.style.top = descTop + 'px';
        descOverlay.style.left = descLeft + 'px';
        descOverlay.style.width = descWidth + 'px';
        descOverlay.style.height = (descBottom - descTop - 4) + 'px';
      }

    } else if (option === 'ultracentrifugation') {
      ctx.font = '12px -apple-system, sans-serif';
      ctx.fillStyle = colors.accent;
      ctx.textAlign = 'center';
      ctx.fillText('Density-based separation', rX + rW / 2, cY + 14);

      // Description in scrollable HTML overlay
      const descOverlay = document.getElementById('desc-overlay');
      if (descOverlay && !descOverlay._ucInit) {
        descOverlay._ucInit = true;
        descOverlay.style.display = 'block';
        descOverlay.innerHTML = `
          <p style="margin:0 0 6px"><b>Model:</b> particles are separated by buoyant density, not size. The sample is layered on a density gradient (e.g. CsCl or iodixanol) and spun at high g-force. Particles migrate to the position matching their density.</p>
          <p style="margin:0 0 6px">Viruses (~1.2–1.5 g/cm³) band at a characteristic density. Bacteria and cellular debris have different densities and sediment to different positions. However, some bacteria overlap the viral density range, so bacterial removal is lower than filtration.</p>
          <p style="margin:0 0 6px"><b>Nuclease step:</b> after collecting the viral band, nuclease treatment degrades any co-purified free DNA/RNA. ViroForge removes a fraction (<code>nuclease_eff</code>) of non-viral reads to simulate this.</p>
          <p style="margin:0 0 6px"><b>Key differences from filtration:</b> no size selectivity — giant and small viruses recover equally. However, bacteria co-sediment more readily, yielding lower contamination reduction overall.</p>
          <div class="desc-label">Default parameters</div>
          <code style="display:block;line-height:1.6">viral_recovery &nbsp;&nbsp;&nbsp;= 90%<br>bacteria_removal &nbsp;= 75%<br>host_dna_removal &nbsp;= 85%<br>rrna_removal &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= 90%<br>nuclease_eff &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= 92%</code>
        `;
      }
      if (descOverlay) {
        const _cvs = ctx.canvas;
        const canvasRect = _cvs.getBoundingClientRect();
        const scaleX = canvasRect.width / W;
        const scaleY = canvasRect.height / H;
        const descTop = (cY + 32) * scaleY;
        const descLeft = (rX + sp.pad) * scaleX;
        const descWidth = (rW - sp.pad * 2) * scaleX;
        const descBottom = canvasRect.height;
        descOverlay.style.top = descTop + 'px';
        descOverlay.style.left = descLeft + 'px';
        descOverlay.style.width = descWidth + 'px';
        descOverlay.style.height = (descBottom - descTop - 4) + 'px';
      }

    } else if (option === 'column') {
      ctx.font = '12px -apple-system, sans-serif';
      ctx.fillStyle = colors.accent;
      ctx.textAlign = 'center';
      ctx.fillText('Size-dependent binding model', rX + rW / 2, cY + 14);

      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.fillText('eff = 0.6 + 0.4 × min(1, d / 80nm)', rX + rW / 2, cY + 30);

      // Plot binding efficiency vs diameter
      const plotL = rX + 34, plotR = rX + rW - 15;
      const plotT = cY + 42, plotB = cY + areaH * 0.5;
      const plotW = plotR - plotL, plotH = plotB - plotT;

      ctx.strokeStyle = colors.border;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(plotL, plotB);
      ctx.lineTo(plotR, plotB);
      ctx.moveTo(plotL, plotT);
      ctx.lineTo(plotL, plotB);
      ctx.stroke();

      ctx.beginPath();
      ctx.strokeStyle = colors.accent;
      ctx.lineWidth = 2;
      for (let px = 0; px < plotW; px++) {
        const d = (px / plotW) * 150;
        const eff = 0.6 + 0.4 * Math.min(1, d / 80);
        const y = plotB - eff * plotH;
        if (px === 0) ctx.moveTo(plotL + px, y); else ctx.lineTo(plotL + px, y);
      }
      ctx.stroke();
      ctx.lineWidth = 1;

      // Saturation marker at 80nm
      const sat80 = plotL + (80 / 150) * plotW;
      ctx.strokeStyle = colors.warm + '60';
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(sat80, plotT);
      ctx.lineTo(sat80, plotB);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      ctx.fillText('Diameter (nm)', plotL + plotW / 2, plotB + 14);
      ctx.fillText('80', sat80, plotB + 24);
      ctx.textAlign = 'right';
      ctx.fillText('1.0', plotL - 3, plotT + 6);
      ctx.fillText('0.6', plotL - 3, plotB - plotH * 0.6 + 3);

      // Description in scrollable HTML overlay
      const descOverlay = document.getElementById('desc-overlay');
      if (descOverlay && !descOverlay._colInit) {
        descOverlay._colInit = true;
        descOverlay.style.display = 'block';
        descOverlay.innerHTML = `
          <p style="margin:0 0 6px"><b>Model:</b> silica-column kits (e.g. Norgen) extract viral DNA through a multi-step process. ViroForge models the net effect of each step as removal/recovery rates applied to genome abundances.</p>
          <p style="margin:0 0 6px"><b>Protocol steps:</b> (1) <b>Lyse</b> — chemical lysis breaks open viral capsids to release genomic DNA. Some bacterial and host cells are also lysed as a side effect (~30%). (2) <b>Nuclease</b> — DNase/RNase degrades free-floating DNA and rRNA in the sample. Viral DNA is protected inside capsids during this step; the nuclease is then heat-inactivated before lysis. (3) <b>Load</b> — the lysate is loaded onto a silica resin column where DNA binds. (4) <b>Wash</b> — buffer flushes unbound debris, intact cells, and proteins. (5) <b>Elute</b> — elution buffer releases the bound DNA for downstream use.</p>
          <p style="margin:0 0 6px"><b>Size-dependent binding:</b> DNA binds to silica resin via electrostatic interactions under high-salt conditions. Longer fragments have more contact points and bind more strongly. ViroForge uses virion diameter as a proxy for genome size: binding efficiency scales from 60% (very small viruses, e.g. circoviruses ~20 nm) to 100% (viruses ≥80 nm). This is the <i>opposite</i> of filtration, where smaller particles pass more easily.</p>
          <p style="margin:0 0 6px"><b>The size-bias trade-off:</b> the same binding physics that loses small viruses also means bacterial DNA binds <i>very</i> efficiently. Bacterial genomes (1–5 Mb) are far larger than most viral genomes (5–200 kb), so when ~30% of bacteria accidentally lyse during sample processing, their long DNA fragments bind the resin at near 100% efficiency. The result: small viruses are underrepresented while bacterial contamination is enriched — column kits have lower viral recovery (70% vs 85% for filtration) and lower bacterial removal (88% vs 95+%).</p>
          <p style="margin:0 0 6px"><b>Imperfect purification:</b> ViroForge models this with per-type removal rates. ~88% of bacterial DNA and ~92% of host DNA is removed, but the remainder co-purifies with viral DNA. This makes column kits generally less clean than filtration-based methods for virome work.</p>
          <div class="desc-label">Default parameters</div>
          <code style="display:block;line-height:1.6">recovery &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= 70%<br>nuclease_eff &nbsp;&nbsp;&nbsp;= 92%<br>bact_removal &nbsp;&nbsp;&nbsp;= 88%<br>host_removal &nbsp;&nbsp;&nbsp;= 92%<br>rrna_removal &nbsp;&nbsp;&nbsp;= 85%<br>binding_min &nbsp;&nbsp;&nbsp;&nbsp;= 0.6 (at d→0)<br>binding_max &nbsp;&nbsp;&nbsp;&nbsp;= 1.0 (at d≥80nm)</code>
        `;
      }
      if (descOverlay) {
        const _cvs = ctx.canvas;
        const canvasRect = _cvs.getBoundingClientRect();
        const scaleX = canvasRect.width / W;
        const scaleY = canvasRect.height / H;
        const descTop = (plotB + 30) * scaleY;
        const descLeft = (rX + sp.pad) * scaleX;
        const descWidth = (rW - sp.pad * 2) * scaleX;
        const descBottom = canvasRect.height;
        descOverlay.style.top = descTop + 'px';
        descOverlay.style.left = descLeft + 'px';
        descOverlay.style.width = descWidth + 'px';
        descOverlay.style.height = (descBottom - descTop - 4) + 'px';
      }
    }
    ctx.restore();

    animFrame = requestAnimationFrame(() => draw(t + 6));
  }
  draw(0);
}

/* === AMPLIFICATION ANIMATION === */
function animateAmplification(option, ctx, W, H, colors) {
  const rng = mulberry32(99);

  if (option === 'none_amp') {
    showLegend([]);
    let t = 0;
    function drawNone() {
      t++;
      ctx.clearRect(0, 0, W, H);
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'center';
      ctx.fillText('No Amplification', W / 2, H * 0.35);
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.fillText('Relative abundances pass through unchanged', W / 2, H * 0.35 + 24);
      ctx.fillText('Used when input DNA is sufficient for direct library prep', W / 2, H * 0.35 + 46);
      animFrame = requestAnimationFrame(drawNone);
    }
    drawNone();
    return;
  }

  showLegend([
    [colors.accent, 'GC content bias'],
    [colors.warm, option === 'rdab' ? 'Length bias (RdAB)' : 'Method-specific effect'],
  ]);

  const gcValues = [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70];

  function calcBias(gc, opt) {
    const optGC = 0.50;
    if (opt === 'mda') return Math.exp(-45 * Math.pow(gc - optGC, 2));
    if (opt === 'rdab') return Math.exp(-Math.pow((gc - optGC) / 0.15, 2) * 1.0);
    return Math.exp(-Math.pow((gc - optGC) / 0.20, 2) * 0.5); // linker
  }

  let t = 0;
  function draw() {
    t++;
    ctx.clearRect(0, 0, W, H);
    const sp = drawSplitPanel(ctx, W, H, colors);
    const lW = sp.midX - sp.pad * 2, rX = sp.midX + sp.pad, rW = W - sp.midX - sp.pad * 2;
    const cY = sp.contentY;
    const areaH = H - cY - 10;

    // ===== LEFT: In the Lab =====
    ctx.save();
    ctx.beginPath();
    ctx.rect(sp.pad, cY, lW, areaH);
    ctx.clip();

    const methodNames = { mda: 'MDA (phi29 polymerase)', rdab: 'RdAB (random priming RT-PCR)', linker: 'Linker Amplification (PCR)' };
    // method name removed — the button label is enough

    if (option === 'mda') {
      // Rolling circle amplification with circular template
      const mdaFrames = 600;
      const mdaProg = Math.min(1, t / mdaFrames);

      // (layout computed in scene sections below)

      // Temperature label
      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.warm;
      ctx.textAlign = 'right';
      ctx.fillText('30°C constant', sp.pad + lW - 4, cY + 14);

      // Step label
      ctx.font = '10px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      if (mdaProg < 0.08) ctx.fillText('Templates: circular (left) vs linear (right)', sp.pad + 2, cY + 14);
      else if (mdaProg < 0.15) ctx.fillText('Random hexamer primers bind both types', sp.pad + 2, cY + 14);
      else if (mdaProg < 0.35) ctx.fillText('Circular: phi29 rolls around; Linear: extends to end', sp.pad + 2, cY + 14);
      else if (mdaProg < 0.50) ctx.fillText('Circular → concatemer; Linear → fragments only', sp.pad + 2, cY + 14);
      else if (mdaProg < 0.65) ctx.fillText('Multiple phi29 copy along the concatemer', sp.pad + 2, cY + 14);
