      else if (mdaProg < 0.80) ctx.fillText('Upstream phi29 displaces downstream copy', sp.pad + 2, cY + 14);
      else ctx.fillText('Displaced copies → new templates → exponential', sp.pad + 2, cY + 14);

      // ==========================================================
      // Two-scene MDA animation:
      //   Scene 1 (top):  Rolling circle — phi29 on circular template
      //   Scene 2 (bottom): Displaced strand as linear → branching
      // ==========================================================

      // Layout: circle on left, linear genome demo on right, scene 2 below
      const circR = Math.min(lW * 0.15, areaH * 0.11);
      const cx = sp.pad + lW * 0.22;
      const sceneGap = 26;
      const circleCY = cY + 28 + circR;
      const linearY = circleCY + circR + sceneGap;

      // Linear genome demo area (right side of scene 1)
      const linDemoL = sp.pad + lW * 0.52;
      const linDemoR = sp.pad + lW - 6;
      const linDemoW = linDemoR - linDemoL;

      // Timeline phases
      const phase1End = 0.45;  // rolling circle phase
      const phase2Start = 0.30; // overlap: linear appears while circle still going
      const circProg = Math.min(1, mdaProg / phase1End);
      const linProg = mdaProg < phase2Start ? 0 : Math.min(1, (mdaProg - phase2Start) / (1 - phase2Start));

      // ---- SCENE 1: Rolling circle (top) ----

      // Scene label
      ctx.font = '9px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      ctx.fillText('① circular genome', sp.pad + 4, circleCY - circR - 3);
      ctx.fillText('① linear genome', linDemoL, circleCY - circR - 3);

      // Template circle (inner strand — always visible)
      ctx.strokeStyle = colors.accent + '55';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(cx, circleCY, circR, 0, Math.PI * 2);
      ctx.stroke();

      // Outer strand (complementary) — fades as displaced
      const primerAngle = -Math.PI * 0.3; // primer at ~11 o'clock
      const extStart = 0.15;
      const extProg = circProg < extStart ? 0 : Math.min(1, (circProg - extStart) / (1 - extStart));
      const arcSwept = extProg * Math.PI * 3.5; // ~1.75 revolutions

      if (circProg < extStart) {
        // Full outer ring before extension starts
        ctx.strokeStyle = colors.accent + '30';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(cx, circleCY, circR + 4, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        // Outer ring: draw only the arc NOT yet displaced
        const dispEnd = primerAngle + arcSwept;
        const remainStart = dispEnd;
        const remainEnd = primerAngle + Math.PI * 2;
        if (remainEnd > remainStart + 0.1) {
          ctx.strokeStyle = colors.accent + '30';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(cx, circleCY, circR + 4, remainStart, remainEnd, false);
          ctx.stroke();
        }
      }
      ctx.lineWidth = 1;

      // "template" label in center
      ctx.font = '8px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      ctx.fillText('template', cx, circleCY + 3);

      // --- Primer 1: lands early, phi29 goes around ---
      const primerX = cx + Math.cos(primerAngle) * (circR + 4);
      const primerY = circleCY + Math.sin(primerAngle) * (circR + 4);
      if (circProg >= 0.06) {
        const pAlpha = Math.min(1, (circProg - 0.06) / 0.06);
        ctx.globalAlpha = pAlpha;
        ctx.fillStyle = colors.warm;
        ctx.beginPath();
        ctx.arc(primerX, primerY, 2.5, 0, Math.PI * 2);
        ctx.fill();
        if (circProg < 0.20) {
          ctx.font = '8px "JetBrains Mono", monospace';
          ctx.fillStyle = colors.warm;
          ctx.textAlign = 'left';
          ctx.fillText('primer', primerX + 5, primerY - 2);
        }
        ctx.globalAlpha = 1;
      }

      // New strand from primer 1 (warm color, inside the ring)
      if (arcSwept > 0.05) {
        ctx.strokeStyle = colors.warm + 'cc';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, circleCY, circR - 3, primerAngle, primerAngle + Math.min(arcSwept, Math.PI * 2), false);
        ctx.stroke();
        ctx.lineWidth = 1;
      }

      // Polymerase 1 dot on the circle
      if (arcSwept > 0.1) {
        const polyAng = primerAngle + arcSwept;
        const polyX = cx + Math.cos(polyAng) * circR;
        const polyY = circleCY + Math.sin(polyAng) * circR;
        ctx.fillStyle = colors.warm;
        ctx.beginPath();
        ctx.arc(polyX, polyY, 3, 0, Math.PI * 2);
        ctx.fill();
        if (circProg < 0.45) {
          ctx.font = '8px "JetBrains Mono", monospace';
          ctx.fillStyle = colors.warm;
          ctx.textAlign = 'left';
          ctx.fillText('phi29', polyX + 5, polyY + 3);
        }
      }

      // --- Primer 2: lands later on the SAME circle ---
      // Shows the template is reused — multiple phi29 simultaneously
      const primer2Angle = primerAngle + Math.PI * 0.8; // opposite-ish side
      const primer2X = cx + Math.cos(primer2Angle) * (circR + 4);
      const primer2Y = circleCY + Math.sin(primer2Angle) * (circR + 4);
      const p2Start = 0.50; // appears halfway through scene 1
      if (circProg >= p2Start) {
        const p2Alpha = Math.min(1, (circProg - p2Start) / 0.08);
        const p2ExtProg = Math.min(1, (circProg - p2Start - 0.08) / (1 - p2Start - 0.08));
        const arc2 = Math.max(0, p2ExtProg) * Math.PI * 1.5;

        // Primer 2 dot
        ctx.globalAlpha = p2Alpha;
        ctx.fillStyle = colors.warm + 'aa';
        ctx.beginPath();
        ctx.arc(primer2X, primer2Y, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        // New strand from primer 2 (slightly different radius to distinguish)
        if (arc2 > 0.05) {
          ctx.strokeStyle = colors.warm + '90';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(cx, circleCY, circR - 6, primer2Angle, primer2Angle + Math.min(arc2, Math.PI * 2), false);
          ctx.stroke();
          ctx.lineWidth = 1;

          // Polymerase 2 dot
          const poly2Ang = primer2Angle + arc2;
          const poly2X = cx + Math.cos(poly2Ang) * circR;
          const poly2Y = circleCY + Math.sin(poly2Ang) * circR;
          ctx.fillStyle = colors.warm + 'aa';
          ctx.beginPath();
          ctx.arc(poly2X, poly2Y, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // "reused continuously" annotation (below circle)
      if (circProg > 0.60) {
        const annAlpha = Math.min(1, (circProg - 0.60) / 0.15);
        ctx.globalAlpha = annAlpha;
        ctx.font = '7px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'center';
        ctx.fillText('→ concatemer (rolling)', cx, circleCY + circR + 10);
        ctx.globalAlpha = 1;
      }

      // ---- LINEAR GENOME demo (right side of scene 1) ----
      // phi29 on a linear template: extends from primer to end, then
      // stops. No rolling circle, no concatemer. Multiple primers create
      // displacement but products are shorter, variable-length fragments.
      {
        const linTplY = circleCY; // align vertically with circle center
        const linExtStart = 0.20;
        const linExtProg = circProg < linExtStart ? 0 : Math.min(1, (circProg - linExtStart) / (0.80));

        // Draw linear template strand
        ctx.strokeStyle = colors.accent + '55';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(linDemoL, linTplY);
        ctx.lineTo(linDemoR, linTplY);
        ctx.stroke();
        ctx.lineWidth = 1;

        // 5'/3' ends
        ctx.font = '7px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.accent + '50';
        ctx.textAlign = 'left';
        ctx.fillText("5'", linDemoL, linTplY - 5);
        ctx.textAlign = 'right';
        ctx.fillText("3'", linDemoR, linTplY - 5);

        // "template" label
        ctx.font = '7px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'center';
        ctx.fillText('linear dsDNA', linDemoL + linDemoW * 0.5, linTplY - 14);

        // Two primers at different positions
        const linPrimers = [
          { frac: 0.25, delay: 0.0, maxFrac: 0.70 },  // extends right, hits end
          { frac: 0.65, delay: 0.15, maxFrac: 0.30 },  // extends right, shorter (hits end)
        ];

        if (circProg >= 0.10) {
          const lpAlpha = Math.min(1, (circProg - 0.10) / 0.06);

          linPrimers.forEach((lp, lpi) => {
            const bindX = linDemoL + linDemoW * lp.frac;

            // Primer dot
            ctx.globalAlpha = lpAlpha;
            ctx.fillStyle = colors.warm;
            ctx.beginPath();
            ctx.arc(bindX, linTplY, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;

            // Extension
            const lpProg = Math.max(0, linExtProg - lp.delay) / (1 - lp.delay);
            if (lpProg > 0) {
              const maxLen = lp.maxFrac * linDemoW;
              const extLen = Math.min(lpProg * 1.3, 1) * maxLen;
              // Clamp to end of template
              const extEndX = Math.min(bindX + extLen, linDemoR);
              const actualLen = extEndX - bindX;

              if (actualLen > 2) {
                // New strand (below template)
                const copyY = linTplY + 5 + lpi * 8;
                ctx.strokeStyle = colors.warm + '75';
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.moveTo(bindX, copyY);
                ctx.lineTo(extEndX, copyY);
                ctx.stroke();
                ctx.lineWidth = 1;

                // Connector
                ctx.strokeStyle = colors.warm + '25';
                ctx.beginPath();
                ctx.moveTo(bindX, linTplY + 2);
                ctx.lineTo(bindX, copyY - 1);
                ctx.stroke();

                // phi29 at tip (or "stopped" at end)
                const atEnd = extEndX >= linDemoR - 2;
                ctx.fillStyle = atEnd ? colors.warm + '50' : colors.warm;
                ctx.beginPath();
                ctx.arc(extEndX, copyY, 2, 0, Math.PI * 2);
                ctx.fill();

                // Label
                if (lpi === 0 && lpProg > 0.1 && lpProg < 0.5) {
                  ctx.font = '7px "JetBrains Mono", monospace';
                  ctx.fillStyle = colors.warm;
                  ctx.textAlign = 'left';
                  ctx.fillText('phi29', extEndX + 3, copyY + 2);
                }

                // "stops at end" label when phi29 reaches the end
                if (lpi === 0 && atEnd) {
                  ctx.font = '7px "JetBrains Mono", monospace';
                  ctx.fillStyle = colors.textTer;
                  ctx.textAlign = 'right';
                  ctx.fillText('stops at end', linDemoR, copyY + 10);
                }
              }
            }
          });
        }

        // Annotation below
        if (circProg > 0.60) {
          const annAlpha2 = Math.min(1, (circProg - 0.60) / 0.15);
          ctx.globalAlpha = annAlpha2;
          ctx.font = '7px "JetBrains Mono", monospace';
          ctx.fillStyle = colors.textTer;
          ctx.textAlign = 'center';
          ctx.fillText('→ fragments only (no rolling)', linDemoL + linDemoW * 0.5, circleCY + circR + 10);
          ctx.globalAlpha = 1;
        }
      }

      // (bridge removed — scene 2 concatemer appears directly below the ② label)

      // ---- SCENE 2: Linear concatemer → copies → displacement → exponential ----
      // 1. Primers bind concatemer, phi29 copies along it
      // 2. Upstream phi29 catches downstream copy → displaces it
      // 3. Displaced fragment becomes a new template
      // 4. New primers bind the displaced fragment → more copies
      // This feedback loop is what makes MDA exponential.
      if (linProg > 0) {
        const linL = sp.pad + 6;
        const linR = sp.pad + lW - 6;
        const linW = linR - linL;
        const rowH = 8;

        // Scene label
        ctx.font = '9px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        ctx.globalAlpha = Math.min(1, linProg * 3);
        ctx.fillText('② copies → displacement → new templates → exponential', sp.pad + 4, linearY);
        ctx.globalAlpha = 1;

        // Concatemer strand sits below the ② label
        const strandY = linearY + 14;

        // Draw the linear concatemer (template, grows L→R)
        const strandLen = Math.min(1, linProg * 1.5) * linW;
        ctx.strokeStyle = colors.accent + '55';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(linL, strandY);
        ctx.lineTo(linL + strandLen, strandY);
        ctx.stroke();
        ctx.lineWidth = 1;

        // Repeat-unit markers
        if (strandLen > 60) {
          const nRepeats = 4;
          const unitW = strandLen / nRepeats;
          ctx.setLineDash([2, 2]);
          ctx.strokeStyle = colors.accent + '30';
          for (let r = 1; r < nRepeats; r++) {
            const rx = linL + unitW * r;
            ctx.beginPath();
            ctx.moveTo(rx, strandY - 4);
            ctx.lineTo(rx, strandY + 4);
            ctx.stroke();
          }
          ctx.setLineDash([]);
        }

        // "concatemer" label
        if (strandLen > 40) {
          ctx.font = '7px "JetBrains Mono", monospace';
          ctx.fillStyle = colors.accent + '45';
          ctx.textAlign = 'left';
          ctx.fillText('concatemer (×N genomes)', linL, strandY - 6);
        }

        // --- Phase A: two phi29 copy along the concatemer ---
        // phi29-A starts at 0.15, goes right → long copy
        // phi29-B starts at 0.50, goes right → shorter copy
        // phi29-A will eventually CATCH UP to phi29-B's copy and displace it
        const copyY = strandY + rowH + 4;
        const phaseA_start = 0.15;
        const pA = linProg < phaseA_start ? 0 : Math.min(1, (linProg - phaseA_start) / (0.50 - phaseA_start));

        // phi29-B (downstream, starts later, shorter)
        const phaseB_start = 0.25;
        const pB = linProg < phaseB_start ? 0 : Math.min(1, (linProg - phaseB_start) / (0.55 - phaseB_start));

        // Positions
        const aBindX = linL + strandLen * 0.12;
        const bBindX = linL + strandLen * 0.48;
        const aMaxLen = strandLen * 0.70;
        const bMaxLen = strandLen * 0.30;

        if (pA > 0 && strandLen > 40) {
          const aLen = Math.min(1, pA * 1.2) * aMaxLen;
          const aEndX = Math.min(aBindX + aLen, linL + strandLen);

          // phi29-A primer
          ctx.fillStyle = colors.warm;
          ctx.beginPath();
          ctx.arc(aBindX, strandY, 2, 0, Math.PI * 2);
          ctx.fill();

          // phi29-A copy strand
          ctx.strokeStyle = colors.warm + '75';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(aBindX, copyY);
          ctx.lineTo(aEndX, copyY);
          ctx.stroke();
          ctx.lineWidth = 1;

          // Connector
          ctx.strokeStyle = colors.warm + '25';
          ctx.beginPath();
          ctx.moveTo(aBindX, strandY + 3);
          ctx.lineTo(aBindX, copyY - 1);
          ctx.stroke();

          // phi29-A dot + arrow at tip
          ctx.fillStyle = colors.warm;
          ctx.beginPath();
          ctx.arc(aEndX, copyY, 2.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(aEndX + 1, copyY);
          ctx.lineTo(aEndX - 3, copyY - 2.5);
          ctx.lineTo(aEndX - 3, copyY + 2.5);
          ctx.closePath();
          ctx.fill();

          // Label
          if (pA > 0.05 && pA < 0.5) {
            ctx.font = '7px "JetBrains Mono", monospace';
            ctx.fillStyle = colors.warm;
            ctx.textAlign = 'left';
            ctx.fillText('phi29-A', aEndX + 5, copyY + 2);
          }
        }

        if (pB > 0 && strandLen > 40) {
          // Has phi29-A caught up to phi29-B's position?
          const aLen = Math.min(1, pA * 1.2) * aMaxLen;
          const aEndX = aBindX + aLen;
          const bLen = Math.min(1, pB * 1.2) * bMaxLen;

          // Displacement check: phi29-A reaches bBindX
          const displaced = aEndX >= bBindX && pA > 0.4;
          const dispProg = displaced ? Math.min(1, (pA - 0.4) / 0.3) : 0;

          // phi29-B primer
          ctx.fillStyle = colors.warm;
          ctx.beginPath();
          ctx.arc(bBindX, strandY, 2, 0, Math.PI * 2);
          ctx.fill();

          if (!displaced) {
            // phi29-B copy strand (still attached to template)
            const bEndX = Math.min(bBindX + bLen, linL + strandLen);
            ctx.strokeStyle = colors.warm + '75';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(bBindX, copyY);
            ctx.lineTo(bEndX, copyY);
            ctx.stroke();
            ctx.lineWidth = 1;

            // Connector
            ctx.strokeStyle = colors.warm + '25';
            ctx.beginPath();
            ctx.moveTo(bBindX, strandY + 3);
            ctx.lineTo(bBindX, copyY - 1);
            ctx.stroke();

            // phi29-B dot
            ctx.fillStyle = colors.warm;
            ctx.beginPath();
            ctx.arc(bEndX, copyY, 2, 0, Math.PI * 2);
            ctx.fill();

            if (pB > 0.05 && pB < 0.5) {
              ctx.font = '7px "JetBrains Mono", monospace';
              ctx.fillStyle = colors.warm;
              ctx.textAlign = 'left';
              ctx.fillText('phi29-B', bEndX + 5, copyY + 2);
            }
          } else {
            // phi29-B's copy is being DISPLACED — it drifts downward
            // and becomes a free fragment (new template)
            const dispY = copyY + dispProg * (rowH * 2 + 4);
            const bFinalLen = bLen; // length at time of displacement
            const bEndX = bBindX + bFinalLen;

            // Displacement annotation
            if (dispProg > 0.1 && dispProg < 0.7) {
              ctx.font = '7px "JetBrains Mono", monospace';
              ctx.fillStyle = colors.textTer;
              ctx.textAlign = 'center';
              const midBX = (bBindX + bEndX) / 2;
              ctx.fillText('displaced!', midBX, copyY + rowH);
              // Arrow pointing down
              ctx.strokeStyle = colors.textTer;
              ctx.beginPath();
              ctx.moveTo(midBX, copyY + rowH + 2);
              ctx.lineTo(midBX, dispY - 3);
              ctx.stroke();
              ctx.beginPath();
              ctx.moveTo(midBX, dispY - 3);
              ctx.lineTo(midBX - 3, dispY - 7);
              ctx.moveTo(midBX, dispY - 3);
              ctx.lineTo(midBX + 3, dispY - 7);
              ctx.stroke();
            }

            // The displaced fragment (now a free-floating template)
            const fragAlpha = Math.min(1, dispProg * 2);
            ctx.globalAlpha = fragAlpha;
            ctx.strokeStyle = colors.warm + '60';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(bBindX, dispY);
            ctx.lineTo(bEndX, dispY);
            ctx.stroke();
            ctx.lineWidth = 1;

            // Label it as "new template"
            if (dispProg > 0.5) {
              ctx.font = '7px "JetBrains Mono", monospace';
              ctx.fillStyle = colors.warm + '80';
              ctx.textAlign = 'left';
              ctx.fillText('→ becomes new template', bEndX + 3, dispY + 3);
            }
            ctx.globalAlpha = 1;

            // --- Phase C: new primers bind the displaced fragment ---
            const phaseC_start = 0.70;
            const pC = linProg < phaseC_start ? 0 : Math.min(1, (linProg - phaseC_start) / (0.30));
            if (pC > 0) {
              const fragLen = bFinalLen;
              const fragY = dispY;
              const subCopyY = fragY + rowH + 2;

              // Two new phi29 on the displaced fragment
              const subCopiers = [
                { frac: 0.20, maxF: 0.65, delay: 0.0 },
                { frac: 0.60, maxF: 0.35, delay: 0.20 },
              ];

              subCopiers.forEach((sc, sci) => {
                const scP = Math.max(0, pC - sc.delay) / (1 - sc.delay);
                if (scP <= 0) return;

                const scBindX = bBindX + fragLen * sc.frac;
                const scMaxLen = fragLen * sc.maxF;
                const scLen = Math.min(1, scP * 1.3) * scMaxLen;
                const scEndX = Math.min(scBindX + scLen, bEndX);
                const scY = subCopyY + sci * rowH;

                // Guard: don't draw outside panel
                if (scY > cY + areaH - 8) return;

                // Primer on displaced fragment
                ctx.fillStyle = colors.warm + '90';
                ctx.beginPath();
                ctx.arc(scBindX, fragY, 1.5, 0, Math.PI * 2);
                ctx.fill();

                if (scLen > 2) {
                  // Copy strand
                  ctx.strokeStyle = colors.warm + (sci === 0 ? '55' : '40');
                  ctx.lineWidth = 1.5;
                  ctx.beginPath();
                  ctx.moveTo(scBindX, scY);
                  ctx.lineTo(scEndX, scY);
                  ctx.stroke();
                  ctx.lineWidth = 1;

                  // Connector
                  ctx.strokeStyle = colors.warm + '15';
                  ctx.beginPath();
                  ctx.moveTo(scBindX, fragY + 2);
                  ctx.lineTo(scBindX, scY - 1);
                  ctx.stroke();

                  // phi29 at tip
                  ctx.fillStyle = colors.warm + '70';
                  ctx.beginPath();
                  ctx.arc(scEndX, scY, 1.5, 0, Math.PI * 2);
                  ctx.fill();

                  // Label
                  if (sci === 0 && scP > 0.15 && scP < 0.6) {
                    ctx.font = '7px "JetBrains Mono", monospace';
                    ctx.fillStyle = colors.warm;
                    ctx.textAlign = 'left';
                    ctx.fillText('phi29', scEndX + 3, scY + 2);
                  }
                }
              });

              // "each copy → new template → exponential" annotation + coverage note
              if (pC > 0.5) {
                const annAlpha = Math.min(1, (pC - 0.5) / 0.3);
                ctx.globalAlpha = annAlpha;
                ctx.font = '7px "JetBrains Mono", monospace';
                ctx.fillStyle = colors.textTer;
                ctx.textAlign = 'left';
                const annY = subCopyY + rowH + rowH + 2;
                if (annY < cY + areaH - 4) {
                  ctx.fillText('each copy can be displaced → becomes template → ...', sp.pad + 8, annY);
                }
                if (annY + 10 < cY + areaH - 4) {
                  ctx.fillText('→ exponential amplification from one circular template', sp.pad + 8, annY + 10);
                }
                if (annY + 24 < cY + areaH - 4) {
                  ctx.fillText('products are variable-length fragments (most ≠ full genome)', sp.pad + 8, annY + 24);
                }
                if (annY + 34 < cY + areaH - 4) {
                  ctx.fillText('regions with more primer binding → most amplified', sp.pad + 8, annY + 34);
                }
                if (annY + 44 < cY + areaH - 4) {
                  ctx.fillText('→ uneven coverage (GC-biased primer binding)', sp.pad + 8, annY + 44);
                }
                if (annY + 58 < cY + areaH - 4) {
                  ctx.fillText('concatemer junction reads help circularize assemblies', sp.pad + 8, annY + 58);
                }
                if (annY + 68 < cY + areaH - 4) {
                  ctx.fillText('but ~15% chimeras (phi29 jumps between genomes)', sp.pad + 8, annY + 68);
                }
                if (annY + 78 < cY + areaH - 4) {
                  ctx.fillText('→ chimeras cause misassembly, not junction reads', sp.pad + 8, annY + 78);
                }
                ctx.globalAlpha = 1;
              }
            }
          }
        }
      }

      // Key properties omitted — covered by the HTML overlay description

    } else if (option === 'rdab') {
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      // subtitle removed — button label is enough

      // RdAB: 3-step process
      // 1. Random primers bind RNA → reverse transcriptase makes cDNA
      // 2. Sequenase makes second strand → double-stranded DNA
      // 3. PCR amplifies (40 cycles) with length + GC bias

      const rdabFrames = 1200; // ~20s total
      const rdabProg = Math.min(1, t / rdabFrames);

      const strandL = 16, strandR = sp.pad + lW - 8;
      const strandW = strandR - strandL;

      // --- Timeline ---
      // 0.00-0.30  Step 1: random primers + RT → cDNA
      // 0.30-0.50  Step 2: second-strand synthesis → dsDNA
      // 0.50-1.00  Step 3: PCR cycles (shows 3 cycles with doubling)

      // Step label
      ctx.font = '10px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      if (rdabProg < 0.30) ctx.fillText('Step 1: Random primers + RT (works on both RNA and DNA)', strandL, cY + 14);
      else if (rdabProg < 0.50) ctx.fillText('Step 2: Sequenase → all fragments become dsDNA', strandL, cY + 14);
      else ctx.fillText('Step 3: PCR amplification (40 cycles)', strandL, cY + 14);

      // Use areaH to lay out proportionally — no overlaps
      // Region breakdown:
      //   0%-5%   step label (already drawn above at cY+14)
      //   8%-40%  animation area (RNA/cDNA/dsDNA or PCR copies)
      //   42%-55% secondary labels (cDNA label, Sequenase, or length bias)
      //   60%-100% bullet points

      const animTop = cY + areaH * 0.10;  // where animation starts
      const animMid = cY + areaH * 0.30;  // midpoint for secondary elements
      const labelY  = cY + areaH * 0.48;  // where secondary labels go
      const propTop = cY + areaH * 0.58;  // where bullet points start

      // === STEPS 1-2: split layout — RNA (left) and DNA (right) ===
      const halfW = strandW * 0.46;
      const rnaL = strandL, rnaR = strandL + halfW;
      const dnaL = strandL + strandW * 0.54, dnaR = strandR;
      const dnaW = dnaR - dnaL;

      const rnaPrimers = [
        { pos: 0.04, maxLen: 0.18 },
        { pos: 0.28, maxLen: 0.35 },
        { pos: 0.70, maxLen: 0.10 },
        { pos: 0.84, maxLen: 0.14 },
      ];
      const dnaPrimers = [
        { pos: 0.06, maxLen: 0.30 },
        { pos: 0.42, maxLen: 0.12 },
        { pos: 0.60, maxLen: 0.24 },
        { pos: 0.90, maxLen: 0.08 },
      ];

      if (rdabProg < 0.50) {
        // --- RNA template (left) — wavy line ---
        ctx.strokeStyle = '#c06040';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        for (let px = 0; px <= halfW; px += 1) {
          const y = animTop + Math.sin(px * 0.10) * 2.5;
          if (px === 0) ctx.moveTo(rnaL + px, y); else ctx.lineTo(rnaL + px, y);
        }
        ctx.stroke();
        ctx.lineWidth = 1;
        ctx.font = '9px "JetBrains Mono", monospace';
        ctx.fillStyle = '#c06040';
        ctx.textAlign = 'left';
        ctx.fillText('① RNA template', rnaL, animTop - 7);

        // --- DNA template (right) — straight double line ---
        ctx.strokeStyle = colors.accent;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(dnaL, animTop - 1); ctx.lineTo(dnaR, animTop - 1);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(dnaL, animTop + 3); ctx.lineTo(dnaR, animTop + 3);
        ctx.stroke();
        ctx.lineWidth = 1;
        ctx.font = '9px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.accent;
        ctx.textAlign = 'left';
        ctx.fillText('① DNA template', dnaL, animTop - 7);
      }

      if (rdabProg < 0.30) {
        const rtProg = rdabProg / 0.30;

        // --- RNA side: primers + RT → cDNA ---
        rnaPrimers.forEach((pr, pi) => {
          const px = rnaL + pr.pos * halfW;
          const primerAppear = Math.min(1, rtProg * 5 - pi * 0.5);
          if (primerAppear <= 0) return;
          ctx.globalAlpha = Math.min(1, primerAppear);
          ctx.fillStyle = colors.warm;
          ctx.fillRect(px, animTop + 8, 6, 2);
          const extProg = Math.max(0, Math.min(1, (rtProg - 0.25 - pi * 0.10) / 0.5));
          if (extProg > 0) {
            const fragLen = extProg * (pr.maxLen * halfW);
            ctx.fillStyle = colors.accent;
            ctx.fillRect(px, animTop + 14, fragLen, 2);
            ctx.fillStyle = colors.warm;
            ctx.beginPath();
            ctx.arc(px + fragLen, animTop + 15, 2.5, 0, Math.PI * 2);
            ctx.fill();
            if (pi === 0 && extProg > 0.2) {
              ctx.font = '8px "JetBrains Mono", monospace';
              ctx.fillStyle = colors.warm;
              ctx.textAlign = 'left';
              ctx.fillText('RT', px + fragLen + 4, animTop + 18);
            }
          }
          ctx.globalAlpha = 1;
        });

        // --- DNA side: primers + RT → complementary DNA ---
        dnaPrimers.forEach((pr, pi) => {
          const px = dnaL + pr.pos * dnaW;
          const primerAppear = Math.min(1, rtProg * 5 - pi * 0.5);
          if (primerAppear <= 0) return;
          ctx.globalAlpha = Math.min(1, primerAppear);
          ctx.fillStyle = colors.warm;
          ctx.fillRect(px, animTop + 8, 6, 2);
          const extProg = Math.max(0, Math.min(1, (rtProg - 0.25 - pi * 0.10) / 0.5));
          if (extProg > 0) {
            const fragLen = extProg * (pr.maxLen * dnaW);
            ctx.fillStyle = colors.accent;
            ctx.fillRect(px, animTop + 14, fragLen, 2);
            ctx.fillStyle = colors.warm;
            ctx.beginPath();
            ctx.arc(px + fragLen, animTop + 15, 2.5, 0, Math.PI * 2);
            ctx.fill();
            if (pi === 0 && extProg > 0.2) {
              ctx.font = '8px "JetBrains Mono", monospace';
              ctx.fillStyle = colors.warm;
              ctx.textAlign = 'left';
              ctx.fillText('RT', px + fragLen + 4, animTop + 18);
            }
          }
          ctx.globalAlpha = 1;
        });

        ctx.font = '8px "JetBrains Mono", monospace';
        ctx.textAlign = 'left';
        if (rtProg > 0.4) {
          ctx.fillStyle = colors.accent;
          ctx.fillText('→ cDNA', rnaL, labelY);
          ctx.fillText('→ complementary DNA', dnaL, labelY);
        }

      } else if (rdabProg < 0.50) {
        // === STEP 2: Second-strand synthesis (both sides) ===
        const ssProg = (rdabProg - 0.30) / 0.20;

        // --- RNA side: cDNA + Sequenase makes second strand ---
        rnaPrimers.forEach((pr) => {
          const px = rnaL + pr.pos * halfW;
          const fragLen = pr.maxLen * halfW;
          ctx.fillStyle = colors.accent;
          ctx.fillRect(px, animTop + 14, fragLen, 2);
          const secLen = ssProg * fragLen;
          ctx.fillStyle = colors.accent + '60';
          ctx.fillRect(px, animTop + 20, secLen, 2);
          if (secLen > 4) {
            ctx.fillStyle = '#6a9';
            ctx.beginPath();
            ctx.arc(px + secLen, animTop + 21, 2, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        // --- DNA side: complementary strand + Sequenase ---
        dnaPrimers.forEach((pr) => {
          const px = dnaL + pr.pos * dnaW;
          const fragLen = pr.maxLen * dnaW;
          ctx.fillStyle = colors.accent;
          ctx.fillRect(px, animTop + 14, fragLen, 2);
          const secLen = ssProg * fragLen;
          ctx.fillStyle = colors.accent + '60';
          ctx.fillRect(px, animTop + 20, secLen, 2);
          if (secLen > 4) {
            ctx.fillStyle = '#6a9';
            ctx.beginPath();
            ctx.arc(px + secLen, animTop + 21, 2, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        ctx.font = '8px "JetBrains Mono", monospace';
        ctx.fillStyle = '#6a9';
        ctx.textAlign = 'right';
        if (ssProg > 0.2) ctx.fillText('Sequenase', strandR, labelY);
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        ctx.fillText('→ all dsDNA', strandL, labelY);
        ctx.textAlign = 'center';
        ctx.fillStyle = colors.textTer;
        ctx.fillText('both → dsDNA fragments → PCR', strandL + strandW / 2, labelY + 10);

      } else {
        // === STEP 3: PCR amplification ===
        const pcrProg = (rdabProg - 0.50) / 0.50;
        const pcrCycleFrames = 0.33;
        const pcrCycleNum = Math.min(3, Math.floor(pcrProg / pcrCycleFrames));
        const pcrCycleT = Math.min(1, (pcrProg - pcrCycleNum * pcrCycleFrames) / pcrCycleFrames);

        const fragments = [
          { x: 0.05, w: 0.12, label: 'short' },
          { x: 0.25, w: 0.20, label: 'medium' },
          { x: 0.55, w: 0.35, label: 'long' },
        ];

        // Fragment labels
        fragments.forEach((frag) => {
          const fx = strandL + frag.x * strandW;
          const fw = frag.w * strandW;
          ctx.font = '8px "JetBrains Mono", monospace';
          ctx.fillStyle = colors.textTer;
          ctx.textAlign = 'center';
          ctx.fillText(frag.label, fx + fw / 2, animTop - 2);
        });

        // Copies stacking — use space from animTop to labelY
        const copyAreaH = labelY - animTop - 10;
        const copyRowH = Math.max(5, copyAreaH / 8);

        fragments.forEach((frag, fi) => {
          const fx = strandL + frag.x * strandW;
          const fw = frag.w * strandW;
          const lengthFactor = fi === 0 ? 1.5 : fi === 1 ? 1.0 : 0.6;
          const totalCopies = Math.floor(Math.pow(2, pcrCycleNum) * lengthFactor);
          const maxDraw = Math.min(totalCopies, Math.floor(copyAreaH / copyRowH));

          for (let c = 0; c < maxDraw; c++) {
            const cy = animTop + 4 + c * copyRowH;
            const alpha = Math.max(25, 80 - c * 8);
            const prevCopies = Math.floor(Math.pow(2, Math.max(0, pcrCycleNum - 1)) * lengthFactor);
            const isNew = c >= Math.min(prevCopies, maxDraw);
            let drawAlpha = alpha;
            if (isNew && pcrCycleNum > 0) {
              drawAlpha = Math.floor(alpha * Math.min(1, pcrCycleT * 2));
            }
            ctx.fillStyle = colors.accent + drawAlpha.toString(16).padStart(2, '0');
            ctx.fillRect(fx, cy, fw, 2);
            ctx.fillStyle = colors.accent + Math.floor(drawAlpha * 0.6).toString(16).padStart(2, '0');
            ctx.fillRect(fx, cy + 2.5, fw, 2);
          }

          ctx.font = '8px "JetBrains Mono", monospace';
          ctx.fillStyle = colors.textTer;
          ctx.textAlign = 'center';
          ctx.fillText(totalCopies + '×', fx + fw / 2, labelY - 2);
        });

        // Length bias label
        ctx.font = '9px -apple-system, sans-serif';
        ctx.fillStyle = colors.warm;
        ctx.textAlign = 'center';
        ctx.fillText('← shorter = more copies (length bias) →', strandL + strandW / 2, labelY + 10);
      }

      // Key properties — anchored to bottom
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      const props = [
        'Random primers → RT → Sequenase → PCR',
        'Length bias: shorter fragments amplified more',
        'GC bias similar to MDA',
      ];
      props.forEach((p, i) => {
        ctx.fillText('• ' + p, sp.pad, propTop + i * 16);
      });

    } else { // linker
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      // subtitle removed — button label is enough

      // PCR cycle animation: shows 4 cycles, each with
      // denature (strands separate) → anneal (primers bind) → extend (new strand grows)
      // then the count doubles
      const cycleFrames = 480; // ~8s per cycle
      const totalCycles = 4;
      const cycleNum = Math.min(totalCycles, Math.floor(t / cycleFrames));
      const cycleT = Math.min(1, (t - cycleNum * cycleFrames) / cycleFrames);

      // How many completed molecules exist
      const completedCount = Math.pow(2, cycleNum);

      // Layout
      const strandL = 16, strandR = sp.pad + lW - 8;
      const strandW = strandR - strandL;
      const adpW = strandW * 0.06; // adapter/linker region

      // Current cycle substep:
      //   0.00-0.15  denature (95°C — strands separate)
      //   0.15-0.35  anneal (55°C — primers bind to ends)
      //   0.35-0.85  extend (72°C — polymerase copies each strand)
      //   0.85-1.00  pause — show the doubled result

      // Stage label
      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'left';
      if (cycleNum < totalCycles) {
        let stepLabel = '';
        if (cycleT < 0.15) stepLabel = '95°C  Denature (separate strands)';
        else if (cycleT < 0.35) stepLabel = '55°C  Anneal (primers bind)';
        else if (cycleT < 0.85) stepLabel = '72°C  Extend (copy strands)';
        else stepLabel = 'Cycle ' + (cycleNum + 1) + ' complete → ' + (completedCount * 2) + ' copies';
        ctx.fillText(stepLabel, sp.pad, cY + 44);
      } else {
        ctx.fillText('After ' + totalCycles + ' cycles: ' + completedCount + ' copies', sp.pad, cY + 44);
      }

      // Draw current cycle's DNA
      const dnaY = cY + 58;
      const gap = 4; // gap between strands when denatured

      if (cycleNum < totalCycles) {
        // Top strand (template, forward)
        // Bottom strand (template, reverse)
        let topY = dnaY;
        let botY = dnaY + 6;

        if (cycleT < 0.15) {
          // DENATURE: strands separate vertically
          const sep = (cycleT / 0.15);
          topY = dnaY - sep * gap;
          botY = dnaY + 6 + sep * gap;
        } else {
          topY = dnaY - gap;
          botY = dnaY + 6 + gap;
        }

        // Draw top strand
        ctx.fillStyle = colors.accent;
        ctx.fillRect(strandL, topY, strandW, 3);
        // Draw bottom strand
        ctx.fillStyle = colors.accent + '80';
        ctx.fillRect(strandL, botY, strandW, 3);

        // Adapters/linkers at ends
        ctx.fillStyle = colors.warm + '60';
        ctx.fillRect(strandL, topY - 1, adpW, 5);
        ctx.fillRect(strandR - adpW, topY - 1, adpW, 5);
        ctx.fillRect(strandL, botY - 1, adpW, 5);
        ctx.fillRect(strandR - adpW, botY - 1, adpW, 5);

        if (cycleT >= 0.15 && cycleT < 0.35) {
          // ANNEAL: primers bind ON the adapter regions
          const primerAlpha = Math.min(1, (cycleT - 0.15) / 0.1);
          ctx.globalAlpha = primerAlpha;
          ctx.fillStyle = colors.warm;
          // Primer on bottom strand's left adapter (will extend rightward)
          ctx.fillRect(strandL, botY + 5, adpW, 2);
          // Primer on top strand's right adapter (will extend leftward)
          ctx.fillRect(strandR - adpW, topY - 4, adpW, 2);
          // Labels
          ctx.font = '11px "JetBrains Mono", monospace';
          ctx.fillStyle = colors.warm;
          ctx.textAlign = 'left';
          ctx.fillText('primer', strandL + adpW + 4, botY + 8);
          ctx.textAlign = 'right';
          ctx.fillText('primer', strandR - adpW - 4, topY - 1);
          ctx.globalAlpha = 1;
        }

        if (cycleT >= 0.35 && cycleT < 0.85) {
          // EXTEND: new complementary strand grows from primer (which sits on adapter)
          const extProg = (cycleT - 0.35) / 0.5;
          const extLen = extProg * (strandW - adpW);

          // Primer on bottom strand's left adapter
          ctx.fillStyle = colors.warm;
          ctx.fillRect(strandL, botY + 5, adpW, 2);
          // New strand growing rightward from that primer
          ctx.fillStyle = colors.accent + '50';
          ctx.fillRect(strandL + adpW, botY + 5, extLen, 2);
          // Polymerase dot at extending end
          ctx.fillStyle = colors.warm;
          ctx.beginPath();
          ctx.arc(strandL + adpW + extLen, botY + 6, 3, 0, Math.PI * 2);
          ctx.fill();

          // Primer on top strand's right adapter
          ctx.fillStyle = colors.warm;
          ctx.fillRect(strandR - adpW, topY - 4, adpW, 2);
          // New strand growing leftward from that primer
          ctx.fillStyle = colors.accent + '50';
          const revStart = strandR - adpW - extLen;
          ctx.fillRect(revStart, topY - 4, extLen, 2);
          // Polymerase dot
          ctx.fillStyle = colors.warm;
          ctx.beginPath();
          ctx.arc(revStart, topY - 3, 3, 0, Math.PI * 2);
          ctx.fill();
        }

        if (cycleT >= 0.85) {
          // COMPLETE: show both new strands fully formed
          // Completed new strands span from adapter to far end
          ctx.fillStyle = colors.warm;
          ctx.fillRect(strandL, botY + 5, adpW, 2);
          ctx.fillRect(strandR - adpW, topY - 4, adpW, 2);
          ctx.fillStyle = colors.accent + '50';
          ctx.fillRect(strandL + adpW, botY + 5, strandW - adpW, 2);
          ctx.fillRect(strandL, topY - 4, strandW - adpW, 2);
        }
      }

      // Show accumulated copies below the active cycle
      const countY = dnaY + 32;
      const maxShow = Math.min(completedCount, 8);
      const rowH = 7;
      for (let c = 0; c < maxShow; c++) {
        const ry = countY + c * rowH;
        if (ry > cY + areaH - 30) break;
        const alpha = Math.max(20, 70 - c * 8);
        ctx.fillStyle = colors.accent + alpha.toString(16).padStart(2, '0');
        ctx.fillRect(strandL, ry, strandW, 3);
        // Linker adapters
        ctx.fillStyle = colors.warm + (Math.floor(alpha * 0.5)).toString(16).padStart(2, '0');
        ctx.fillRect(strandL, ry, adpW, 3);
        ctx.fillRect(strandR - adpW, ry, adpW, 3);
      }
      if (completedCount > 0) {
        ctx.font = '11px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        ctx.fillText(completedCount + ' copies so far', strandL, countY + Math.min(maxShow, 6) * rowH + 12);
      }

      // Key properties below
      const propY = countY + Math.min(maxShow, 6) * rowH + 26;
      if (propY < cY + areaH - 10) {
        ctx.font = '11px -apple-system, sans-serif';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        const props = [
          'Mildest GC bias of the three',
          'No length bias (all have adapters)',
        ];
        props.forEach((p, i) => {
          if (propY + i * 18 < cY + areaH - 2)
            ctx.fillText('• ' + p, sp.pad, propY + i * 18);
        });
      }
    }
    ctx.restore();

    // ===== RIGHT: ViroForge model =====
    ctx.save();
    ctx.beginPath();
    ctx.rect(rX, cY, rW, areaH);
    ctx.clip();

    // Right panel layout — proportional zones to prevent overlaps
    // Zone 1: 0-12%   title + formula
    // Zone 2: 14-50%  GC bias plot (shorter for rdab to fit length plot)
    // Zone 3: 52-100% params (mda/linker) or length bias plot (rdab)
    const rZone1 = cY + areaH * 0.00;
    const rZone2T = cY + areaH * 0.14;
    const rZone2B = cY + areaH * (option === 'rdab' ? 0.46 : 0.55);
    const rZone3T = cY + areaH * (option === 'rdab' ? 0.50 : 0.58);
    const rZone3B = cY + areaH * 0.97;

    // Title + formula
    ctx.font = '12px -apple-system, sans-serif';
    ctx.fillStyle = colors.accent;
    ctx.textAlign = 'center';
    ctx.fillText('GC Efficiency Model', rX + rW / 2, rZone1 + 14);

    const formulas = {
      mda: 'exp(−45 × (GC − 0.50)²)',
      rdab: 'exp(−(GC−0.50)² / 0.15² )',
      linker: 'exp(−(GC−0.50)² / (2×0.20²))',
    };
    ctx.font = '11px "JetBrains Mono", monospace';
    ctx.fillStyle = colors.textTer;
    ctx.fillText(formulas[option] || '', rX + rW / 2, rZone1 + 28);

    // GC bias plot
    const plotL = rX + 30, plotR = rX + rW - 10;
    const plotT = rZone2T + 6, plotB = rZone2B - 22;
    const plotW = plotR - plotL, plotH = plotB - plotT;

    // Axes
    ctx.strokeStyle = colors.border;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(plotL, plotB);
    ctx.lineTo(plotR, plotB);
    ctx.moveTo(plotL, plotT);
    ctx.lineTo(plotL, plotB);
    ctx.stroke();

    // GC bias curve
    ctx.beginPath();
    ctx.strokeStyle = colors.accent;
    ctx.lineWidth = 2;
    for (let px = 0; px < plotW; px++) {
      const gc = 0.25 + (px / plotW) * 0.50;
      const bias = calcBias(gc, option);
      const y = plotB - bias * (plotH - 6);
      if (px === 0) ctx.moveTo(plotL + px, y); else ctx.lineTo(plotL + px, y);
    }
    ctx.stroke();
    ctx.lineWidth = 1;

    // Bar chart on top of curve
    const barW = Math.min(12, plotW / gcValues.length - 3);
    const barProg = Math.min(1, t / 80);
    gcValues.forEach((gc, i) => {
      const bias = calcBias(gc, option);
      const bx = plotL + ((gc - 0.25) / 0.50) * plotW;
      const bh = bias * (plotH - 6) * barProg;
      ctx.fillStyle = colors.accent + '50';
      ctx.fillRect(bx - barW / 2, plotB - bh, barW, bh);
    });

    // Axis labels
    ctx.font = '10px "JetBrains Mono", monospace';
    ctx.fillStyle = colors.textTer;
    ctx.textAlign = 'center';
    [30, 40, 50, 60, 70].forEach(gc => {
      const px = plotL + ((gc / 100 - 0.25) / 0.50) * plotW;
      ctx.fillText(gc + '%', px, plotB + 10);
    });
    ctx.fillText('GC Content', plotL + plotW / 2, plotB + 20);
    ctx.textAlign = 'right';
    ctx.fillText('1.0', plotL - 3, plotT + 5);
    ctx.fillText('0', plotL - 3, plotB + 3);

    // Optimum marker
    const opt50 = plotL + (0.50 - 0.25) / 0.50 * plotW;
    ctx.strokeStyle = colors.warm + '60';
    ctx.setLineDash([2, 2]);
    ctx.beginPath();
    ctx.moveTo(opt50, plotT);
    ctx.lineTo(opt50, plotB);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '10px "JetBrains Mono", monospace';
    ctx.fillStyle = colors.warm;
    ctx.textAlign = 'center';
    ctx.fillText('optimum', opt50, plotT - 4);

    if (option === 'rdab') {
      // Length bias plot in zone 3 (compact)
      const lPlotT = rZone3T + 14;
      const lPlotB = rZone3T + (rZone3B - rZone3T) * 0.45;
      const lPlotH = lPlotB - lPlotT;

      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.warm;
      ctx.textAlign = 'center';
      ctx.fillText('Length Bias (RdAB only)', rX + rW / 2, rZone3T + 2);
      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.fillText('exp(−0.015 × length_kb)', rX + rW / 2, rZone3T + 14);

      // Axes
      ctx.strokeStyle = colors.border;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(plotL, lPlotB);
      ctx.lineTo(plotR, lPlotB);
      ctx.moveTo(plotL, lPlotT + 6);
      ctx.lineTo(plotL, lPlotB);
      ctx.stroke();

      // Decay curve
      ctx.beginPath();
      ctx.strokeStyle = colors.warm;
      ctx.lineWidth = 2;
      for (let px = 0; px < plotW; px++) {
        const kb = (px / plotW) * 160;
        const eff = Math.exp(-0.015 * kb);
        const y = lPlotB - eff * (lPlotH - 10);
        if (px === 0) ctx.moveTo(plotL + px, y); else ctx.lineTo(plotL + px, y);
      }
      ctx.stroke();
      ctx.lineWidth = 1;

      // Key length markers
      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      [5, 20, 50, 100, 150].forEach(kb => {
        const px = plotL + (kb / 160) * plotW;
        ctx.fillText(kb + 'kb', px, lPlotB + 10);
        const eff = Math.exp(-0.015 * kb);
        ctx.fillStyle = colors.warm;
        ctx.fillText((eff * 100).toFixed(0) + '%', px, lPlotB - eff * (lPlotH - 10) - 4);
        ctx.fillStyle = colors.textTer;
      });

      // RdAB description overlay
      const descOverlay = document.getElementById('desc-overlay');
      if (descOverlay && !descOverlay._rdabInit) {
        descOverlay._rdabInit = true;
        descOverlay._mdaInit = false;
        descOverlay._linkerInit = false;
        descOverlay.style.display = 'block';
        descOverlay.innerHTML = `
          <p style="margin:0 0 6px"><b>RdAB (Random amplification + dsDNA synthesis + PCR)</b> is the most common amplification method for viral metagenomics, especially RNA viromes. It combines random reverse transcription, second-strand synthesis with Sequenase, and PCR amplification.</p>
          <p style="margin:0 0 6px"><b>How it works:</b> random hexamer primers bind throughout the template. Reverse transcriptase creates first-strand cDNA (for RNA) or copies (for DNA). Sequenase synthesizes the second strand, then PCR amplifies all products over 30–45 cycles using the random primers.</p>
          <p style="margin:0 0 6px"><b>GC bias (moderate):</b> PCR efficiency peaks at ~50% GC and drops at both extremes. Low GC (< 30%) means weak primer binding; high GC (> 70%) causes secondary structures that block the polymerase. With 40 cycles, this bias compounds — a 30% GC genome can be suppressed 5–50× relative to a 50% GC genome.</p>
          <p style="margin:0 0 6px"><b>Length bias (unique to RdAB):</b> shorter genomes amplify exponentially faster because random primers complete extension more often per cycle. A 5 kb genome retains ~93% efficiency per cycle, while a 100 kb genome drops to ~22%. Over 40 cycles this creates massive enrichment of small viruses at the expense of large ones.</p>
          <div class="desc-label">Default parameters</div>
          <code style="display:block;line-height:1.6">cycles &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= 40<br>gc_bias_strength &nbsp;= 1.0<br>gc_optimum &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= 50%<br>gc_tolerance &nbsp;&nbsp;&nbsp;= 0.15<br>length_decay &nbsp;&nbsp;&nbsp;= 0.015 per kb<br>no chimeras<br>no stochasticity</code>
        `;
      }
      if (descOverlay) {
        const _cvs = ctx.canvas;
        const canvasRect = _cvs.getBoundingClientRect();
        const scaleX = canvasRect.width / W;
        const scaleY = canvasRect.height / H;
        const descTop = (lPlotB + 16) * scaleY;
        const descLeft = (rX + sp.pad) * scaleX;
        const descWidth = (rW - sp.pad * 2) * scaleX;
        const descBottom = canvasRect.height;
        descOverlay.style.top = descTop + 'px';
        descOverlay.style.left = descLeft + 'px';
        descOverlay.style.width = descWidth + 'px';
        descOverlay.style.height = (descBottom - descTop - 4) + 'px';
      }
    } else {
      // Description in scrollable HTML overlay for MDA and Linker
      const descOverlay = document.getElementById('desc-overlay');
      if (option === 'mda') {
        if (descOverlay && !descOverlay._mdaInit) {
          descOverlay._mdaInit = true;
          descOverlay._linkerInit = false;
          descOverlay._rdabInit = false;
          descOverlay.style.display = 'block';
          descOverlay.innerHTML = `
            <p style="margin:0 0 6px"><b>MDA (Multiple Displacement Amplification)</b> uses φ29 polymerase for isothermal whole-genome amplification. It is designed for low-biomass samples where input DNA is insufficient for standard library prep (e.g. environmental viromes, single-cell genomics).</p>
            <p style="margin:0 0 6px"><b>How it works:</b> random hexamer primers bind throughout the template DNA. φ29 polymerase extends from each primer while displacing downstream strands, creating a branching network of copies. No thermal cycling is needed — the reaction runs at 30°C for 2–16 hours.</p>
            <p style="margin:0 0 6px"><b>GC bias (strongest of the three):</b> φ29 polymerase struggles with extreme GC content. AT-rich regions (< 30% GC) have low melting temperatures and poor primer binding. GC-rich regions (> 70%) form secondary structures that stall the polymerase. Peak efficiency is at ~50% GC. A genome at 30% GC can be suppressed 10–1000× relative to a 50% GC genome.</p>
            <p style="margin:0 0 6px"><b>Stochasticity:</b> MDA is highly stochastic — some templates randomly dominate due to early priming events. This is modeled as log-normal multiplicative noise (CV = 0.30), meaning replicate amplifications of the same sample can yield very different abundance profiles.</p>
            <p style="margin:0 0 6px"><b>Chimeras:</b> during strand displacement, the polymerase can jump between templates, creating chimeric products (~15% of reads). These look like real sequences but combine fragments from different genomes, confounding assembly.</p>
            <div class="desc-label">Default parameters</div>
            <code style="display:block;line-height:1.6">duration &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= 4 hours<br>gc_bias_strength = 3.0 (vs 1.0 for RdAB)<br>gc_optimum &nbsp;&nbsp;&nbsp;&nbsp;= 50%<br>stochasticity &nbsp;= 0.30 (CV)<br>chimera_rate &nbsp;&nbsp;= 15%<br>no length bias</code>
          `;
        }
      } else {
        if (descOverlay && !descOverlay._linkerInit) {
          descOverlay._linkerInit = true;
          descOverlay._mdaInit = false;
          descOverlay._rdabInit = false;
          descOverlay.style.display = 'block';
          descOverlay.innerHTML = `
            <p style="margin:0 0 6px"><b>Linker amplification (adapter ligation + PCR)</b> is the standard approach for modern Illumina library prep (TruSeq, Nextera). Adapters are ligated to all DNA fragments before amplification, then PCR enriches only adapter-bearing fragments.</p>
            <p style="margin:0 0 6px"><b>How it works:</b> DNA is fragmented (enzymatically or by sonication), end-repaired, A-tailed, and ligated to sequencing adapters. PCR then amplifies all adapter-ligated fragments using adapter-specific primers. Because every fragment carries the same adapters, there is no length-dependent priming advantage — unlike RdAB, where random primers favour shorter templates.</p>
            <p style="margin:0 0 6px"><b>GC bias (mildest):</b> PCR still has some GC bias because denaturation and annealing efficiency depend on GC content, but it is weaker than RdAB or MDA. The GC tolerance is wider (σ = 0.20 vs 0.15 for RdAB) and fewer cycles (typically 10–25 vs 40 for RdAB) means the bias compounds less.</p>
            <p style="margin:0 0 6px"><b>No length bias:</b> since all fragments carry adapters, the polymerase extends each one equally regardless of template length. This is the key advantage over RdAB, where shorter genomes amplify exponentially faster.</p>
            <p style="margin:0 0 6px"><b>When to use:</b> linker amplification is the default choice when input DNA is sufficient (≥1 ng). It produces the most representative abundance profiles of the three methods. Use MDA only when input is too low, or RdAB when working with RNA viromes that require reverse transcription first.</p>
            <div class="desc-label">Default parameters</div>
            <code style="display:block;line-height:1.6">cycles &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= 20<br>gc_bias_strength = 0.5 (vs 1.0 for RdAB)<br>gc_optimum &nbsp;&nbsp;&nbsp;&nbsp;= 50%<br>gc_tolerance &nbsp;&nbsp;= 0.20 (wider than RdAB 0.15)<br>no length bias<br>no chimeras<br>no stochasticity</code>
          `;
        }
      }
      if (descOverlay) {
        const _cvs = ctx.canvas;
        const canvasRect = _cvs.getBoundingClientRect();
        const scaleX = canvasRect.width / W;
        const scaleY = canvasRect.height / H;
        const descTop = rZone3T * scaleY;
        const descLeft = (rX + sp.pad) * scaleX;
        const descWidth = (rW - sp.pad * 2) * scaleX;
        const descBottom = canvasRect.height;
        descOverlay.style.top = descTop + 'px';
        descOverlay.style.left = descLeft + 'px';
        descOverlay.style.width = descWidth + 'px';
        descOverlay.style.height = (descBottom - descTop - 4) + 'px';
      }
    }
    ctx.restore();

    animFrame = requestAnimationFrame(draw);
  }
  draw();
}

/* === SEQUENCING ANIMATION === */
function animateSequencing(option, ctx, W, H, colors) {
  const rng = mulberry32(77);
  let t = 0;
  showLegend([]);

  function draw() {
    t++;
    ctx.clearRect(0, 0, W, H);
    const sp = drawSplitPanel(ctx, W, H, colors);
    const lW = sp.midX - sp.pad * 2, rX = sp.midX + sp.pad, rW = W - sp.midX - sp.pad * 2;
    const cY = sp.contentY;
    const areaH = H - cY - 10;
    const progress = Math.min(1, t / (option === 'pacbio' ? 7200 : option === 'nanopore' ? 300 : 3600));

    // ===== LEFT: In the Lab =====
    ctx.save();
    ctx.beginPath();
    ctx.rect(sp.pad, cY, lW, areaH);
    ctx.clip();

    if (option === 'novaseq' || option === 'miseq') {
      const cfg = option === 'novaseq'
        ? { label: 'NovaSeq 6000', readLen: 150, insert: 350 }
        : { label: 'MiSeq', readLen: 250, insert: 450 };

      // Timeline:
      // 0.00-0.30  Library prep (fragmentation → size selection → adapter ligation)
      // 0.30-1.00  SBS sequencing
      const libPhase = progress < 0.30;
      const libProg = Math.min(1, progress / 0.30);
      const sbsProg = libPhase ? 0 : Math.min(1, (progress - 0.30) / 0.70);

      // Phase label
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'center';
      if (libPhase) {
        ctx.fillText('Library Preparation', sp.pad + lW / 2, cY + 12);
      } else {
        ctx.fillText(cfg.label + ' — Sequencing by Synthesis (SBS)', sp.pad + lW / 2, cY + 12);
      }

      const fragL = sp.pad + 4, fragR = sp.pad + lW - 12;
      const fragW = fragR - fragL;
      const adpW = fragW * 0.07;

      if (libPhase) {
        // === LIBRARY PREP ANIMATION ===
        // Phase A (0-0.30): Long DNA strand
        // Phase B (0.30-0.55): Fragmentation — breaks into pieces
        // Phase C (0.55-0.75): Size selection — keep target size, discard rest
        // Phase D (0.75-1.00): Adapter ligation — P5/P7 attach

        const longY = cY + areaH * 0.10;

        if (libProg < 0.30) {
          // --- Long DNA strand ---
          ctx.font = '9px -apple-system, sans-serif';
          ctx.fillStyle = colors.textTer;
          ctx.textAlign = 'left';
          ctx.fillText('Amplified DNA (~5–50 kb)', fragL, longY - 6);

          ctx.strokeStyle = colors.accent;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(fragL, longY + 4); ctx.lineTo(fragR, longY + 4);
          ctx.stroke();
          ctx.strokeStyle = colors.accent + '60';
          ctx.beginPath();
          ctx.moveTo(fragL, longY + 8); ctx.lineTo(fragR, longY + 8);
          ctx.stroke();

          // Step label
          ctx.font = '10px -apple-system, sans-serif';
          ctx.fillStyle = colors.textSec;
          ctx.textAlign = 'left';
          ctx.fillText('① Fragmentation (sonication or enzymatic)', fragL, cY + areaH * 0.28);

          ctx.font = '9px -apple-system, sans-serif';
          ctx.fillStyle = colors.textTer;
          ctx.fillText('Break long DNA into short random pieces', fragL + 10, cY + areaH * 0.34);

        } else if (libProg < 0.55) {
          // --- Fragmentation — pieces flying apart ---
          const fragProg = (libProg - 0.30) / 0.25;
          ctx.font = '9px -apple-system, sans-serif';
          ctx.fillStyle = colors.textTer;
          ctx.textAlign = 'left';
          ctx.fillText('Fragmentation', fragL, longY - 6);

          const pieces = [
            { x: 0.00, w: 0.08 }, { x: 0.10, w: 0.18 },
            { x: 0.30, w: 0.05 }, { x: 0.37, w: 0.15 },
            { x: 0.54, w: 0.03 }, { x: 0.59, w: 0.12 },
            { x: 0.73, w: 0.10 }, { x: 0.85, w: 0.06 },
            { x: 0.93, w: 0.07 },
          ];
          pieces.forEach((p, i) => {
            const drift = fragProg * (i % 2 === 0 ? 1 : -1) * 4;
            const px = fragL + p.x * fragW;
            const pw = p.w * fragW;
            ctx.fillStyle = colors.accent + '80';
            ctx.fillRect(px, longY + 4 + drift, pw, 3);
            ctx.fillStyle = colors.accent + '40';
            ctx.fillRect(px, longY + 8 + drift, pw, 3);
          });

          ctx.font = '10px -apple-system, sans-serif';
          ctx.fillStyle = colors.textSec;
          ctx.textAlign = 'left';
          ctx.fillText('② Size selection (bead-based or gel)', fragL, cY + areaH * 0.28);
          ctx.font = '9px -apple-system, sans-serif';
          ctx.fillStyle = colors.textTer;
          ctx.fillText('Keep ~' + cfg.insert + ' bp fragments, discard too short/long', fragL + 10, cY + areaH * 0.34);

        } else if (libProg < 0.75) {
          // --- Size selection — some fade, target size stays ---
          const selProg = (libProg - 0.55) / 0.20;
          ctx.font = '9px -apple-system, sans-serif';
          ctx.fillStyle = colors.textTer;
          ctx.textAlign = 'left';
          ctx.fillText('Size selection → ~' + cfg.insert + ' bp', fragL, longY - 6);

          const selPieces = [
            { x: 0.05, w: 0.08, keep: false },
            { x: 0.16, w: 0.18, keep: true },
            { x: 0.38, w: 0.04, keep: false },
            { x: 0.45, w: 0.16, keep: true },
            { x: 0.64, w: 0.03, keep: false },
            { x: 0.70, w: 0.14, keep: true },
            { x: 0.88, w: 0.05, keep: false },
          ];
          selPieces.forEach(p => {
            const alpha = p.keep ? '90' : Math.max(5, Math.floor(90 * (1 - selProg))).toString(16).padStart(2, '0');
            const yOff = p.keep ? 0 : selProg * 14;
            ctx.fillStyle = colors.accent + alpha;
            ctx.fillRect(fragL + p.x * fragW, longY + 4 + yOff, p.w * fragW, 3);
            ctx.fillStyle = colors.accent + (p.keep ? '50' : Math.max(5, Math.floor(50 * (1 - selProg))).toString(16).padStart(2, '0'));
            ctx.fillRect(fragL + p.x * fragW, longY + 8 + yOff, p.w * fragW, 3);
          });

          // Discarded label
          if (selProg > 0.5) {
            ctx.font = '7px "JetBrains Mono", monospace';
            ctx.fillStyle = colors.textTer + '60';
            ctx.textAlign = 'center';
            ctx.fillText('discarded', fragL + 0.07 * fragW, longY + 26);
            ctx.fillText('discarded', fragL + 0.64 * fragW, longY + 26);
          }

          ctx.font = '10px -apple-system, sans-serif';
          ctx.fillStyle = colors.textSec;
          ctx.textAlign = 'left';
          ctx.fillText('③ Adapter ligation', fragL, cY + areaH * 0.28);
          ctx.font = '9px -apple-system, sans-serif';
          ctx.fillStyle = colors.textTer;
          ctx.fillText('Ligate P5 and P7 adapters to fragment ends', fragL + 10, cY + areaH * 0.34);

        } else {
          // --- Adapter ligation — P5/P7 attach to selected fragments ---
          const ligProg = (libProg - 0.75) / 0.25;
          ctx.font = '9px -apple-system, sans-serif';
          ctx.fillStyle = colors.textTer;
          ctx.textAlign = 'left';
          ctx.fillText('Adapter ligation', fragL, longY - 6);

          const kept = [
            { x: 0.16, w: 0.18 },
            { x: 0.45, w: 0.16 },
            { x: 0.70, w: 0.14 },
          ];
          kept.forEach(p => {
            const px = fragL + p.x * fragW;
            const pw = p.w * fragW;
            // Insert
            ctx.fillStyle = colors.accent + '80';
            ctx.fillRect(px, longY + 4, pw, 3);
            ctx.fillStyle = colors.accent + '40';
            ctx.fillRect(px, longY + 8, pw, 3);

            // Adapters sliding in
            const adW = Math.max(4, pw * 0.15);
            const slideIn = Math.min(1, ligProg * 2);
            ctx.globalAlpha = slideIn;
            ctx.fillStyle = colors.warm + '80';
            ctx.fillRect(px - adW * slideIn, longY + 3, adW * slideIn, 9);
            ctx.fillRect(px + pw, longY + 3, adW * slideIn, 9);
            ctx.globalAlpha = 1;
          });

          // P5/P7 labels
          if (ligProg > 0.5) {
            ctx.font = '7px "JetBrains Mono", monospace';
            ctx.fillStyle = colors.warm;
            ctx.textAlign = 'center';
            ctx.fillText('P5', fragL + 0.16 * fragW - 6, longY + 20);
            ctx.fillText('P7', fragL + (0.16 + 0.18) * fragW + 6, longY + 20);
          }

          ctx.font = '10px -apple-system, sans-serif';
          ctx.fillStyle = colors.textSec;
          ctx.textAlign = 'left';
          ctx.fillText('→ Library ready for sequencing', fragL, cY + areaH * 0.28);
          ctx.font = '9px -apple-system, sans-serif';
          ctx.fillStyle = colors.textTer;
          ctx.fillText('Each fragment: P5 — insert (~' + cfg.insert + ' bp) — P7', fragL + 10, cY + areaH * 0.34);
        }

        // Library prep step summary (bottom)
        const sumY = cY + areaH * 0.44;
        ctx.font = '9px -apple-system, sans-serif';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        const prepSteps = [
          { text: '① Fragment long DNA', done: libProg > 0.30 },
          { text: '② Size-select ~' + cfg.insert + ' bp', done: libProg > 0.55 },
          { text: '③ Ligate P5/P7 adapters', done: libProg > 0.75 },
          { text: '④ Load onto flow cell → SBS', done: false },
        ];
        prepSteps.forEach((s, i) => {
          ctx.fillStyle = s.done ? colors.accent : colors.textTer;
          ctx.fillText((s.done ? '✓ ' : '  ') + s.text, fragL, sumY + i * 14);
        });

      } else {
        // === SBS SEQUENCING (existing content, using sbsProg) ===

        // --- DNA fragment with adapters ---
        const fragY = cY + areaH * 0.09;

        // Adapter P5
        ctx.fillStyle = colors.warm + '70';
        ctx.fillRect(fragL, fragY, adpW, 10);
        ctx.font = '7px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.warm;
        ctx.textAlign = 'center';
        ctx.fillText('P5', fragL + adpW / 2, fragY + 18);

        // Insert
        ctx.fillStyle = colors.muted + '25';
        ctx.fillRect(fragL + adpW, fragY, fragW - adpW * 2, 10);

        // Adapter P7
        ctx.fillStyle = colors.warm + '70';
        ctx.fillRect(fragR - adpW, fragY, adpW, 10);
        ctx.font = '7px "JetBrains Mono", monospace';
        ctx.fillText('P7', fragR - adpW / 2, fragY + 18);

        // Insert size bracket
        ctx.strokeStyle = colors.textTer;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(fragL + adpW, fragY - 3);
        ctx.lineTo(fragL + adpW, fragY - 8);
        ctx.lineTo(fragR - adpW, fragY - 8);
        ctx.lineTo(fragR - adpW, fragY - 3);
        ctx.stroke();
        ctx.font = '9px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'center';
        ctx.fillText('insert ~' + cfg.insert + ' bp', (fragL + fragR) / 2, fragY - 10);

        // --- R1 and R2 read arrows ---
        const readFrac = cfg.readLen / cfg.insert;
        const r1W = (fragW - adpW * 2) * readFrac;
        const rProg = Math.min(1, sbsProg * 2.5);
        const r1Y = fragY + 26;

        // R1 (forward)
        ctx.fillStyle = colors.accent;
        ctx.fillRect(fragL + adpW, r1Y, r1W * rProg, 5);
        if (rProg > 0.15) {
          const arrowX = fragL + adpW + r1W * rProg;
          ctx.beginPath();
          ctx.moveTo(arrowX, r1Y - 1);
          ctx.lineTo(arrowX + 4, r1Y + 2.5);
          ctx.lineTo(arrowX, r1Y + 6);
          ctx.fill();
        }

        // R2 (reverse)
        ctx.fillStyle = colors.accent + 'A0';
        const r2Start = fragR - adpW - r1W * rProg;
        ctx.fillRect(r2Start, r1Y + 12, r1W * rProg, 5);
        if (rProg > 0.15) {
          ctx.beginPath();
          ctx.moveTo(r2Start, r1Y + 12 - 1);
          ctx.lineTo(r2Start - 4, r1Y + 12 + 2.5);
          ctx.lineTo(r2Start, r1Y + 12 + 6);
          ctx.fill();
        }

        if (rProg > 0.3) {
          ctx.font = '9px "JetBrains Mono", monospace';
          ctx.fillStyle = colors.accent;
          ctx.textAlign = 'left';
          ctx.fillText('R1 →  ' + cfg.readLen + ' bp', fragL + adpW, r1Y - 3);
          ctx.textAlign = 'right';
          ctx.fillStyle = colors.accent + 'A0';
          ctx.fillText(cfg.readLen + ' bp  ← R2', fragR - adpW, r1Y + 12 + 14);
        }

        // --- SBS cycle diagram ---
        const cycY = cY + areaH * 0.42;
        ctx.font = '10px -apple-system, sans-serif';
        ctx.fillStyle = colors.textSec;
        ctx.textAlign = 'left';
        ctx.fillText('Sequencing by synthesis cycle:', sp.pad + 4, cycY);

        const cycSteps = [
          'Fluorescent dNTPs flood the flow cell',
          'One complementary base incorporates (3\' block)',
          'Laser excites → camera images each cluster',
          'Cleave terminator + fluorophore → next cycle',
        ];
        const cycLineH = Math.min(14, areaH * 0.04);
        cycSteps.forEach((text, i) => {
          const sy = cycY + 14 + i * cycLineH;
          ctx.fillStyle = colors.text;
          ctx.beginPath();
          ctx.arc(sp.pad + 9, sy - 3, 2.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.font = '9px -apple-system, sans-serif';
          ctx.fillStyle = colors.textTer;
          ctx.textAlign = 'left';
          ctx.fillText(text, sp.pad + 18, sy);
        });

        // --- Quality degradation note ---
        const qNoteY = cY + areaH * 0.65;
        ctx.font = '10px -apple-system, sans-serif';
        ctx.fillStyle = colors.textSec;
        ctx.textAlign = 'left';
        ctx.fillText('Quality over read length:', sp.pad + 4, qNoteY);

        // Mini quality curve on left panel
        const qH = Math.min(24, areaH * 0.10);
        const qTop = qNoteY + 8;
        const qL = sp.pad + 28, qR = sp.pad + lW - 12;
        const qW = qR - qL;
        const qB = qTop + qH;

        ctx.strokeStyle = colors.border;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(qL, qB); ctx.lineTo(qR, qB);
        ctx.moveTo(qL, qTop); ctx.lineTo(qL, qB);
        ctx.stroke();

        if (option === 'novaseq') {
          const bins = [
            { from: 0.00, to: 0.35, q: 37 },
            { from: 0.35, to: 0.60, q: 32 },
            { from: 0.60, to: 0.85, q: 24 },
            { from: 0.85, to: 1.00, q: 12 },
          ];
          ctx.setLineDash([2, 3]);
          ctx.strokeStyle = colors.muted + '30';
          ctx.lineWidth = 0.5;
          bins.forEach(b => {
            const y = qB - (b.q / 42) * qH;
            ctx.beginPath();
            ctx.moveTo(qL, y); ctx.lineTo(qR, y);
            ctx.stroke();
          });
          ctx.setLineDash([]);

          ctx.beginPath();
          ctx.strokeStyle = colors.accent;
          ctx.lineWidth = 2;
          bins.forEach((b, i) => {
            const x0 = qL + b.from * qW, x1 = qL + b.to * qW;
            const y = qB - (b.q / 42) * qH;
            if (i === 0) ctx.moveTo(x0, y);
            else ctx.lineTo(x0, y);
            ctx.lineTo(x1, y);
          });
          ctx.stroke();

          ctx.font = '7px "JetBrains Mono", monospace';
          ctx.fillStyle = colors.textTer;
          ctx.textAlign = 'left';
          bins.forEach(b => {
            const y = qB - (b.q / 42) * qH;
            ctx.fillText('Q' + b.q, qR + 3, y + 3);
          });
        } else {
          ctx.beginPath();
          ctx.strokeStyle = colors.accent;
          ctx.lineWidth = 1.5;
          for (let px = 0; px < qW; px++) {
            const pos = px / qW;
            const q = 36 - pos * 14 - pos * pos * 4;
            const y = qB - (Math.max(8, q) / 42) * qH;
            if (px === 0) ctx.moveTo(qL + px, y); else ctx.lineTo(qL + px, y);
          }
          ctx.stroke();
        }

        ctx.font = '8px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'right';
        ctx.fillText('Q36', qL - 2, qTop + 4);
        ctx.fillText('Q10', qL - 2, qB - 1);
        ctx.textAlign = 'left';
        ctx.fillText('5\'', qL, qB + 8);
        ctx.textAlign = 'right';
        ctx.fillText('3\'', qR, qB + 8);

        // Annotations
        const annY = qB + 16;
        ctx.font = '9px -apple-system, sans-serif';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        if (option === 'novaseq') {
          ctx.fillText('• Signal decays → Q drops near 3\' end', sp.pad + 4, annY);
          ctx.fillStyle = colors.warm;
          ctx.fillText('• NovaSeq bins Q scores (4 bins, not continuous)', sp.pad + 4, annY + 12);
          ctx.fillStyle = colors.textTer;
          ctx.fillText('• Patterned flow cell → lower duplicate rate', sp.pad + 4, annY + 24);
        } else {
          ctx.fillText('• Signal decays → Q drops near 3\' end', sp.pad + 4, annY);
          ctx.fillText('• MiSeq: full Q score spectrum (not binned)', sp.pad + 4, annY + 12);
          ctx.fillText('• Lower throughput but longer reads (2×250)', sp.pad + 4, annY + 24);
        }
      }

    } else if (option === 'pacbio') {
      // Timeline:
      // 0.00–0.25  Library prep (long DNA → fragmentation → size selection)
      // 0.25–0.42  SMRTbell construction (hairpin ligation → circular molecule)
      // 0.42–1.00  CCS (polymerase circling + subreads + consensus)
      const pbLibPhase = progress < 0.25;
      const pbLibProg = Math.min(1, progress / 0.25);
      const pbBellPhase = progress >= 0.25 && progress < 0.42;
      const pbBellProg = Math.min(1, (progress - 0.25) / 0.17);
      const pbCcsPhase = progress >= 0.42;
      const pbCcsProg = Math.min(1, (progress - 0.42) / 0.58);

      // Title
      ctx.font = '11px -apple-system, sans-serif';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'center';
      if (pbLibPhase) {
        ctx.fillText('Library Preparation (PacBio HiFi)', sp.pad + lW / 2, cY + 12);
      } else if (pbBellPhase) {
        ctx.fillText('SMRTbell Construction', sp.pad + lW / 2, cY + 12);
      } else {
        ctx.fillText('PacBio HiFi — Circular Consensus Sequencing', sp.pad + lW / 2, cY + 12);
      }

      const fragL = sp.pad + 4, fragR = sp.pad + lW - 12;
      const fragW = fragR - fragL;

      // --- Progress checklist (vertical, like Illumina) ---
      const checkY = cY + areaH - 74;
      ctx.font = '9px -apple-system, sans-serif';
      ctx.textAlign = 'left';
      const pbSteps = [
        { text: '① Extract genomic DNA', done: progress > 0 },
        { text: '② Fragment / shear (~15 kb)', done: pbLibProg > 0.35 },
        { text: '③ Size-select target range', done: pbLibProg > 0.65 },
        { text: '④ Ligate hairpin adapters → SMRTbell', done: pbBellProg > 0.5 },
        { text: '⑤ Load into ZMW → CCS', done: pbCcsPhase },
      ];
      pbSteps.forEach((s, i) => {
        ctx.fillStyle = s.done ? colors.accent : colors.textTer;
        ctx.fillText((s.done ? '✓ ' : '  ') + s.text, sp.pad, checkY + i * 14);
      });

      if (pbLibPhase) {
        // === LIBRARY PREP ===
        // Phase A (0–0.30): Long DNA strand
        // Phase B (0.30–0.55): Fragmentation — shear into pieces
        // Phase C (0.55–0.80): Size selection — keep ~15 kb pieces
        // Phase D (0.80–1.00): Show selected fragment ready for ligation

        const pbFragPieces = [
          { start: 0.00, len: 0.08 },
          { start: 0.08, len: 0.18 },
          { start: 0.26, len: 0.05 },
          { start: 0.31, len: 0.15 },
          { start: 0.46, len: 0.03 },
          { start: 0.49, len: 0.16 },
          { start: 0.65, len: 0.04 },
          { start: 0.69, len: 0.14 },
          { start: 0.83, len: 0.06 },
          { start: 0.89, len: 0.11 },
        ];
        const pbTarget = [1, 3, 5, 7];

        if (pbLibProg < 0.30) {
          // Phase A: long DNA
          const strandY = cY + areaH * 0.35;
          ctx.font = '10px -apple-system, sans-serif';
          ctx.fillStyle = colors.textTer;
          ctx.textAlign = 'left';
          ctx.fillText('Genomic DNA (~50 kb phage genome)', sp.pad, strandY - 14);

          ctx.strokeStyle = colors.accent;
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(fragL, strandY);
          ctx.lineTo(fragR, strandY);
          ctx.stroke();
          ctx.strokeStyle = colors.warm;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(fragL, strandY + 4);
          ctx.lineTo(fragR, strandY + 4);
          ctx.stroke();

        } else if (pbLibProg < 0.55) {
          // Phase B: Fragmentation
          const bProg = (pbLibProg - 0.30) / 0.25;
          const strandY = cY + areaH * 0.25;

          ctx.font = '10px -apple-system, sans-serif';
          ctx.fillStyle = colors.textTer;
          ctx.textAlign = 'left';
          ctx.fillText('Shearing into ~10–25 kb fragments', sp.pad, strandY - 14);

          pbFragPieces.forEach((p, i) => {
            const x0 = fragL + p.start * fragW;
            const w = p.len * fragW;
            const drift = bProg * (i - 4.5) * 3;
            const yOff = bProg * ((i % 3) - 1) * 12;
            ctx.strokeStyle = colors.accent;
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x0 + drift, strandY + yOff);
            ctx.lineTo(x0 + w - 1 + drift, strandY + yOff);
            ctx.stroke();
            ctx.strokeStyle = colors.warm;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(x0 + drift, strandY + 4 + yOff);
            ctx.lineTo(x0 + w - 1 + drift, strandY + 4 + yOff);
            ctx.stroke();
          });

          if (bProg > 0.5) {
            ctx.font = '9px -apple-system, sans-serif';
            ctx.fillStyle = colors.textTer;
            ctx.textAlign = 'left';
            ctx.fillText('Fragments vary in size — need to select ~15 kb range', sp.pad, cY + areaH * 0.55);
          }

        } else if (pbLibProg < 0.80) {
          // Phase C: Size selection
          const cProg = (pbLibProg - 0.55) / 0.25;
          const strandY = cY + areaH * 0.25;

          ctx.font = '10px -apple-system, sans-serif';
          ctx.fillStyle = colors.textTer;
          ctx.textAlign = 'left';
          ctx.fillText('Size selection (~10–25 kb target)', sp.pad, strandY - 14);

          pbFragPieces.forEach((p, i) => {
            const isTarget = pbTarget.includes(i);
            const x0 = fragL + p.start * fragW;
            const w = p.len * fragW;
            const drift = (i - 4.5) * 3;
            const yOff = ((i % 3) - 1) * 12;
            const fade = !isTarget ? Math.min(1, cProg * 2) : 0;

            ctx.globalAlpha = 1 - fade * 0.75;
            ctx.strokeStyle = isTarget ? colors.accent : colors.muted;
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x0 + drift, strandY + yOff);
            ctx.lineTo(x0 + w - 1 + drift, strandY + yOff);
            ctx.stroke();
            ctx.strokeStyle = isTarget ? colors.warm : colors.muted + '80';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(x0 + drift, strandY + 4 + yOff);
            ctx.lineTo(x0 + w - 1 + drift, strandY + 4 + yOff);
            ctx.stroke();
            ctx.globalAlpha = 1;

            if (!isTarget && cProg > 0.4) {
              ctx.font = '7px "JetBrains Mono", monospace';
              ctx.fillStyle = colors.muted;
              ctx.textAlign = 'center';
              ctx.fillText(p.len < 0.06 ? 'too short' : 'too short', x0 + w / 2 + drift, strandY + yOff - 6);
            }
          });

          if (cProg > 0.6) {
            ctx.font = '9px -apple-system, sans-serif';
            ctx.fillStyle = colors.accent;
            ctx.textAlign = 'left';
            ctx.fillText('4 fragments in target range → proceed to ligation', sp.pad, cY + areaH * 0.60);
          }

        } else {
          // Phase D: Selected fragment ready
          const strandY = cY + areaH * 0.35;
          const dProg = (pbLibProg - 0.80) / 0.20;

          ctx.font = '10px -apple-system, sans-serif';
          ctx.fillStyle = colors.textTer;
          ctx.textAlign = 'left';
