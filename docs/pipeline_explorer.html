      let legX = 10;
      ctx.font = '11px -apple-system, sans-serif';
      cats.forEach(([label, key]) => {
        ctx.fillStyle = catColors[key];
        ctx.fillRect(legX, legY - 8, 10, 10);
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        ctx.fillText(label, legX + 14, legY);
        legX += ctx.measureText(label).width + 28;
      });

      // Detail panel on the right
      if (detailOpen) {
        detailAnim = Math.min(1, detailAnim + 0.05);
        const c = COLLECTIONS[selectedIdx];
        const panelX = W * 0.50;
        const panelW = W * 0.48;

        // Divider
        ctx.strokeStyle = colors.border || colors.textTer + '30';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(panelX - 6, 32);
        ctx.lineTo(panelX - 6, H - 20);
        ctx.stroke();

        // Layout positions for detail panel
        const titleY = 24;
        const btnRowY = titleY + 22;
        const subtitleY = btnRowY + btnH + 12;
        const stackY = subtitleY + 28;
        const stackH = 28;

        // Title
        ctx.font = '11px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.accent;
        ctx.textAlign = 'left';
        ctx.fillText(c.name, panelX, titleY);

        // Contamination level toggle buttons
        const curMult = contamLevels.find(l => l.id === contamLevel);
        ctx.font = '9px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        ctx.fillText('Prep quality:', panelX, btnRowY + btnH * 0.65);
        let bx = panelX + ctx.measureText('Prep quality: ').width + 4;
        contamLevels.forEach(lev => {
          ctx.font = '9px "JetBrains Mono", monospace';
          const bLabel = lev.label;
          const bw = ctx.measureText(bLabel).width + 12;
          const isActive = lev.id === contamLevel;
          if (isActive) {
            ctx.fillStyle = colors.accent;
            ctx.globalAlpha = 0.15;
            ctx.fillRect(bx, btnRowY, bw, btnH);
            ctx.globalAlpha = 1;
          }
          ctx.strokeStyle = isActive ? colors.accent : (colors.border || colors.textTer + '40');
          ctx.lineWidth = 1;
          ctx.strokeRect(bx, btnRowY, bw, btnH);
          ctx.fillStyle = isActive ? colors.accent : colors.textSec;
          ctx.textAlign = 'center';
          ctx.fillText(bLabel, bx + bw / 2, btnRowY + btnH * 0.65);
          bx += bw + 6;
        });

        // Compute scaled composition
        const sc = getScaled(c);

        // Subtitle — two lines to stay within panel
        ctx.font = '11px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.textTer;
        ctx.textAlign = 'left';
        ctx.fillText(c.genomes + ' genomes | ' + curMult.label + ' (' + curMult.mult + '×)', panelX, subtitleY);
        ctx.font = '9px "JetBrains Mono", monospace';
        ctx.fillText(curMult.desc, panelX, subtitleY + 12);
        const stackW = panelW - 20;
        let sx = panelX;

        compKeys.forEach(key => {
          const pct = sc[key];
          if (pct <= 0) return;
          const segW = stackW * (pct / 100) * detailAnim;
          ctx.fillStyle = compColors[key];
          ctx.globalAlpha = 0.85;
          ctx.fillRect(sx, stackY, segW, stackH);
          ctx.globalAlpha = 1;
          sx += segW;
        });

        // Border around stack
        ctx.strokeStyle = colors.border || colors.textTer + '40';
        ctx.lineWidth = 1;
        ctx.strokeRect(panelX, stackY, stackW * detailAnim, stackH);

        // Percentage labels inside bar
        sx = panelX;
        ctx.font = '12px "JetBrains Mono", monospace';
        ctx.textAlign = 'center';
        compKeys.forEach(key => {
          const pct = sc[key];
          if (pct <= 0) return;
          const segW = stackW * (pct / 100) * detailAnim;
          if (segW > 32) {
            ctx.fillStyle = '#fff';
            ctx.globalAlpha = detailAnim;
            ctx.fillText(pct.toFixed(pct >= 1 ? 0 : 1) + '%', sx + segW / 2, stackY + stackH / 2 + 4);
            ctx.globalAlpha = 1;
          }
          sx += segW;
        });

        // Legend rows below the bar
        const legStartY = stackY + stackH + 18;
        const legColW = panelW * 0.5;
        compKeys.forEach((key, i) => {
          const pct = sc[key];
          if (pct <= 0.01) return;
          const col = i < 5 ? 0 : 1;
          const row = i < 5 ? i : i - 5;
          const lx = panelX + col * legColW;
          const ly = legStartY + row * 18;
          const ap = Math.min(1, detailAnim * 3 - i * 0.15);
          if (ap <= 0) return;
          ctx.globalAlpha = ap;

          ctx.fillStyle = compColors[key];
          ctx.fillRect(lx, ly - 7, 10, 10);

          ctx.font = '11px -apple-system, sans-serif';
          ctx.fillStyle = colors.text;
          ctx.textAlign = 'left';
          ctx.fillText(compLabels[key], lx + 16, ly + 2);

          ctx.font = '11px "JetBrains Mono", monospace';
          ctx.fillStyle = colors.textTer;
          const isScaledKey = scaledKeys.includes(key);
          const labelOffsetX = (key === 'darkmatter' || key === 'viral') ? 130 : 85;
          ctx.fillText(pct.toFixed(pct >= 1 ? 1 : 2) + '%' + (isScaledKey && contamLevel !== 'realistic' ? ' (' + curMult.mult + '×)' : ''), lx + labelOffsetX, ly + 2);
          ctx.globalAlpha = 1;
        });

        // Note
        const noteY = legStartY + 5 * 18 + 10;
        if (detailAnim > 0.8) {
          ctx.globalAlpha = (detailAnim - 0.8) * 5;
          ctx.font = '11px -apple-system, sans-serif';
          ctx.fillStyle = colors.textTer;
          ctx.textAlign = 'left';
          ctx.fillText('Dark matter = unclassified viral sequences (--dark-matter-fraction 0.30)', panelX, noteY);
          ctx.fillText('Host/rRNA/reagent/PhiX scale by level; bacterial/fungal/archaeal do not', panelX, noteY + 16);
          ctx.globalAlpha = 1;
        }
      }

    animFrame = requestAnimationFrame(draw);
  }
  draw();
}

/* === OUTPUT ANIMATION === */
function animateOutput(option, ctx, W, H, colors) {
  showLegend([]);
  let t = 0;

  function draw() {
    t++;
    ctx.clearRect(0, 0, W, H);

    if (option === 'fastq') {
      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'center';
      ctx.fillText('FASTQ Output with Per-Read Labels', W / 2, 24);

      const lines = [
        { text: '@NC_001422.1_42_1/1 source=phix', hl: 'source=phix', hlColor: colors.phix },
        { text: 'ATGAAAGCAATTATTGCTGAAACTGCTGCTCTG', hl: null },
        { text: '+', hl: null },
        { text: 'FFFFFFFFFFFFFFFFFFFFFFFFFFFF:FFFF', hl: null },
        { text: '@GCF_000819615_108_2/1 source=viral', hl: 'source=viral', hlColor: colors.viral },
        { text: 'GCTAACGATCGTAAGCTTGATCGTAAGCTTGAT', hl: null },
        { text: '@T2T_chr1_55_1/1 source=host_dna', hl: 'source=host_dna', hlColor: colors.host },
        { text: 'CAGGTGCAGCTGGTGCAGTCTGGGGCTGAGGTG', hl: null },
      ];

      const startY = 50;
      lines.forEach((line, i) => {
        const progress = Math.min(1, (t - i * 8) / 40);
        if (progress <= 0) return;
        const y = startY + i * 22;
        ctx.font = '11px "JetBrains Mono", monospace';
        ctx.globalAlpha = progress;
        ctx.fillStyle = colors.text;
        const visText = line.text.substring(0, Math.floor(progress * line.text.length));
        ctx.textAlign = 'left';
        ctx.fillText(visText, 30, y);

        if (line.hl && progress > 0.8) {
          const hlIdx = line.text.indexOf(line.hl);
          const beforeW = ctx.measureText(line.text.substring(0, hlIdx)).width;
          const hlW = ctx.measureText(line.hl).width;
          ctx.fillStyle = line.hlColor + '30';
          ctx.fillRect(30 + beforeW - 2, y - 12, hlW + 4, 16);
          ctx.fillStyle = line.hlColor;
          ctx.fillText(line.hl, 30 + beforeW, y);
        }
        ctx.globalAlpha = 1;
      });
    } else if (option === 'metadata') {
      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'center';
      ctx.fillText('Metadata JSON (ground truth)', W / 2, 24);

      const jsonLines = [
        '{',
        '  "collection": "IBD Gut Virome",',
        '  "n_reads": 1000000,',
        '  "platform": "novaseq",',
        '  "enrichment_stats": {',
        '    "viral_enrichment": 14.2,',
        '    "host_reduction": 0.98',
        '  },',
        '  "benchmarking": {',
        '    "expected_coverage": [...],',
        '    "taxonomy": [...]',
        '  }',
        '}',
      ];

      jsonLines.forEach((line, i) => {
        const progress = Math.min(1, (t - i * 6) / 30);
        if (progress <= 0) return;
        ctx.globalAlpha = progress;
        ctx.font = '11px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.text;
        ctx.textAlign = 'left';
        ctx.fillText(line, 40, 50 + i * 18);
        ctx.globalAlpha = 1;
      });
    } else {
      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textSec;
      ctx.textAlign = 'center';
      ctx.fillText('Manifest Files', W / 2, 24);

      const files = [
        { name: 'adapter_manifest.tsv', desc: 'Read ID, adapter type, position' },
        { name: 'duplicate_manifest.tsv', desc: 'Original read, copy count, errors' },
        { name: 'lowcomplex_manifest.tsv', desc: 'Read ID, entropy, repeat type' },
        { name: 'contamination_manifest.tsv', desc: 'Source, count, percentage' },
        { name: 'composition.tsv', desc: 'Genome ID, abundance, reads, family' },
      ];

      files.forEach((f, i) => {
        const y = 55 + i * 48;
        const progress = Math.min(1, (t - i * 15) / 40);
        if (progress <= 0) return;
        ctx.globalAlpha = progress;

        ctx.fillStyle = colors.field || colors.border + '20';
        ctx.fillRect(40, y - 6, W - 80, 38);
        ctx.font = '11px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.accent;
        ctx.textAlign = 'left';
        ctx.fillText(f.name, 52, y + 10);
        ctx.font = '12px -apple-system, sans-serif';
        ctx.fillStyle = colors.textTer;
        ctx.fillText(f.desc, 52, y + 26);

        ctx.globalAlpha = 1;
      });
    }
    animFrame = requestAnimationFrame(draw);
  }
  draw();
}

/* === REPORT ANIMATION === */
function animateReport(ctx, W, H, colors) {
  showLegend([]);
  let t = 0;

  function draw() {
    t++;
    ctx.clearRect(0, 0, W, H);

    ctx.font = '11px "JetBrains Mono", monospace';
    ctx.fillStyle = colors.textSec;
    ctx.textAlign = 'center';
    ctx.fillText('Auto-Generated HTML Diagnostic Report', W / 2, 24);

    const plots = [
      { name: 'Composition Pie', x: 0, y: 0 },
      { name: 'VLP Before/After', x: 1, y: 0 },
      { name: 'Family Distribution', x: 2, y: 0 },
      { name: 'Rank-Abundance', x: 3, y: 0 },
      { name: 'GC Histogram', x: 0, y: 1 },
      { name: 'Length vs Abundance', x: 1, y: 1 },
      { name: 'Contamination Table', x: 2, y: 1 },
      { name: 'Artifact Summary', x: 3, y: 1 },
    ];

    const gridW = (W - 60) / 4, gridH = (H - 80) / 2;
    const rng = mulberry32(33);

    plots.forEach((p, i) => {
      const progress = Math.min(1, (t - i * 18) / 50);
      if (progress <= 0) return;
      const px = 20 + p.x * gridW, py = 45 + p.y * gridH;

      ctx.globalAlpha = progress;
      ctx.fillStyle = colors.field || colors.border + '15';
      ctx.fillRect(px + 4, py + 4, gridW - 8, gridH - 8);
      ctx.strokeStyle = colors.border;
      ctx.lineWidth = 1;
      ctx.strokeRect(px + 4, py + 4, gridW - 8, gridH - 8);

      // Mini chart placeholder
      ctx.fillStyle = colors.accent + '60';
      if (i < 4) {
        for (let b = 0; b < 5; b++) {
          const bh = rng() * (gridH * 0.5) * progress;
          ctx.fillRect(px + 14 + b * 18, py + gridH - 18 - bh, 12, bh);
        }
      } else {
        ctx.beginPath();
        ctx.strokeStyle = colors.accent;
        ctx.lineWidth = 1.5;
        for (let x = 0; x < 6; x++) {
          const lx = px + 14 + x * 18;
          const ly = py + 20 + rng() * gridH * 0.4;
          if (x === 0) ctx.moveTo(lx, ly); else ctx.lineTo(lx, ly);
        }
        ctx.stroke();
      }

      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      ctx.fillText(p.name, px + gridW / 2, py + gridH - 4);
      ctx.globalAlpha = 1;
    });

    animFrame = requestAnimationFrame(draw);
  }
  draw();
}

/* === BENCHMARK ANIMATION === */
function animateBenchmark(option, ctx, W, H, colors) {
  showLegend([]);
  let t = 0;
  const rng = mulberry32(88);

  function draw() {
    t++;
    ctx.clearRect(0, 0, W, H);

    const titles = {
      qc: 'QC Benchmark: Contamination Removal Accuracy',
      assembly: 'Assembly Benchmark: Genome Recovery',
      taxonomy: 'Taxonomy Benchmark: Classification Accuracy'
    };
    ctx.font = '11px "JetBrains Mono", monospace';
    ctx.fillStyle = colors.textSec;
    ctx.textAlign = 'center';
    ctx.fillText(titles[option] || '', W / 2, 24);

    if (option === 'qc') {
      const metrics = [
        { name: 'Viral Retention', value: 0.97, target: 0.97 },
        { name: 'Host Removal', value: 0.98, target: 0.98 },
        { name: 'rRNA Removal', value: 0.95, target: 0.95 },
        { name: 'PhiX Removal', value: 0.99, target: 0.99 },
        { name: 'Duplicate Removal', value: 0.92, target: 0.92 },
      ];

      metrics.forEach((m, i) => {
        const progress = Math.min(1, (t - i * 15) / 60);
        if (progress <= 0) return;
        const y = 55 + i * 46;
        const barW = W * 0.5;

        ctx.font = '12px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.textSec;
        ctx.textAlign = 'right';
        ctx.fillText(m.name, W * 0.28, y + 10);

        // Background bar
        ctx.fillStyle = colors.field || colors.border + '20';
        ctx.fillRect(W * 0.3, y, barW, 16);

        // Value bar
        const filledW = barW * m.value * progress;
        ctx.fillStyle = m.value > 0.9 ? colors.accent : colors.warm;
        ctx.fillRect(W * 0.3, y, filledW, 16);

        // Percentage
        ctx.fillStyle = colors.text;
        ctx.textAlign = 'left';
        ctx.fillText((m.value * 100 * progress).toFixed(1) + '%', W * 0.3 + barW + 8, y + 12);
      });

    } else if (option === 'assembly') {
      const genomes = [];
      for (let i = 0; i < 12; i++) {
        genomes.push({ completeness: 0.3 + rng() * 0.7, identity: 0.95 + rng() * 0.05 });
      }

      const plotL = W * 0.15, plotR = W * 0.85, plotT = 50, plotB = H - 50;
      // Axes
      ctx.strokeStyle = colors.border;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(plotL, plotT); ctx.lineTo(plotL, plotB); ctx.lineTo(plotR, plotB);
      ctx.stroke();

      ctx.font = '11px "JetBrains Mono", monospace';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      ctx.fillText('Completeness (%)', (plotL + plotR) / 2, plotB + 30);
      ctx.save();
      ctx.translate(plotL - 30, (plotT + plotB) / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText('Identity (%)', 0, 0);
      ctx.restore();

      genomes.forEach((g, i) => {
        const progress = Math.min(1, (t - i * 8) / 40);
        if (progress <= 0) return;
        const x = plotL + g.completeness * (plotR - plotL) * progress;
        const y = plotB - (g.identity - 0.9) / 0.1 * (plotB - plotT) * progress;
        ctx.globalAlpha = progress;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fillStyle = g.completeness > 0.8 ? colors.accent : colors.warm;
        ctx.fill();
        ctx.globalAlpha = 1;
      });

    } else {
      // Taxonomy
      const ranks = ['Exact TaxID', 'Genus', 'Family'];
      const values = [0.72, 0.85, 0.93];

      ranks.forEach((r, i) => {
        const progress = Math.min(1, (t - i * 18) / 60);
        if (progress <= 0) return;
        const y = 70 + i * 70;

        ctx.font = '11px "JetBrains Mono", monospace';
        ctx.fillStyle = colors.textSec;
        ctx.textAlign = 'right';
        ctx.fillText(r, W * 0.25, y + 12);

        const barW = W * 0.5;
        ctx.fillStyle = colors.field || colors.border + '20';
        ctx.fillRect(W * 0.28, y, barW, 20);

        ctx.fillStyle = colors.accent;
        ctx.fillRect(W * 0.28, y, barW * values[i] * progress, 20);

        ctx.fillStyle = colors.text;
        ctx.textAlign = 'left';
        ctx.fillText((values[i] * 100 * progress).toFixed(1) + '%', W * 0.28 + barW + 8, y + 14);
      });

      ctx.font = '12px -apple-system, sans-serif';
      ctx.fillStyle = colors.textTer;
      ctx.textAlign = 'center';
      ctx.fillText('Auto-detects: Kraken2, Centrifuge, DIAMOND, MMseqs2, Kaiju, generic', W / 2, H - 20);
    }

    animFrame = requestAnimationFrame(draw);
  }
  draw();
}

/* Info cards */
function renderInfo(stepId, option) {}

/* Seeded PRNG */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}
